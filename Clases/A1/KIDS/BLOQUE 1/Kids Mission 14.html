<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Growie Kids — Mission 14 — In My Bag</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1c2b5e;
  --navy-dark:#111c40;
  --orange:#f97316;
  --orange-light:#fdba74;
  --green:#22c55e;
  --green-dark:#15803d;
  --cream:#fef3e2;
  --yellow:#fbbf24;
  --white:#ffffff;
  --shadow:0 18px 40px rgba(28,43,94,.35);
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--navy-dark);}
h1,h2,h3,.font-baloo{font-family:'Baloo 2',cursive;}

/* ══════════ ESTRUCTURA DE SLIDES ══════════ */
.stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transform:translateX(40px);
  transition:opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
  background-size:cover;background-position:center;
}
.slide.active{
  opacity:1;visibility:visible;transform:translateX(0);
  transition:opacity .45s ease, transform .45s ease;
  z-index:2;
}
.slide.prevslide{transform:translateX(-40px)}

/* ── Slide 1: Portada ── */
.slide-cover{background:none;}
.cover-blur-bg{
  position:absolute;inset:0;z-index:0;
  background-image:url('https://raw.githubusercontent.com/ergutza-lab/organic-english-classes/main/imagenes/Kids/Mission%2012/PORTADA.jpg');
  background-size:cover;background-position:center;
  filter:blur(28px) brightness(.55) saturate(1.1);
  transform:scale(1.15);
}
.cover-img{
  position:absolute;inset:0;z-index:1;
  width:100%;height:100%;object-fit:contain;
}

.slide-content{align-items:flex-start}
.slide-content{background-image:url('https://raw.githubusercontent.com/ergutza-lab/organic-english-classes/main/imagenes/Kids/Mission%2001/FONDO%20SLIDES%20KIDS.webp');}
.mission-badge{
  position:absolute;top:22px;left:22px;z-index:5;
  background:var(--orange);color:#fff;font-weight:700;font-size:13px;
  padding:8px 16px;border-radius:100px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;
}
.mission-badge .leaf-spin{display:inline-block;animation:spin 3s linear infinite}

.slide-grid{
  display:grid;grid-template-columns:1fr 1.15fr;align-items:start;gap:36px;
  max-width:1280px;width:92vw;padding:96px 40px 28px;
}
.col-text{display:flex;flex-direction:column;gap:9px;align-items:flex-start;max-height:calc(100vh - 150px);overflow-y:auto;padding-right:6px}
.slide-emoji{
  align-self:center;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(56px,8vw,100px);height:clamp(56px,8vw,100px);line-height:1;
  opacity:0;transform:scale(.3) rotate(-15deg);
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.25));
  cursor:default;
}
.slide.active .slide-emoji{animation:popBounce .6s cubic-bezier(.34,1.56,.64,1) 0s forwards}
.slide-emoji.settled{
  opacity:1;transform:scale(1) rotate(0deg);
  transition:transform .2s ease, filter .2s ease;
}
.slide-emoji.settled:hover{
  transform:scale(1.18) rotate(10deg);
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.35));
}
.slide-title{
  font-size:clamp(24px,3.2vw,38px);font-weight:800;line-height:1.05;color:var(--navy);
  text-shadow:0 0 14px rgba(255,255,255,.85), 0 2px 0 rgba(0,0,0,.12);
  background:linear-gradient(135deg, var(--orange) 0%, #ea580c 100%);
  padding:8px 20px;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.25);
  opacity:0;transform:translateY(-18px) scale(.9);
  cursor:default;
}
.slide.active .slide-title{animation:popDrop .55s cubic-bezier(.34,1.56,.64,1) .05s forwards}
.slide-title.settled{
  opacity:1;transform:translateY(0) scale(1);
  transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
}
.slide-title.settled:hover{
  transform:scale(1.06) rotate(-1deg);
  box-shadow:0 14px 30px rgba(0,0,0,.35), 0 0 0 4px rgba(255,255,255,.5);
  filter:brightness(1.12) saturate(1.15);
}

.phrase-col{display:flex;flex-direction:column;gap:7px;width:100%}
.phrase-card{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(15px,1.9vw,21px);color:#fff;
  padding:9px 18px;border-radius:16px;
  box-shadow:0 10px 22px rgba(0,0,0,.22);
  opacity:0;transform:translateX(-40px) scale(.85);
  width:fit-content;max-width:100%;
  cursor:pointer;
}
.slide.active .phrase-card{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
.phrase-card.settled{
  opacity:1;transform:translateX(0) scale(1);
  transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
}
.phrase-card.settled:hover{
  transform:scale(1.1) rotate(-2deg);
  box-shadow:0 16px 32px rgba(0,0,0,.32), 0 0 0 4px rgba(255,255,255,.6);
  filter:brightness(1.15) saturate(1.2);
}
.phrase-card.c0{background:linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%)}
.phrase-card.c1{background:linear-gradient(135deg, var(--orange) 0%, #ea580c 100%)}
.phrase-card.c2{background:linear-gradient(135deg, #38bdf8 0%, #0284c7 100%)}
.phrase-card.c3{background:linear-gradient(135deg, var(--yellow) 0%, #d97706 100%);color:var(--navy);text-shadow:none}
.phrase-card.c4{background:linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%)}
.phrase-card.c5{background:linear-gradient(135deg, #fb7185 0%, #e11d48 100%)}

.col-image{display:flex;align-items:center;justify-content:center;align-self:center}
.slide-img-wrap{
  border-radius:28px;overflow:hidden;box-shadow:var(--shadow);
  border:7px solid #fff;line-height:0;
  width:min(78vh, 62vh, 100%);aspect-ratio:1/1;max-width:100%;
  display:flex;align-items:center;justify-content:center;
  background:#0f1a3d;
  animation:floatY 4.5s ease-in-out infinite;
}
.slide-img-wrap img{display:block;width:100%;height:100%;object-fit:cover;}

@keyframes popIn{
  0%{opacity:0;transform:translateX(-40px) scale(.85)}
  60%{opacity:1;transform:translateX(6px) scale(1.04)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
@keyframes popBounce{
  0%{opacity:0;transform:scale(.3) rotate(-15deg)}
  50%{opacity:1;transform:scale(1.15) rotate(6deg)}
  75%{transform:scale(.95) rotate(-3deg)}
  100%{opacity:1;transform:scale(1) rotate(0deg)}
}
@keyframes popDrop{
  0%{opacity:0;transform:translateY(-18px) scale(.9)}
  60%{opacity:1;transform:translateY(4px) scale(1.03)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes floatY{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

/* ══════════ NAVEGACIÓN ══════════ */
.nav-controls{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:14px;
  background:rgba(17,28,64,.85);backdrop-filter:blur(6px);
  padding:10px 18px;border-radius:100px;box-shadow:0 10px 26px rgba(0,0,0,.35);
}
.nav-btn{
  width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  background:var(--orange);color:#fff;font-size:18px;font-weight:800;
  display:flex;align-items:center;justify-content:center;transition:transform .15s, opacity .15s;
}
.nav-btn:hover:not(:disabled){transform:scale(1.1)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:all .2s;border:none;padding:0}
.dot.active{background:var(--orange);width:22px;border-radius:6px}
.dot:hover{background:rgba(255,255,255,.6)}
.slide-counter{color:#fff;font-size:12px;font-weight:600;min-width:38px;text-align:center}

/* ══════════ PANEL DE NOTAS DEL PROFESOR ══════════ */
.notes-toggle{
  position:fixed;top:22px;right:22px;z-index:25;
  background:var(--navy);color:#fff;border:none;border-radius:100px;
  padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;
  font-family:'DM Sans',sans-serif;transition:transform .15s;
}
.notes-toggle:hover{transform:scale(1.04)}
.notes-panel{
  position:fixed;top:0;right:0;height:100vh;width:min(420px,92vw);
  background:#fff;z-index:30;box-shadow:-16px 0 40px rgba(0,0,0,.35);
  transform:translateX(100%);transition:transform .3s ease;
  overflow-y:auto;padding:24px 22px 40px;
}
.notes-panel.open{transform:translateX(0)}
.notes-close{
  position:absolute;top:16px;right:16px;background:#f1f5f9;border:none;
  width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--navy);
}
.notes-header{
  font-weight:800;font-size:20px;color:var(--navy);margin:6px 0 2px;padding-right:40px;
}
.notes-sub{color:var(--orange);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:18px}
.notes-block{margin-bottom:16px}
.notes-label{
  font-size:11px;font-weight:800;color:#fff;background:var(--navy);
  display:inline-block;padding:3px 10px;border-radius:6px;letter-spacing:.5px;margin-bottom:6px;
}
.notes-text{font-size:14px;color:#334155;line-height:1.55;white-space:pre-line}
.notes-overlay{
  position:fixed;inset:0;background:rgba(17,28,64,.4);z-index:29;
  opacity:0;visibility:hidden;transition:opacity .3s;
}
.notes-overlay.open{opacity:1;visibility:visible}

/* ══════════ RESPONSIVE ══════════ */
@media(max-width:900px){
  .slide-grid{grid-template-columns:1fr;padding:78px 18px 16px;gap:16px;width:94vw}
  .col-image{order:2}
  .col-text{order:1;align-items:center;text-align:center}
  .slide-emoji{font-size:clamp(56px,16vw,90px);height:clamp(56px,16vw,90px)}
  .slide-title{font-size:22px;padding:8px 20px;text-align:center}
  .phrase-col{align-items:center}
  .phrase-card{font-size:16px;padding:10px 18px;width:auto}
  .slide-img-wrap{max-height:38vh;animation:none}
  .slide-img-wrap img{max-height:38vh}
  .mission-badge{font-size:11px;padding:6px 12px;top:14px;left:14px}
  .notes-toggle{padding:8px 12px;font-size:11px;top:14px;right:14px}
  .nav-controls{padding:7px 12px;gap:8px}
  .nav-btn{width:32px;height:32px;font-size:15px}
}
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<button class="notes-toggle" id="notesToggle">🧑‍🏫 <span>Teacher Notes:</span></button>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn" aria-label="Anterior">‹</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn" aria-label="Siguiente">›</button>
</div>
<div class="slide-counter" id="counter" style="position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:20;"></div>

<div class="notes-overlay" id="notesOverlay"></div>
<aside class="notes-panel" id="notesPanel">
  <button class="notes-close" id="notesClose">✕</button>
  <div class="notes-header" id="notesTitle"></div>
  <div class="notes-sub" id="notesStage"></div>
  <div id="notesBody"></div>
</aside>



<script>
const IMG_BASE = "https://raw.githubusercontent.com/ergutza-lab/organic-english-classes/main/imagenes/Kids/Mission%2014/";
const PORTADA = IMG_BASE + "PORTADA.jpg";
const slideImg = n => IMG_BASE + "SLIDE%20" + n + ".jpg";

const SLIDES = [
{
n:1, cover:true,
notes:{
STAGE:"Mission Start / Cover Image",
TIMING:"5 minutes",
"WHAT TO DO":"Welcome students using only the cover image. Briefly connect with Mission 13: students helped Growie identify the Explorer Tools. Point to the new magical backpacks and the objects appearing from one bag. Build curiosity. Students may name objects they remember from Mission 13. Introduce the idea that today Growie wants to know what the Explorers have in their bags, but do not formally teach the full chunk yet.",
SAY:"Welcome back, Explorers! · Look at the Explorer Treehouse! · The Explorer Tools are ready! · But look! · New backpacks! · Wow! · What's this? · A notebook! · A pencil! · Look inside the bag! · Growie wants to know: What's in the bag? · Can we help Growie? · Are you ready for Mission 14?",
"INSTRUCTIONS FOR STUDENTS":"Look. · Listen. · Look inside the backpack. · Name an object if you can. · Say: I'm ready!",
"WHAT NOT TO DO":"Do not place visible HTML text over the cover. Do not introduce all the target sentences immediately. Do not explain HAVE grammatically. Do not teach there is / there are. Do not teach classroom instructions. Do not require students to show a real backpack.",
FOCUS:"Curiosity, continuity and the shift from identifying objects to talking about personal possessions.",
"PEDAGOGICAL INTENTION":"Students understand the new communication problem before receiving the language needed to solve it.",
"KEY UPGRADE":"Mission 14 reuses familiar objects but gives them a new communicative purpose.",
"CRITICAL ERROR":"Do not treat Mission 14 as another What's This? lesson.",
"PRO TIP":"Point to one object and ask: What's this? After students answer, point to the backpack and say: Great. Now... in my bag.",
"FINAL CHECKLIST":"Students were welcomed. · Mission 13 was connected to Mission 14. · Students recognized some familiar objects. · Students noticed the magical Explorer Bags. · Students understand a new task is beginning. · No grammar explanation was given."
}
},
{
n:2, title:"What's in the Bag?", emoji:"🎒",
phrases:["Look inside!","Notebook","Pencil","Water bottle","Pencil case","Keys","Bag"],
notes:{
STAGE:"Warm-up Game / Activation",
TIMING:"5 minutes",
"WHAT TO DO":"Use one open fictional backpack containing several objects. Students look, find and point. Review notebook and pencil from Mission 13, then introduce water bottle, pencil case and keys. Keep the activity fast and visual. Students do not need to produce possession sentences yet.",
SAY:"Look inside the bag! · Find the notebook. · Point! · Find the pencil. · Great! · Water bottle! · Repeat: water bottle. · Pencil case! · Keys! · What's in the bag? · Look carefully! · I say the object. · You point!",
"INSTRUCTIONS FOR STUDENTS":"Look. · Find. · Point. · Repeat. · Use your Explorer eyes.",
"WHAT NOT TO DO":"Do not teach all the words as a written vocabulary list. Do not ask students to memorize them immediately. Do not introduce there is / there are. Do not introduce classroom commands from Mission 15. Do not correct every pronunciation detail.",
FOCUS:"Recognition of personal objects inside a meaningful bag context.",
"PEDAGOGICAL INTENTION":"Students connect familiar and new object vocabulary with the central context of the mission.",
"KEY UPGRADE":"Objects are no longer isolated cards; they now belong to an Explorer Bag.",
"CRITICAL ERROR":"Do not spend the full five minutes on choral repetition only.",
"PRO TIP":"Use a fast visual challenge: Find pencil! Find keys! Find water bottle!",
"FINAL CHECKLIST":"Students recognized notebook. · Students recognized pencil. · Students heard water bottle. · Students heard pencil case. · Students heard keys. · Students understood that the objects are inside an Explorer Bag. · Everyone participated."
}
},
{
n:3, title:"Mia's Explorer Bag", emoji:"🎒",
phrases:["What's in your bag?","In my bag, I have a notebook.","I have a pencil.","I have a notebook and a pencil.","Leo has an Explorer Bag too!"],
notes:{
STAGE:"Story Time",
TIMING:"6 minutes",
"WHAT TO DO":"Tell the story visually. Students listen to the complete scene first. Point to the bag and each object while saying the chunks. Do not ask students to repeat immediately. After listening, ask simple comprehension questions. Then retell the key exchanges and have students repeat the answers.",
SAY:"Look! Mia has an Explorer Bag. · Growie asks: What's in your bag? · Mia opens the bag. · Mia says: In my bag, I have a notebook and a pencil. · Look! The bag is glowing! · Leo has a bag too. · Growie asks: What's in your bag? · Leo says: In my bag, I have a water bottle and a pencil case. · The Explorer Bags are getting ready! · Listen again.",
"INSTRUCTIONS FOR STUDENTS":"Look. · Listen first. · Look inside each bag. · Point to the objects. · Repeat after the story.",
"WHAT NOT TO DO":"Do not translate the story line by line. Do not explain HAVE as a verb rule. Do not explain possessive grammar. Do not introduce there is / there are. Do not ask students to read before they understand the story. Do not make the story too long.",
FOCUS:"Meaning of I have... inside a personal-object context.",
"PEDAGOGICAL INTENTION":"Students hear possession language naturally before they are asked to analyze or use it.",
"KEY UPGRADE":"The Explorer Bag creates an authentic reason for students to say what they have.",
"CRITICAL ERROR":"Do not skip listening comprehension.",
"PRO TIP":"On the second telling, pause: In my bag, I have a notebook and a... Students complete: pencil!",
"FINAL CHECKLIST":"Students listened first. · Students understood what Mia has. · Students understood what Leo has. · Students heard What's in your bag? · Students heard In my bag, I have... · Students connected objects with personal possession."
}
},
{
n:4, title:"Let's Discover!", emoji:"🔍",
phrases:["I have a notebook.","I have a pencil.","I have a water bottle.","I have a pencil case.","I have keys.","In my bag, I have ___."],
notes:{
STAGE:"Guided Discovery",
TIMING:"6 minutes",
"WHAT TO DO":"Return to Mia and Leo's bags. Point to a character, then the bag, then an object. Ask students what phrase they heard when Mia talked about her objects. Guide them toward I have... without grammar terminology. Use several visual substitutions.",
SAY:"Look at Mia again. · Notebook. · Mia says: I have a notebook. · Pencil. · I have a pencil. · Now Leo. · Water bottle. · I have a water bottle. · Pencil case. · I have a pencil case. · Look at the keys. · I have keys. · Now say: In my bag, I have... · Great discovering!",
"INSTRUCTIONS FOR STUDENTS":"Look. · Point. · Choose an object. · Complete: I have a ___. · Complete: In my bag, I have ___.",
"WHAT NOT TO DO":"Do not explain verb conjugation. Do not translate HAVE repeatedly. Do not explain singular/plural grammar with keys. Do not introduce there is / there are. Do not give all answers before students think. Do not add a large number of objects.",
FOCUS:"I have + personal object.",
"PEDAGOGICAL INTENTION":"Students infer possession meaning through the visual relationship among Explorer, bag and object.",
"KEY UPGRADE":"Students discover the function from context rather than receiving a grammar rule.",
"CRITICAL ERROR":"Do not let the stage become only object identification. Mission 14's new objective is possession.",
"PRO TIP":"Contrast quickly: Teacher points to object only: What's this? Students: It's a pencil. Teacher points to Mia + bag: Mia says? Students: I have a pencil.",
"FINAL CHECKLIST":"Students differentiated It's a pencil from I have a pencil. · Students used I have a notebook. · Students used I have a pencil. · Students heard I have keys naturally. · Students practiced In my bag, I have ___. · No grammar lecture was given."
}
},
{
n:5, title:"Explorer Bag Power!", emoji:"✨",
phrases:["I have a notebook.","I have a pencil.","I have a water bottle.","I have a pencil case.","I have keys.","In my bag, I have ___ and ___."],
notes:{
STAGE:"Visual Focus",
TIMING:"6 minutes",
"WHAT TO DO":"Use visual object cards beside an Explorer Bag. Model one-object sentences first. Then select two cards and combine them with and. Students repeat. After several examples, students choose the two objects and complete the sentence themselves.",
SAY:"Explorer Bag Power! · Look at the notebook. · I have a notebook. · Pencil. · I have a pencil. · Now two objects! · Notebook and pencil. · In my bag, I have a notebook and a pencil. · Water bottle and pencil case. · In my bag, I have a water bottle and a pencil case. · Now you choose two!",
"INSTRUCTIONS FOR STUDENTS":"Look. · Choose one object. · Say: I have a ___. · Choose two objects. · Say: In my bag, I have ___ and ___.",
"WHAT NOT TO DO":"Do not explain AND grammatically. Do not teach sentence formulas. Do not demand three or four objects yet. Do not remove visual support. Do not introduce classroom instructions. Do not introduce there is / there are.",
FOCUS:"Fluent supported production of one- and two-object possession statements.",
"PEDAGOGICAL INTENTION":"Students move from single chunks to a very short expanded description.",
"KEY UPGRADE":"Students begin combining personal objects into a meaningful description instead of repeating isolated vocabulary.",
"CRITICAL ERROR":"Do not make students memorize all possible combinations.",
"PRO TIP":"Let students physically or digitally choose two cards. Choice increases engagement and makes the sentence genuinely communicative.",
"FINAL CHECKLIST":"Students produced I have a ___. · Students used several object words. · Students heard and used AND. · Students produced In my bag, I have ___ and ___. · Visual support remained available."
}
},
{
n:6, title:"Pack with Growie!", emoji:"🤝",
phrases:["What's in your bag?","In my bag, I have ___.","Choose 2 objects!","Say both objects!","Listen to your friends!","Everyone participates!"],
notes:{
STAGE:"Group Practice",
TIMING:"6 minutes",
"WHAT TO DO":"Lead multiple whole-class rounds. Show a fictional Explorer Bag with two objects. Teacher asks What's in your bag? Class answers together. Then reverse roles: class asks and teacher answers. Finally assign individual students different two-object combinations. Make sure every student participates.",
SAY:"Now pack with Growie! · Look at this Explorer Bag. · What's in your bag? · Everybody: In my bag, I have a notebook and a pencil. · Great! · New bag! · What's in your bag? · In my bag, I have a water bottle and a pencil case. · Now you ask me! · Everybody: What's in your bag? · Great! · Now one Explorer at a time. · Choose two objects. · Say both. · Everyone participates!",
"INSTRUCTIONS FOR STUDENTS":"Look. · Ask the question. · Choose two objects. · Say: In my bag, I have ___ and ___. · Listen to your friends. · Everyone participates.",
"WHAT NOT TO DO":"Do not move to pair practice before modeling. Do not ask only confident students. Do not remove sentence support. Do not require real objects. Do not introduce classroom commands. Do not correct every small pronunciation error.",
FOCUS:"Controlled oral communication about personal objects.",
"PEDAGOGICAL INTENTION":"Students build confidence using complete possession chunks before freer production.",
"KEY UPGRADE":"The group activity simulates packing Explorer Bags rather than completing a mechanical grammar drill.",
"CRITICAL ERROR":"Do not practice only answers. Students should also hear and practice: What's in your bag?",
"PRO TIP":"Divide the class temporarily: Question Team: What's in your bag? Answer Team: In my bag, I have ___ and ___. Then switch.",
"FINAL CHECKLIST":"Students asked What's in your bag? · Students answered with I have / In my bag, I have. · Students combined two objects. · Multiple object combinations were practiced. · Every student participated."
}
},
{
n:7, title:"Your Turn", emoji:"🎤",
phrases:["Choose an Explorer Bag.","What's in your bag?","In my bag, I have ___ and ___.","Add one more object!","Listen.","Change roles!"],
notes:{
STAGE:"Free Production",
TIMING:"8 minutes",
"WHAT TO DO":"Provide several fictional Explorer Bag cards containing different object combinations. Student A chooses a bag. Student B asks What's in your bag? Student A describes two objects. Stronger or more confident students may add a third object. Then change roles. Students may use a real backpack only if they voluntarily want to.",
SAY:"Now it's your turn! · Choose an Explorer Bag. · A pretend bag is okay. · Your partner asks: What's in your bag? · Answer: In my bag, I have ___ and ___. · If you can, add one more object. · Then change roles. · Use the slide. · Reading is okay. · Simple is okay.",
"INSTRUCTIONS FOR STUDENTS":"Choose a bag. · Ask What's in your bag? · Say two objects. · Add a third object if you can. · Listen. · Change roles. · Help your partner.",
"WHAT NOT TO DO":"Do not require students to show a real backpack. Do not ask students to reveal expensive or private belongings. Do not demand memorization. Do not remove visual support. Do not constantly interrupt for correction. Do not teach there is / there are. Do not introduce Mission 15 commands.",
FOCUS:"Independent but supported communication about personal objects.",
"PEDAGOGICAL INTENTION":"Students personalize the language through choice while remaining safe and supported.",

let current = 1;
const total = SLIDES.length;

function buildSlideEl(s){
  const el = document.createElement('section');
  el.className = 'slide';
  el.dataset.n = s.n;

  if (s.cover) {
    el.classList.add('slide-cover');
    el.innerHTML = `
      <div class="cover-blur-bg"></div>
      <img class="cover-img" src="${PORTADA}" alt="Growie Kids Mission 14">`;
  } else {
    el.classList.add('slide-content');
    const colorClasses = ['c0','c1','c2','c3','c4','c5'];
    const chips = (s.phrases||[]).map((p,i) => `<div class="phrase-card ${colorClasses[i % colorClasses.length]}" style="animation-delay:${0.15 + i*0.12}s">${p}</div>`).join('');
    el.innerHTML = `
      <div class="mission-badge"><span class="leaf-spin">🍃</span> Mission 14 · Slide ${s.n} / ${total}</div>
      <div class="slide-grid">
        <div class="col-text">
          <div class="slide-emoji">${s.emoji}</div>
          <div class="slide-title">${s.title}</div>
          <div class="phrase-col">${chips}</div>
        </div>
        <div class="col-image">
          <div class="slide-img-wrap"><img src="${slideImg(s.n)}" alt="${s.title}"></div>
        </div>
      </div>`;
  }
  return el;
}

function initStage(){
  const stage = document.getElementById('stage');
  SLIDES.forEach(s => stage.appendChild(buildSlideEl(s)));

  const dotsWrap = document.getElementById('dots');
  SLIDES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'dot';
    b.setAttribute('aria-label', 'Slide ' + s.n);
    b.onclick = () => goTo(s.n);
    dotsWrap.appendChild(b);
  });
}

function goTo(n){
  if (n < 1 || n > total) return;
  const prev = current;
  current = n;
  document.querySelectorAll('.slide').forEach(el => {
    const en = parseInt(el.dataset.n, 10);
    const isActive = en === n;
    el.classList.toggle('active', isActive);
    if (!isActive) {
      el.querySelectorAll('.phrase-card, .slide-title, .slide-emoji').forEach(box => {
        box.classList.remove('settled');
        box.style.animation = '';
      });
    }
  });
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i === n-1));
  document.getElementById('prevBtn').disabled = n === 1;
  document.getElementById('nextBtn').disabled = n === total;
  document.getElementById('counter').textContent = n + ' / ' + total;
  renderNotes(n);
}

document.addEventListener('animationend', e => {
  if (e.target.matches('.phrase-card, .slide-title, .slide-emoji')) {
    e.target.style.animation = 'none';
    e.target.classList.add('settled');
  }
});

function renderNotes(n){
  const s = SLIDES.find(x => x.n === n);
  document.getElementById('notesTitle').textContent = 'Slide ' + n + (s.title ? ' — ' + s.title : '');
  document.getElementById('notesStage').textContent = s.notes.STAGE + ' · ' + s.notes.TIMING;
  const order = ["WHAT TO DO","SAY","INSTRUCTIONS FOR STUDENTS","WHAT NOT TO DO","FOCUS","PEDAGOGICAL INTENTION","KEY UPGRADE","CRITICAL ERROR","PRO TIP","FINAL CHECKLIST"];
  const body = document.getElementById('notesBody');
  body.innerHTML = order.map(k => `
    <div class="notes-block">
      <div class="notes-label">${k}</div>
      <div class="notes-text">${s.notes[k]}</div>
    </div>`).join('');
}

document.getElementById('prevBtn').onclick = () => goTo(current - 1);
document.getElementById('nextBtn').onclick = () => goTo(current + 1);

const notesPanel = document.getElementById('notesPanel');
const notesOverlay = document.getElementById('notesOverlay');
document.getElementById('notesToggle').onclick = () => {
  notesPanel.classList.add('open');
  notesOverlay.classList.add('open');
};
function closeNotes(){
  notesPanel.classList.remove('open');
  notesOverlay.classList.remove('open');
}
document.getElementById('notesClose').onclick = closeNotes;
notesOverlay.onclick = closeNotes;

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
  if (e.key === 'Escape') closeNotes();
});

initStage();
goTo(1);
</script>

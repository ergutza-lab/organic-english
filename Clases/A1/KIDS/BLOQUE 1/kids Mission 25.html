<script>
window.__toJsDelivr = function(url){
  if (!url) return null;
  var m = url.match(/^https:\/\/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/([^\/]+)\/(.+)$/);
  if (m) return "https://cdn.jsdelivr.net/gh/" + m[1] + "/" + m[2] + "@" + m[3] + "/" + m[4];
  var m2 = url.match(/^https:\/\/github\.com\/([^\/]+)\/([^\/]+)\/(?:raw|blob)\/([^\/]+)\/(.+)$/);
  if (m2) return "https://cdn.jsdelivr.net/gh/" + m2[1] + "/" + m2[2] + "@" + m2[3] + "/" + m2[4];
  return null;
};
window.__imgFallback = function(el){
  try{
    var cur = el.getAttribute('src') || el.src || '';
    if (!cur || cur.indexOf('jsdelivr.net') !== -1) return;
    var fb = window.__toJsDelivr(cur);
    if (fb && fb !== cur) el.src = fb;
  }catch(e){}
};
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Growie Kids — Mission 25 — I Wake Up at 7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1c2b5e;
  --navy-dark:#111c40;
  --orange:#f97316;
  --orange-light:#fdba74;
  --green:#22c55e;
  --green-dark:#15803d;
  --cream:#fef3e2;
  --yellow:#fbbf24;
  --white:#ffffff;
  --shadow:0 18px 40px rgba(28,43,94,.35);
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--navy-dark);}
h1,h2,h3,.font-baloo{font-family:'Baloo 2',cursive;}

/* ══════════ ESTRUCTURA DE SLIDES ══════════ */
.stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transform:translateX(40px);
  transition:opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
  background-size:cover;background-position:center;
}
.slide.active{
  opacity:1;visibility:visible;transform:translateX(0);
  transition:opacity .45s ease, transform .45s ease;
  z-index:2;
}
.slide.prevslide{transform:translateX(-40px)}

/* ── Slide 1: Portada ── */
.slide-cover{background:none;}
.cover-blur-bg{
  position:absolute;inset:0;z-index:0;
  background-image:url('https://raw.githubusercontent.com/ergutza-lab/organic-english-classes/main/imagenes/Kids/Mission%2012/PORTADA.jpg');
  background-size:cover;background-position:center;
  filter:blur(28px) brightness(.55) saturate(1.1);
  transform:scale(1.15);
}
.cover-img{
  position:absolute;inset:0;z-index:1;
  width:100%;height:100%;object-fit:contain;
}

.slide-content{align-items:flex-start}
.slide-content{background-image:url('https://raw.githubusercontent.com/ergutza-lab/organic-english-classes/main/imagenes/Kids/Mission%2001/FONDO%20SLIDES%20KIDS.webp');}
.mission-badge{
  position:absolute;top:22px;left:22px;z-index:5;
  background:var(--orange);color:#fff;font-weight:700;font-size:13px;
  padding:8px 16px;border-radius:100px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;
}
.mission-badge .leaf-spin{display:inline-block;animation:spin 3s linear infinite}

.slide-grid{
  display:grid;grid-template-columns:1fr 1.15fr;align-items:start;gap:36px;
  max-width:1280px;width:92vw;padding:96px 40px 28px;
}
.col-text{display:flex;flex-direction:column;gap:9px;align-items:flex-start;max-height:calc(100vh - 150px);overflow-y:auto;padding-right:6px}
.slide-emoji{
  align-self:center;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(56px,8vw,100px);height:clamp(56px,8vw,100px);line-height:1;
  opacity:0;transform:scale(.3) rotate(-15deg);
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.25));
  cursor:default;
}
.slide.active .slide-emoji{animation:popBounce .6s cubic-bezier(.34,1.56,.64,1) 0s forwards}
.slide-emoji.settled{
  opacity:1;transform:scale(1) rotate(0deg);
  transition:transform .2s ease, filter .2s ease;
}
.slide-emoji.settled:hover{
  transform:scale(1.18) rotate(10deg);
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.35));
}
.slide-title{
  font-size:clamp(24px,3.2vw,38px);font-weight:800;line-height:1.05;color:var(--navy);
  text-shadow:0 0 14px rgba(255,255,255,.85), 0 2px 0 rgba(0,0,0,.12);
  background:linear-gradient(135deg, var(--orange) 0%, #ea580c 100%);
  padding:8px 20px;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.25);
  opacity:0;transform:translateY(-18px) scale(.9);
  cursor:default;
}
.slide.active .slide-title{animation:popDrop .55s cubic-bezier(.34,1.56,.64,1) .05s forwards}
.slide-title.settled{
  opacity:1;transform:translateY(0) scale(1);
  transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
}
.slide-title.settled:hover{
  transform:scale(1.06) rotate(-1deg);
  box-shadow:0 14px 30px rgba(0,0,0,.35), 0 0 0 4px rgba(255,255,255,.5);
  filter:brightness(1.12) saturate(1.15);
}

.phrase-col{display:flex;flex-direction:column;gap:7px;width:100%}
.phrase-card{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(15px,1.9vw,21px);color:#fff;
  padding:9px 18px;border-radius:16px;
  box-shadow:0 10px 22px rgba(0,0,0,.22);
  opacity:0;transform:translateX(-40px) scale(.85);
  width:fit-content;max-width:100%;
  cursor:pointer;
}
.slide.active .phrase-card{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
.phrase-card.settled{
  opacity:1;transform:translateX(0) scale(1);
  transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
}
.phrase-card.settled:hover{
  transform:scale(1.1) rotate(-2deg);
  box-shadow:0 16px 32px rgba(0,0,0,.32), 0 0 0 4px rgba(255,255,255,.6);
  filter:brightness(1.15) saturate(1.2);
}
.phrase-card.c0{background:linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%)}
.phrase-card.c1{background:linear-gradient(135deg, var(--orange) 0%, #ea580c 100%)}
.phrase-card.c2{background:linear-gradient(135deg, #38bdf8 0%, #0284c7 100%)}
.phrase-card.c3{background:linear-gradient(135deg, var(--yellow) 0%, #d97706 100%);color:var(--navy);text-shadow:none}
.phrase-card.c4{background:linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%)}
.phrase-card.c5{background:linear-gradient(135deg, #fb7185 0%, #e11d48 100%)}

.col-image{display:flex;align-items:center;justify-content:center;align-self:center}
.slide-img-wrap{
  border-radius:28px;overflow:hidden;box-shadow:var(--shadow);
  border:7px solid #fff;line-height:0;
  width:min(78vh, 62vh, 100%);aspect-ratio:1/1;max-width:100%;
  display:flex;align-items:center;justify-content:center;
  background:#0f1a3d;
  animation:floatY 4.5s ease-in-out infinite;
}
.slide-img-wrap img{display:block;width:100%;height:100%;object-fit:cover;}

@keyframes popIn{
  0%{opacity:0;transform:translateX(-40px) scale(.85)}
  60%{opacity:1;transform:translateX(6px) scale(1.04)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
@keyframes popBounce{
  0%{opacity:0;transform:scale(.3) rotate(-15deg)}
  50%{opacity:1;transform:scale(1.15) rotate(6deg)}
  75%{transform:scale(.95) rotate(-3deg)}
  100%{opacity:1;transform:scale(1) rotate(0deg)}
}
@keyframes popDrop{
  0%{opacity:0;transform:translateY(-18px) scale(.9)}
  60%{opacity:1;transform:translateY(4px) scale(1.03)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes floatY{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

/* ══════════ NAVEGACIÓN ══════════ */
.nav-controls{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:14px;
  background:rgba(17,28,64,.85);backdrop-filter:blur(6px);
  padding:10px 18px;border-radius:100px;box-shadow:0 10px 26px rgba(0,0,0,.35);
}
.nav-btn{
  width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  background:var(--orange);color:#fff;font-size:18px;font-weight:800;
  display:flex;align-items:center;justify-content:center;transition:transform .15s, opacity .15s;
}
.nav-btn:hover:not(:disabled){transform:scale(1.1)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:all .2s;border:none;padding:0}
.dot.active{background:var(--orange);width:22px;border-radius:6px}
.dot:hover{background:rgba(255,255,255,.6)}
.slide-counter{color:#fff;font-size:12px;font-weight:600;min-width:38px;text-align:center}

/* ══════════ PANEL DE NOTAS DEL PROFESOR ══════════ */
.notes-toggle{
  position:fixed;top:22px;right:22px;z-index:25;
  background:var(--navy);color:#fff;border:none;border-radius:100px;
  padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;
  font-family:'DM Sans',sans-serif;transition:transform .15s;
}
.notes-toggle:hover{transform:scale(1.04)}
.notes-panel{
  position:fixed;top:0;right:0;height:100vh;width:min(420px,92vw);
  background:#fff;z-index:30;box-shadow:-16px 0 40px rgba(0,0,0,.35);
  transform:translateX(100%);transition:transform .3s ease;
  overflow-y:auto;padding:24px 22px 40px;
}
.notes-panel.open{transform:translateX(0)}
.notes-close{
  position:absolute;top:16px;right:16px;background:#f1f5f9;border:none;
  width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--navy);
}
.notes-header{
  font-weight:800;font-size:20px;color:var(--navy);margin:6px 0 2px;padding-right:40px;
}
.notes-sub{color:var(--orange);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:18px}
.notes-block{margin-bottom:16px}
.notes-label{
  font-size:11px;font-weight:800;color:#fff;background:var(--navy);
  display:inline-block;padding:3px 10px;border-radius:6px;letter-spacing:.5px;margin-bottom:6px;
}
.notes-text{font-size:14px;color:#334155;line-height:1.55;white-space:pre-line}
.notes-overlay{
  position:fixed;inset:0;background:rgba(17,28,64,.4);z-index:29;
  opacity:0;visibility:hidden;transition:opacity .3s;
}
.notes-overlay.open{opacity:1;visibility:visible}

/* ══════════ RESPONSIVE ══════════ */
@media(max-width:900px){
  .slide-grid{grid-template-columns:1fr;padding:78px 18px 16px;gap:16px;width:94vw}
  .col-image{order:2}
  .col-text{order:1;align-items:center;text-align:center}
  .slide-emoji{font-size:clamp(56px,16vw,90px);height:clamp(56px,16vw,90px)}
  .slide-title{font-size:22px;padding:8px 20px;text-align:center}
  .phrase-col{align-items:center}
  .phrase-card{font-size:16px;padding:10px 18px;width:auto}
  .slide-img-wrap{max-height:38vh;animation:none}
  .slide-img-wrap img{max-height:38vh}
  .mission-badge{font-size:11px;padding:6px 12px;top:14px;left:14px}
  .notes-toggle{padding:8px 12px;font-size:11px;top:14px;right:14px}
  .nav-controls{padding:7px 12px;gap:8px}
  .nav-btn{width:32px;height:32px;font-size:15px}
}
</style>
</head>

</aside>



<script>
const IMG_BASE = "https://raw.githubusercontent.com/ergutza-lab/organic-english-classes/main/imagenes/Kids/Mission%2025/";
const PORTADA = IMG_BASE + "PORTADA.jpg";
const slideImg = n => IMG_BASE + "SLIDE%20" + n + ".jpg";

const SLIDES = [
{
n:1, cover:true,
notes:{
STAGE:`Mission Start / Cover`,
TIMING:`5 minutes`,
"WHAT TO DO":`Reconnect the story immediately to Mission 24. Remind students briefly that Growie Café is now active and that the team discovered a new path. Build curiosity about the morning environment. Reveal the new mission goal without teaching all routine language yet.`,
SAY:`Welcome back, Explorers! · Last mission, we helped the Growie Café. · The Café is shining! · Look! · There is a new path. · It is morning in Growie World. · Today we have Mission 25. · Our mission is to activate the first Routine Light. · Are you ready?`,
"INSTRUCTIONS FOR STUDENTS":`Look at the new path. · Look at Growie. · Show me morning! · Say: I'm ready!`,
"WHAT NOT TO DO":`Do not review the complete café dialogue. Do not spend several minutes reviewing Mission 24 language. Do not teach all routine verbs on the cover. Do not teach time. Do not explain the Simple Present. Do not reveal Magic Leaf #25 as already recovered.`,
FOCUS:`Narrative transition from the food-and-drinks arc into the routines arc.`,
"PEDAGOGICAL INTENTION":`Students enter the new language through story, visual context and curiosity.`,
"KEY UPGRADE":`Mission 25 feels like the next chapter of the same adventure rather than a disconnected new lesson.`,
"CRITICAL ERROR":`Do not reset Growie World or ignore the 24 previously recovered Magic Leaves.`,
"PRO TIP":`Point visually from the distant Café toward the new Sunrise Path as you tell the transition.`,
"FINAL CHECKLIST":`Students remember the previous adventure ended successfully. · Students understand there is a new path. · Students know the new mission begins in the morning. · Students know they need to activate a Routine Light. · Magic Leaf #25 is not active yet.`
}
},
{
n:2, title:"Wake Up, Explorers!", emoji:"⏰",
phrases:["Look!","Move!","Guess!","Wake up!","Have breakfast!","Go to school!","Do homework!","Go to bed!","Ready?"],
notes:{
STAGE:`Warm-up Game`,
TIMING:`5 minutes`,
"WHAT TO DO":`Use Total Physical Response. Model each action physically. Students copy before they are asked to say the phrase independently. Use quick changes and playful voices.`,
SAY:`Explorers, stand up! · Watch me. · Wake up! · Stretch! · Have breakfast! · Go to school! · Do homework! · Go to bed! · Again! · Now I say it. You do it!`,
"INSTRUCTIONS FOR STUDENTS":`Stand up. · Watch. · Move. · Copy me. · Listen. · Do the action.`,
"WHAT NOT TO DO":`Do not ask students to memorize all phrases immediately. Do not explain verb forms. Do not translate every phrase before students move. Do not introduce eight or ten actions at once. Do not correct pronunciation while students are moving.`,
FOCUS:`Action-to-meaning connection.`,
"PEDAGOGICAL INTENTION":`Students understand routine actions physically before processing them linguistically.`,
"KEY UPGRADE":`The new vocabulary enters through movement rather than a word list.`,
"CRITICAL ERROR":`Do not keep students passive while introducing routine actions.`,
"PRO TIP":`Do one final silent round: teacher performs an action without speaking. Students guess the phrase.`,
"FINAL CHECKLIST":`Students moved. · Students recognized at least three routine actions. · Students began connecting actions with English phrases. · Energy is high.`
}
},
{
n:3, title:"Mia's Morning", emoji:"🌅",
phrases:["Growie: Good morning, Mia!","Mia: Good morning!","Growie: What do you do every day?","Mia: I wake up at 7.","Mia: I have breakfast.","Mia: I go to school.","Leo: And after school?","Mia: I go home.","Mia: I do my homework.","Mia: I go to bed.","Growie: Great routine!"],
notes:{
STAGE:`Story Time / Input`,
TIMING:`6 minutes`,
"WHAT TO DO":`Tell the story with expression. Students listen first. Use gestures for each routine action. After the first listening, ask simple comprehension questions. Then read again and allow students to repeat selected key lines.`,
SAY:`First, listen. · Do not repeat yet. · This is Mia's routine. · Listen to Mia. · Read the dialogue naturally. · Then ask: · Does Mia wake up? · Does Mia have breakfast? · Does Mia go to school? · Does Mia do homework? · Does Mia go to bed? · What number do you hear? · Seven. · Then: · Now repeat. · I wake up at 7. · I have breakfast. · I go to school. · I do my homework. · I go to bed.`,
"INSTRUCTIONS FOR STUDENTS":`Listen first. · Look at Mia. · Point to the action. · Now repeat.`,
"WHAT NOT TO DO":`Do not translate the dialogue line by line. Do not explain "do" grammatically. Do not analyze "go" versus "goes." Do not teach a clock lesson. Do not ask students to memorize the full dialogue.`,
FOCUS:`Meaningful first-person routine language in context.`,
"PEDAGOGICAL INTENTION":`Students hear a short routine as real communication before analyzing useful phrases.`,
"KEY UPGRADE":`The routine is presented as Mia's real adventure through the day, not as an isolated vocabulary list.`,
"CRITICAL ERROR":`Do not ask students to read the whole dialogue aloud before they understand the story.`,
"PRO TIP":`Use body gestures consistently: wake up → stretch, breakfast → pretend to eat, school → backpack gesture, homework → pretend to write, bed → hands under cheek.`,
"FINAL CHECKLIST":`Students understood the main story. · Students recognized at least three routine actions. · Students heard "I wake up at 7." · Students repeated selected phrases.`
}
},
{
n:4, title:"Let's Discover", emoji:"🔍",
phrases:["🌅 I wake up at 7.","🥣 I have breakfast.","🎒 I go to school.","✏️ I do my homework.","🌙 I go to bed.","Find the phrase!"],
notes:{
STAGE:`Guided Discovery`,
TIMING:`6 minutes`,
"WHAT TO DO":`Keep the story visible. Guide students to find the routine phrases. Ask first. Confirm second. Use pointing and visual clues.`,
SAY:`Look at the story again. · Find the first action. · What does Mia say? · Yes! · I wake up at 7. · Find breakfast. · Yes! · I have breakfast. · Find school. · I go to school. · Find homework. · I do my homework. · Find the last action. · I go to bed.`,
"INSTRUCTIONS FOR STUDENTS":`Look. · Find. · Point. · Say the phrase. · Use the story.`,
"WHAT NOT TO DO":`Do not remove the original dialogue. Do not reveal every answer before students look. Do not explain subject + verb structure. Do not introduce third-person forms. Do not ask why English uses "have" or "do."`,
FOCUS:`Noticing useful routine chunks in meaningful input.`,
"PEDAGOGICAL INTENTION":`Students discover reusable expressions before formal practice.`,
"KEY UPGRADE":`Students learn from the story rather than from explanation.`,
"CRITICAL ERROR":`Do not turn Guided Discovery into grammar analysis.`,
"PRO TIP":`After each discovery, make the whole group perform the matching gesture once.`,
"FINAL CHECKLIST":`Students found the main routine phrases. · Students connected phrases with visual meaning. · The original Slide 3 story remained visible. · Students said the phrases aloud.`
}
},
{
n:5, title:"Routine Power!", emoji:"✨",
phrases:["I wake up.","I get up.","I have breakfast.","I go to school.","I go home.","I do my homework.","I have dinner.","I go to bed.","⭐ I wake up at 7."],
notes:{
STAGE:`Visual Focus / Routine Power`,
TIMING:`5 minutes`,
"WHAT TO DO":`Clarify the routine chunks with visuals and gestures. Do not insist on all eight equally. Prioritize the most useful phrases. Use short repetition. Contrast actions visually.`,
SAY:`These are our Routine Powers. · Wake up. · I wake up. · Breakfast. · I have breakfast. · School. · I go to school. · Home. · I go home. · Homework. · I do my homework. · Bed. · I go to bed. · Now our power phrase. · I wake up at 7.`,
"INSTRUCTIONS FOR STUDENTS":`Look. · Repeat. · Do the gesture. · Point. · Say the phrase.`,
"WHAT NOT TO DO":`Do not explain Simple Present. Do not make students copy a grammar table. Do not require perfect mastery of eight phrases before continuing. Do not introduce many different times. Do not introduce "What time is it?" yet.`,
FOCUS:`Clear recognition and controlled oral production.`,
"PEDAGOGICAL INTENTION":`Students organize the language they need before speaking with classmates.`,
"KEY UPGRADE":`The visual system reduces memory load and supports hesitant students.`,
"CRITICAL ERROR":`Do not overload the slide with additional routine vocabulary such as shower, brush teeth, get dressed, take a bus, play games, etc.`,
"PRO TIP":`Use a quick "Point and Say" round. Point to one visual without reading the phrase. Students say it.`,
"FINAL CHECKLIST":`Students recognized the principal routine phrases. · Students repeated the target chunks. · Students practiced "I wake up at 7." · Students are ready for guided communication.`
}
},
{
n:6, title:"Team Mission", emoji:"🤝",
phrases:["Choose 3 or 4 actions.","1. I wake up at 7.","2. I have breakfast.","3. I go to school.","4. I do my homework.","Choose. Order. Say.","Change speaker!","Every Explorer speaks!"],
notes:{
STAGE:`Guided Practice / Team Mission`,
TIMING:`7 minutes`,
"WHAT TO DO":`Model the task with the whole group first. Build one routine together. Then call several students. Each student says one part. After the group understands the process, allow pairs or small groups to create another short routine.`,
SAY:`Team Mission! · We need three or four actions. · First, choose. · Wake up. · Breakfast. · School. · Homework. · Now say the routine. · I wake up at 7. · I have breakfast. · I go to school. · I do my homework. · Now change speaker. · Everyone helps!`,
"INSTRUCTIONS FOR STUDENTS":`Choose three or four. · Put them in order. · Say the phrases. · Change speaker. · Everyone speaks.`,
"WHAT NOT TO DO":`Do not send students to pair work before modeling. Do not make one confident child say the complete routine for everyone. Do not require memorization. Do not remove the phrase cards. Do not correct every pronunciation error. Do not turn the activity into a race.`,
FOCUS:`Supported production of short routine sequences.`,
"PEDAGOGICAL INTENTION":`Students move from recognition into connected personal language with strong visual support.`,
"KEY UPGRADE":`The group constructs meaning collaboratively before independent production.`,
"CRITICAL ERROR":`Do not skip the whole-class model.`,
"PRO TIP":`For hesitant students, allow one sentence only. A child who successfully says "I have breakfast." has participated meaningfully.`,
"FINAL CHECKLIST":`Students understand how to build a short routine. · Every student produced at least one target sentence. · Students used visible support. · Students are prepared for personalized production.`
}
},
{
n:7, title:"Your Routine!", emoji:"🎭",
phrases:["Choose 3–5 actions.","I wake up at ___.","I have breakfast.","I go to school.","I go home.","I do my homework.","I have dinner.","I go to bed.","Talk to your partner.","Change roles!"],
notes:{
STAGE:`Free Production / Your Turn`,
TIMING:`8 minutes`,

let current = 1;
const total = SLIDES.length;

function buildSlideEl(s){
  const el = document.createElement('section');
  el.className = 'slide';
  el.dataset.n = s.n;

  if (s.cover) {
    el.classList.add('slide-cover');
    el.innerHTML = `
      <div class="cover-blur-bg"></div>
      <img class="cover-img" src="${PORTADA}" alt="Growie Kids Mission 25" onerror="window.__imgFallback(this)">`;
  } else {
    el.classList.add('slide-content');
    const colorClasses = ['c0','c1','c2','c3','c4','c5'];
    const chips = (s.phrases||[]).map((p,i) => `<div class="phrase-card ${colorClasses[i % colorClasses.length]}" style="animation-delay:${0.15 + i*0.12}s">${p}</div>`).join('');
    el.innerHTML = `
      <div class="mission-badge"><span class="leaf-spin">🍃</span> Mission 25 · Slide ${s.n} / ${total}</div>
      <div class="slide-grid">
        <div class="col-text">
          <div class="slide-emoji">${s.emoji}</div>
          <div class="slide-title">${s.title}</div>
          <div class="phrase-col">${chips}</div>
        </div>
        <div class="col-image">
          <div class="slide-img-wrap"><img src="${slideImg(s.n)}" alt="${s.title}" onerror="window.__imgFallback(this)"></div>
        </div>
      </div>`;
  }
  return el;
}

function initStage(){
  const stage = document.getElementById('stage');
  SLIDES.forEach(s => stage.appendChild(buildSlideEl(s)));

  const dotsWrap = document.getElementById('dots');
  SLIDES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'dot';
    b.setAttribute('aria-label', 'Slide ' + s.n);
    b.onclick = () => goTo(s.n);
    dotsWrap.appendChild(b);
  });
}

function goTo(n){
  if (n < 1 || n > total) return;
  const prev = current;
  current = n;
  document.querySelectorAll('.slide').forEach(el => {
    const en = parseInt(el.dataset.n, 10);
    const isActive = en === n;
    el.classList.toggle('active', isActive);
    if (!isActive) {
      el.querySelectorAll('.phrase-card, .slide-title, .slide-emoji').forEach(box => {
        box.classList.remove('settled');
        box.style.animation = '';
      });
    }
  });
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i === n-1));
  document.getElementById('prevBtn').disabled = n === 1;
  document.getElementById('nextBtn').disabled = n === total;
  document.getElementById('counter').textContent = n + ' / ' + total;
  renderNotes(n);
}

document.addEventListener('animationend', e => {
  if (e.target.matches('.phrase-card, .slide-title, .slide-emoji')) {
    e.target.style.animation = 'none';
    e.target.classList.add('settled');
  }
});

function renderNotes(n){
  const s = SLIDES.find(x => x.n === n);
  document.getElementById('notesTitle').textContent = 'Slide ' + n + (s.title ? ' — ' + s.title : '');
  document.getElementById('notesStage').textContent = s.notes.STAGE + ' · ' + s.notes.TIMING;
  const order = ["WHAT TO DO","SAY","INSTRUCTIONS FOR STUDENTS","WHAT NOT TO DO","FOCUS","PEDAGOGICAL INTENTION","KEY UPGRADE","CRITICAL ERROR","PRO TIP","FINAL CHECKLIST"];
  const body = document.getElementById('notesBody');
  body.innerHTML = order.map(k => `
    <div class="notes-block">
      <div class="notes-label">${k}</div>
      <div class="notes-text">${s.notes[k]}</div>
    </div>`).join('');
}

document.getElementById('prevBtn').onclick = () => goTo(current - 1);
document.getElementById('nextBtn').onclick = () => goTo(current + 1);

const notesPanel = document.getElementById('notesPanel');
const notesOverlay = document.getElementById('notesOverlay');
document.getElementById('notesToggle').onclick = () => {
  notesPanel.classList.add('open');
  notesOverlay.classList.add('open');
};
function closeNotes(){
  notesPanel.classList.remove('open');
  notesOverlay.classList.remove('open');
}
document.getElementById('notesClose').onclick = closeNotes;
notesOverlay.onclick = closeNotes;

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
  if (e.key === 'Escape') closeNotes();
});

initStage();
goTo(1);
</script>
<script>
(function(){
  function attachBgFallback(){
    var tested = {};
    document.querySelectorAll('.bg-img,.cover-blur-bg,.slide-content').forEach(function(el){
      var css = getComputedStyle(el).backgroundImage;
      var m = css.match(/url\(["']?([^"')]+)["']?\)/);
      if (!m) return;
      var primary = m[1];
      if (primary.indexOf('jsdelivr.net') !== -1) return;
      if (!tested[primary]) {
        var fb = window.__toJsDelivr(primary);
        tested[primary] = { fb: fb, els: [] };
        if (fb) {
          var test = new Image();
          test.onerror = (function(key){ return function(){
            tested[key].els.forEach(function(e){ e.style.backgroundImage = "url('" + tested[key].fb + "')"; });
          };})(primary);
          test.src = primary;
        }
      }
      tested[primary].els.push(el);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attachBgFallback);
  else attachBgFallback();
})();
</script>

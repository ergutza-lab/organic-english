<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Growie Kids — Mission 1 — Nice to meet you!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1c2b5e;
  --navy-dark:#111c40;
  --orange:#f97316;
  --orange-light:#fdba74;
  --green:#22c55e;
  --green-dark:#15803d;
  --cream:#fef3e2;
  --yellow:#fbbf24;
  --white:#ffffff;
  --shadow:0 18px 40px rgba(28,43,94,.35);
}
html,body{height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--navy-dark);}
h1,h2,h3,.font-baloo{font-family:'Baloo 2',cursive;}

/* ══════════ ESTRUCTURA DE SLIDES ══════════ */
.stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transform:translateX(40px);
  transition:opacity .45s ease, transform .45s ease, visibility 0s linear .45s;
  background-size:cover;background-position:center;
}
.slide.active{
  opacity:1;visibility:visible;transform:translateX(0);
  transition:opacity .45s ease, transform .45s ease;
  z-index:2;
}
.slide.prevslide{transform:translateX(-40px)}

/* ── Slide 1: Portada ── */
.slide-cover{background:none;}
.cover-blur-bg{
  position:absolute;inset:0;z-index:0;
  background-image:url('https://raw.githubusercontent.com/ergutza-lab/organic-english-classes/main/imagenes/Kids/Mission%2001/PORTADA.jpg');
  background-size:cover;background-position:center;
  filter:blur(28px) brightness(.55) saturate(1.1);
  transform:scale(1.15);
}
.cover-img{
  position:absolute;inset:0;z-index:1;
  width:100%;height:100%;object-fit:contain;
}

.slide-content{align-items:flex-start}
.slide-content{background-image:url('https://raw.githubusercontent.com/ergutza-lab/organic-english-classes/main/imagenes/Kids/Mission%2001/FONDO%20SLIDES%20KIDS.webp');}
.mission-badge{
  position:absolute;top:22px;left:22px;z-index:5;
  background:var(--orange);color:#fff;font-weight:700;font-size:13px;
  padding:8px 16px;border-radius:100px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;
}
.mission-badge .leaf-spin{display:inline-block;animation:spin 3s linear infinite}

.slide-grid{
  display:grid;grid-template-columns:1fr 1.15fr;align-items:start;gap:36px;
  max-width:1280px;width:92vw;padding:96px 40px 28px;
}
.col-text{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.slide-emoji{
  align-self:center;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(80px,12vw,136px);height:clamp(80px,12vw,136px);line-height:1;
  opacity:0;transform:scale(.3) rotate(-15deg);
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.25));
  cursor:default;
}
.slide.active .slide-emoji{animation:popBounce .6s cubic-bezier(.34,1.56,.64,1) 0s forwards}
.slide-emoji.settled{
  opacity:1;transform:scale(1) rotate(0deg);
  transition:transform .2s ease, filter .2s ease;
}
.slide-emoji.settled:hover{
  transform:scale(1.18) rotate(10deg);
  filter:drop-shadow(0 12px 20px rgba(0,0,0,.35));
}
.slide-title{
  font-size:clamp(30px,4vw,48px);font-weight:800;line-height:1.05;color:var(--navy);
  text-shadow:0 0 14px rgba(255,255,255,.85), 0 2px 0 rgba(0,0,0,.12);
  background:linear-gradient(135deg, var(--orange) 0%, #ea580c 100%);
  padding:10px 24px;border-radius:20px;box-shadow:0 10px 24px rgba(0,0,0,.25);
  opacity:0;transform:translateY(-18px) scale(.9);
  cursor:default;
}
.slide.active .slide-title{animation:popDrop .55s cubic-bezier(.34,1.56,.64,1) .05s forwards}
.slide-title.settled{
  opacity:1;transform:translateY(0) scale(1);
  transition:transform .22s ease, box-shadow .22s ease, filter .22s ease;
}
.slide-title.settled:hover{
  transform:scale(1.06) rotate(-1deg);
  box-shadow:0 14px 30px rgba(0,0,0,.35), 0 0 0 4px rgba(255,255,255,.5);
  filter:brightness(1.12) saturate(1.15);
}

.phrase-col{display:flex;flex-direction:column;gap:12px;width:100%}
.phrase-card{
  font-family:'Baloo 2',cursive;font-weight:700;
  font-size:clamp(18px,2.3vw,26px);color:#fff;
  padding:14px 22px;border-radius:18px;
  box-shadow:0 10px 22px rgba(0,0,0,.22);
  opacity:0;transform:translateX(-40px) scale(.85);
  width:fit-content;max-width:100%;
  cursor:pointer;
}
.slide.active .phrase-card{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) forwards}
.phrase-card.settled{
  opacity:1;transform:translateX(0) scale(1);
  transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
}
.phrase-card.settled:hover{
  transform:scale(1.1) rotate(-2deg);
  box-shadow:0 16px 32px rgba(0,0,0,.32), 0 0 0 4px rgba(255,255,255,.6);
  filter:brightness(1.15) saturate(1.2);
}
.phrase-card.c0{background:linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%)}
.phrase-card.c1{background:linear-gradient(135deg, var(--orange) 0%, #ea580c 100%)}
.phrase-card.c2{background:linear-gradient(135deg, #38bdf8 0%, #0284c7 100%)}
.phrase-card.c3{background:linear-gradient(135deg, var(--yellow) 0%, #d97706 100%);color:var(--navy);text-shadow:none}
.phrase-card.c4{background:linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%)}
.phrase-card.c5{background:linear-gradient(135deg, #fb7185 0%, #e11d48 100%)}

.col-image{display:flex;align-items:center;justify-content:center;align-self:center}
.slide-img-wrap{
  border-radius:28px;overflow:hidden;box-shadow:var(--shadow);
  border:7px solid #fff;background:#fff;line-height:0;
  max-width:100%;max-height:78vh;
  animation:floatY 4.5s ease-in-out infinite;
}
.slide-img-wrap img{display:block;width:100%;height:100%;object-fit:contain;max-height:78vh}

@keyframes popIn{
  0%{opacity:0;transform:translateX(-40px) scale(.85)}
  60%{opacity:1;transform:translateX(6px) scale(1.04)}
  100%{opacity:1;transform:translateX(0) scale(1)}
}
@keyframes popBounce{
  0%{opacity:0;transform:scale(.3) rotate(-15deg)}
  50%{opacity:1;transform:scale(1.15) rotate(6deg)}
  75%{transform:scale(.95) rotate(-3deg)}
  100%{opacity:1;transform:scale(1) rotate(0deg)}
}
@keyframes popDrop{
  0%{opacity:0;transform:translateY(-18px) scale(.9)}
  60%{opacity:1;transform:translateY(4px) scale(1.03)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes floatY{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-14px)}
}
@keyframes spin{
  0%{transform:rotate(0deg)}
  100%{transform:rotate(360deg)}
}

/* ══════════ NAVEGACIÓN ══════════ */
.nav-controls{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:20;
  display:flex;align-items:center;gap:14px;
  background:rgba(17,28,64,.85);backdrop-filter:blur(6px);
  padding:10px 18px;border-radius:100px;box-shadow:0 10px 26px rgba(0,0,0,.35);
}
.nav-btn{
  width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  background:var(--orange);color:#fff;font-size:18px;font-weight:800;
  display:flex;align-items:center;justify-content:center;transition:transform .15s, opacity .15s;
}
.nav-btn:hover:not(:disabled){transform:scale(1.1)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.dots{display:flex;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:all .2s;border:none;padding:0}
.dot.active{background:var(--orange);width:22px;border-radius:6px}
.dot:hover{background:rgba(255,255,255,.6)}
.slide-counter{color:#fff;font-size:12px;font-weight:600;min-width:38px;text-align:center}

/* ══════════ PANEL DE NOTAS DEL PROFESOR ══════════ */
.notes-toggle{
  position:fixed;top:22px;right:22px;z-index:25;
  background:var(--navy);color:#fff;border:none;border-radius:100px;
  padding:10px 18px;font-weight:700;font-size:13px;cursor:pointer;
  box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;
  font-family:'DM Sans',sans-serif;transition:transform .15s;
}
.notes-toggle:hover{transform:scale(1.04)}
.notes-panel{
  position:fixed;top:0;right:0;height:100vh;width:min(420px,92vw);
  background:#fff;z-index:30;box-shadow:-16px 0 40px rgba(0,0,0,.35);
  transform:translateX(100%);transition:transform .3s ease;
  overflow-y:auto;padding:24px 22px 40px;
}
.notes-panel.open{transform:translateX(0)}
.notes-close{
  position:absolute;top:16px;right:16px;background:#f1f5f9;border:none;
  width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--navy);
}
.notes-header{
  font-weight:800;font-size:20px;color:var(--navy);margin:6px 0 2px;padding-right:40px;
}
.notes-sub{color:var(--orange);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:18px}
.notes-block{margin-bottom:16px}
.notes-label{
  font-size:11px;font-weight:800;color:#fff;background:var(--navy);
  display:inline-block;padding:3px 10px;border-radius:6px;letter-spacing:.5px;margin-bottom:6px;
}
.notes-text{font-size:14px;color:#334155;line-height:1.55;white-space:pre-line}
.notes-overlay{
  position:fixed;inset:0;background:rgba(17,28,64,.4);z-index:29;
  opacity:0;visibility:hidden;transition:opacity .3s;
}
.notes-overlay.open{opacity:1;visibility:visible}

/* ══════════ RESPONSIVE ══════════ */
@media(max-width:900px){
  .slide-grid{grid-template-columns:1fr;padding:78px 18px 16px;gap:16px;width:94vw}
  .col-image{order:2}
  .col-text{order:1;align-items:center;text-align:center}
  .slide-emoji{font-size:clamp(56px,16vw,90px);height:clamp(56px,16vw,90px)}
  .slide-title{font-size:22px;padding:8px 20px;text-align:center}
  .phrase-col{align-items:center}
  .phrase-card{font-size:16px;padding:10px 18px;width:auto}
  .slide-img-wrap{max-height:38vh;animation:none}
  .slide-img-wrap img{max-height:38vh}
  .mission-badge{font-size:11px;padding:6px 12px;top:14px;left:14px}
  .notes-toggle{padding:8px 12px;font-size:11px;top:14px;right:14px}
  .nav-controls{padding:7px 12px;gap:8px}
  .nav-btn{width:32px;height:32px;font-size:15px}
}
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<button class="notes-toggle" id="notesToggle">🧑‍🏫 <span>Teacher Notes:</span></button>

<div class="nav-controls">
  <button class="nav-btn" id="prevBtn" aria-label="Anterior">‹</button>
  <div class="dots" id="dots"></div>
  <button class="nav-btn" id="nextBtn" aria-label="Siguiente">›</button>
</div>
<div class="slide-counter" id="counter" style="position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:20;"></div>

<div class="notes-overlay" id="notesOverlay"></div>
<aside class="notes-panel" id="notesPanel">
  <button class="notes-close" id="notesClose">✕</button>
  <div class="notes-header" id="notesTitle"></div>
  <div class="notes-sub" id="notesStage"></div>
  <div id="notesBody"></div>
</aside>

<script>
const IMG_BASE = "https://raw.githubusercontent.com/ergutza-lab/organic-english-classes/main/imagenes/Kids/Mission%2001/";
const FONDO   = IMG_BASE + "FONDO%20SLIDES%20KIDS.webp";
const PORTADA = IMG_BASE + "PORTADA.jpg";
const slideImg = n => IMG_BASE + "SLIDE%20" + n + ".jpg";

const SLIDES = [
  {
    n:1, cover:true,
    title:"Nice to meet you!",
    goal:"Adventure Goal: Help Growie make new friends!",
    notes:{
      STAGE:"Mission Start / Welcome",
      TIMING:"5 minutes",
      "WHAT TO DO":"Welcome students warmly. Present Growie World and explain that today they will help Growie make new friends. Build excitement before asking students to speak.",
      SAY:"\u201cWelcome to Growie World!\u201d \u2022 \u201cToday is Mission 1.\u201d \u2022 \u201cGrowie needs our help.\u201d \u2022 \u201cGrowie wants to make new friends.\u201d \u2022 \u201cAre you ready?\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cLook at Growie.\u201d \u2022 \u201cListen.\u201d \u2022 \u201cGet ready.\u201d \u2022 \u201cSay: I\u2019m ready!\u201d",
      "WHAT NOT TO DO":"Do not explain grammar. Do not start with a vocabulary list. Do not ask students to produce the full dialogue immediately. Do not make the beginning feel like a test.",
      FOCUS:"Emotional connection, curiosity and mission context.",
      "PEDAGOGICAL INTENTION":"Students enter the class through story and purpose before practicing language.",
      "KEY UPGRADE":"The slide works as a videogame mission opening, not as a traditional cover.",
      "CRITICAL ERROR":"Do not make this look like an adult Organic English slide.",
      "PRO TIP":"Use an excited voice and point to the missing Magic Leaf.",
      "FINAL CHECKLIST":"Students understand this is Mission 1. \u2022 Students know Growie needs help. \u2022 Students feel ready to participate."
    }
  },
  {
    n:2, title:"Meet Growie!", emoji:"👋",
    phrases:["Hello!","Hi!","Hello, Growie!","Wave!","High five!","Thumbs up!"],
    notes:{
      STAGE:"Warm-up Game",
      TIMING:"6 minutes",
      "WHAT TO DO":"Use movement and greetings. Students copy gestures and repeat greetings. Keep the rhythm active and fun.",
      SAY:"\u201cLook! It\u2019s Growie!\u201d \u2022 \u201cGrowie says: Hello!\u201d \u2022 \u201cWave and say: Hello!\u201d \u2022 \u201cHigh five!\u201d \u2022 \u201cThumbs up!\u201d \u2022 \u201cSay: Hello, Growie!\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cWave.\u201d \u2022 \u201cRepeat.\u201d \u2022 \u201cSay hello.\u201d \u2022 \u201cMove with me.\u201d",
      "WHAT NOT TO DO":"Do not keep students sitting silently. Do not correct pronunciation too much. Do not introduce the full conversation yet. Do not use long explanations.",
      FOCUS:"First oral activation and body movement.",
      "PEDAGOGICAL INTENTION":"Students connect English greetings with action, emotion and interaction.",
      "KEY UPGRADE":"The warm-up is a game, not a drill.",
      "CRITICAL ERROR":"Do not let only one or two students participate.",
      "PRO TIP":"Use different voices: happy hello, whisper hello, big hello.",
      "FINAL CHECKLIST":"Students said \u201cHello.\u201d \u2022 Students said \u201cHi.\u201d \u2022 Students greeted Growie. \u2022 Students moved and participated."
    }
  },
  {
    n:3, title:"Growie's Story", emoji:"📖",
    phrases:["Hello!","Hi!","I'm Growie.","I'm Leo.","Nice to meet you!"],
    notes:{
      STAGE:"Story Time",
      TIMING:"6 minutes",
      "WHAT TO DO":"Tell the story using expression and gestures. Students listen first, then repeat the key lines.",
      SAY:"\u201cGrowie is walking in Growie World.\u201d \u2022 \u201cGrowie sees Leo.\u201d \u2022 \u201cGrowie says: Hello!\u201d \u2022 \u201cLeo says: Hi!\u201d \u2022 \u201cGrowie says: I\u2019m Growie.\u201d \u2022 \u201cLeo says: I\u2019m Leo.\u201d \u2022 \u201cGrowie says: Nice to meet you.\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cLook.\u201d \u2022 \u201cListen.\u201d \u2022 \u201cRepeat Growie.\u201d \u2022 \u201cRepeat Leo.\u201d",
      "WHAT NOT TO DO":"Do not translate line by line. Do not explain grammar. Do not ask students to read before listening. Do not add more characters or extra language.",
      FOCUS:"Understanding greetings and first introductions in context.",
      "PEDAGOGICAL INTENTION":"Students hear the target language inside a meaningful story.",
      "KEY UPGRADE":"English appears naturally through the adventure.",
      "CRITICAL ERROR":"Do not turn the story into a reading activity.",
      "PRO TIP":"Use one voice for Growie and another voice for Leo.",
      "FINAL CHECKLIST":"Students understood Growie met Leo. \u2022 Students repeated \u201cHello.\u201d \u2022 Students repeated \u201cI\u2019m Growie / I\u2019m Leo.\u201d \u2022 Students heard \u201cNice to meet you.\u201d"
    }
  },
  {
    n:4, title:"Let's Discover", emoji:"🔍",
    phrases:["Find: Hello","Find: I'm...","Find: Nice to meet you"],
    notes:{
      STAGE:"Guided Discovery",
      TIMING:"7 minutes",
      "WHAT TO DO":"Guide students to find the important phrases. Ask questions first, then confirm. Do not explain grammar.",
      SAY:"\u201cLook at the story again.\u201d \u2022 \u201cFind the greeting.\u201d \u2022 \u201cYes: Hello!\u201d \u2022 \u201cFind the name phrase.\u201d \u2022 \u201cYes: I\u2019m Growie.\u201d \u2022 \u201cFind the friendly phrase.\u201d \u2022 \u201cYes: Nice to meet you.\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cLook.\u201d \u2022 \u201cPoint.\u201d \u2022 \u201cFind.\u201d \u2022 \u201cSay it.\u201d",
      "WHAT NOT TO DO":"Do not explain \u201cI\u2019m\u201d as grammar. Do not give all answers immediately. Do not remove the dialogue. Do not add extra phrases.",
      FOCUS:"Students discover useful language from context.",
      "PEDAGOGICAL INTENTION":"Students notice how greetings and introductions work without explicit grammar explanation.",
      "KEY UPGRADE":"The discovery stage is visual, simple and child-friendly.",
      "CRITICAL ERROR":"Do not overcomplicate the discovery stage.",
      "PRO TIP":"Ask students to use gestures: wave for \u201cHello,\u201d point to self for \u201cI\u2019m.\u201d",
      "FINAL CHECKLIST":"Students found \u201cHello.\u201d \u2022 Students found \u201cI\u2019m.\u201d \u2022 Students found \u201cNice to meet you.\u201d \u2022 Students repeated the phrases."
    }
  },
  {
    n:5, title:"Magic Words", emoji:"✨",
    phrases:["Hello!","Hi!","I'm...","What's your name?","Nice to meet you!"],
    notes:{
      STAGE:"Visual Focus / Magic Words",
      TIMING:"6 minutes",
      "WHAT TO DO":"Clarify the useful phrases through repetition, gestures and short examples. Keep it simple.",
      SAY:"\u201cThese are our Magic Words.\u201d \u2022 \u201cHello!\u201d \u2022 \u201cHi!\u201d \u2022 \u201cI\u2019m Growie.\u201d \u2022 \u201cWhat\u2019s your name?\u201d \u2022 \u201cNice to meet you.\u201d \u2022 \u201cRepeat with me.\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cLook.\u201d \u2022 \u201cRepeat.\u201d \u2022 \u201cUse your voice.\u201d \u2022 \u201cDo the gesture.\u201d",
      "WHAT NOT TO DO":"Do not explain grammar. Do not add spelling. Do not add country, age or email. Do not overload with more expressions.",
      FOCUS:"Key language recognition and controlled repetition.",
      "PEDAGOGICAL INTENTION":"Students organize the main expressions before practicing them.",
      "KEY UPGRADE":"The language is presented as \u201cMagic Words,\u201d not vocabulary.",
      "CRITICAL ERROR":"Do not include too much text.",
      "PRO TIP":"Assign gestures to each card.",
      "FINAL CHECKLIST":"Students repeated all Magic Words. \u2022 Students associated phrases with meaning. \u2022 Students are ready for guided practice."
    }
  },
  {
    n:6, title:"Team Mission", emoji:"🤝",
    phrases:["A: Hello! I'm ___.","B: Hi! I'm ___.","A: What's your name?","B: Nice to meet you, too!"],
    notes:{
      STAGE:"Guided Practice / Partner Mission Preparation",
      TIMING:"8 minutes",
      "WHAT TO DO":"Practice first as a whole group. Then prepare students for partner practice. Model the conversation clearly.",
      SAY:"\u201cNow we practice together.\u201d \u2022 \u201cI am Student A.\u201d \u2022 \u201cYou are Student B.\u201d \u2022 \u201cHello! I\u2019m Teacher Emma.\u201d \u2022 \u201cNow you answer: Hi! I\u2019m ___.\u201d \u2022 \u201cGood!\u201d \u2022 \u201cNow ask: What\u2019s your name?\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cRepeat.\u201d \u2022 \u201cUse your name.\u201d \u2022 \u201cAsk your partner.\u201d \u2022 \u201cAnswer.\u201d \u2022 \u201cChange roles.\u201d",
      "WHAT NOT TO DO":"Do not send students to breakout rooms without modeling. Do not let students practice without visual support. Do not correct every small pronunciation mistake. Do not make the conversation longer.",
      FOCUS:"Supported conversation practice.",
      "PEDAGOGICAL INTENTION":"Students move from repetition to a short meaningful exchange.",
      "KEY UPGRADE":"The practice feels like a team mission.",
      "CRITICAL ERROR":"Do not skip the group model before pair work.",
      "PRO TIP":"Use the same model several times with different students before pair practice.",
      "FINAL CHECKLIST":"Students practiced the conversation as a group. \u2022 Students understand Student A and Student B roles. \u2022 Students know they must change roles."
    }
  },
  {
    n:7, title:"Your Turn", emoji:"🎤",
    phrases:["Hello!","I'm ___.","What's your name?","Nice to meet you!"],
    notes:{
      STAGE:"Free Production",
      TIMING:"8 minutes",
      "WHAT TO DO":"Students use the model to create their own short greeting conversation. The teacher monitors and supports.",
      SAY:"\u201cNow it\u2019s your turn.\u201d \u2022 \u201cMeet a friend.\u201d \u2022 \u201cSay: Hello! I\u2019m ___.\u201d \u2022 \u201cAsk: What\u2019s your name?\u201d \u2022 \u201cSay: Nice to meet you.\u201d \u2022 \u201cUse the slide.\u201d \u2022 \u201cSimple is okay.\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cTalk to your partner.\u201d \u2022 \u201cUse your real name.\u201d \u2022 \u201cAsk the question.\u201d \u2022 \u201cAnswer.\u201d \u2022 \u201cChange roles.\u201d",
      "WHAT NOT TO DO":"Do not demand memorization. Do not remove the support slide. Do not correct constantly during production. Do not make shy students feel pressured.",
      FOCUS:"Personalized communication.",
      "PEDAGOGICAL INTENTION":"Students use the language with a real classmate.",
      "KEY UPGRADE":"Students become the heroes of the mission.",
      "CRITICAL ERROR":"Do not make the production feel like an exam.",
      "PRO TIP":"Accept reading from the slide. Communication is more important than memorization.",
      "FINAL CHECKLIST":"Students introduced themselves. \u2022 Students asked \u201cWhat\u2019s your name?\u201d \u2022 Students used \u201cNice to meet you.\u201d \u2022 Students changed roles."
    }
  },
  {
    n:8, title:"Mission Complete!", emoji:"🏆",
    phrases:["Hello!","I'm ___.","What's your name?","Nice to meet you!","Great job, Explorers!"],
    notes:{
      STAGE:"Feedback / Mission Complete",
      TIMING:"5 minutes",
      "WHAT TO DO":"Give positive feedback first. Celebrate what students were able to say. Correct only one or two patterns if necessary, without naming students.",
      SAY:"\u201cGreat job, Explorers!\u201d \u2022 \u201cYou helped Growie!\u201d \u2022 \u201cI heard: Hello!\u201d \u2022 \u201cI heard: I\u2019m ___.\u201d \u2022 \u201cI heard: What\u2019s your name?\u201d \u2022 \u201cI heard: Nice to meet you!\u201d \u2022 \u201cExcellent!\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cListen.\u201d \u2022 \u201cRepeat the good phrases.\u201d \u2022 \u201cCelebrate.\u201d \u2022 \u201cSay: Mission complete!\u201d",
      "WHAT NOT TO DO":"Do not focus on mistakes. Do not embarrass students. Do not correct too much. Do not introduce new language.",
      FOCUS:"Positive feedback and confidence.",
      "PEDAGOGICAL INTENTION":"Students finish the production stage feeling successful.",
      "KEY UPGRADE":"Feedback becomes part of the adventure.",
      "CRITICAL ERROR":"Do not make feedback negative.",
      "PRO TIP":"Correct patterns, not people.",
      "FINAL CHECKLIST":"Students received positive feedback. \u2022 Students repeated the key phrases. \u2022 The mission feels completed."
    }
  },
  {
    n:9, title:"Magic Leaf", emoji:"🍃",
    phrases:["How do you feel?","I can do it!","I need more practice.","Can you help me?"],
    notes:{
      STAGE:"Reflection",
      TIMING:"5 minutes",
      "WHAT TO DO":"Ask students to self-evaluate using reactions, fingers, chat or voice. Normalize needing practice or help.",
      SAY:"\u201cGrowie recovered one Magic Leaf!\u201d \u2022 \u201cNow, how do you feel?\u201d \u2022 \u201cChoose one.\u201d \u2022 \u201cI can do it.\u201d \u2022 \u201cI need more practice.\u201d \u2022 \u201cCan you help me?\u201d \u2022 \u201cMore practice is okay.\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cChoose one.\u201d \u2022 \u201cUse your fingers.\u201d \u2022 \u201cUse the chat.\u201d \u2022 \u201cBe honest.\u201d",
      "WHAT NOT TO DO":"Do not pressure students to choose \u201cI can do it.\u201d Do not turn reflection into another test. Do not add new content. Do not make students feel bad for needing help.",
      FOCUS:"Self-awareness and emotional safety.",
      "PEDAGOGICAL INTENTION":"Students identify their confidence level and teacher sees who needs support.",
      "KEY UPGRADE":"Reflection is connected to the Magic Leaf reward.",
      "CRITICAL ERROR":"Do not shame students for needing help.",
      "PRO TIP":"Say: \u201cEnglish grows with practice.\u201d",
      "FINAL CHECKLIST":"Students reflected. \u2022 Students chose an option. \u2022 Teacher identified confidence levels. \u2022 Growie recovered the Magic Leaf."

  },
  {
    n:10, title:"See You Next Mission!", emoji:"👋",
    phrases:["You can introduce yourself and ask someone's name in English!","Next Mission: Where are you from?","Bye, Growie!"],
    notes:{
      STAGE:"Celebration / Closing",
      TIMING:"5 minutes",
      "WHAT TO DO":"Close positively. Repeat the achievement statement. Preview the next mission briefly.",
      SAY:"\u201cGreat job today!\u201d \u2022 \u201cYou helped Growie make new friends.\u201d \u2022 \u201cYou can introduce yourself and ask someone\u2019s name in English.\u201d \u2022 \u201cNext mission: Where are you from?\u201d \u2022 \u201cBye, Growie!\u201d \u2022 \u201cSee you next mission!\u201d",
      "INSTRUCTIONS FOR STUDENTS":"\u201cSay bye.\u201d \u2022 \u201cWave.\u201d \u2022 \u201cRepeat: Bye, Growie!\u201d \u2022 \u201cSee you next mission!\u201d",
      "WHAT NOT TO DO":"Do not introduce the next lesson content in detail. Do not correct at the end. Do not add a long summary. Do not use the word lesson.",
      FOCUS:"Achievement, celebration and continuity.",
      "PEDAGOGICAL INTENTION":"Students leave motivated to return for the next mission.",
      "KEY UPGRADE":"The closing connects today\u2019s success with the next adventure.",
      "CRITICAL ERROR":"Do not end abruptly.",
      "PRO TIP":"End with the same goodbye routine every mission.",
      "FINAL CHECKLIST":"Achievement statement was repeated. \u2022 Students said goodbye. \u2022 Next mission was previewed. \u2022 Class ended with excitement."
    }
  }
];

let current = 1;
const total = SLIDES.length;

function buildSlideEl(s){
  const el = document.createElement('section');
  el.className = 'slide';
  el.dataset.n = s.n;

  if (s.cover) {
    el.classList.add('slide-cover');
    el.innerHTML = `
      <div class="cover-blur-bg"></div>
      <img class="cover-img" src="${PORTADA}" alt="Growie Kids Mission 1">`;
  } else {
    el.classList.add('slide-content');
    const colorClasses = ['c0','c1','c2','c3','c4','c5'];
    const chips = (s.phrases||[]).map((p,i) => `<div class="phrase-card ${colorClasses[i % colorClasses.length]}" style="animation-delay:${0.15 + i*0.12}s">${p}</div>`).join('');
    el.innerHTML = `
      <div class="mission-badge"><span class="leaf-spin">🍃</span> Mission 1 · Slide ${s.n} / ${total}</div>
      <div class="slide-grid">
        <div class="col-text">
          <div class="slide-emoji">${s.emoji}</div>
          <div class="slide-title">${s.title}</div>
          <div class="phrase-col">${chips}</div>
        </div>
        <div class="col-image">
          <div class="slide-img-wrap"><img src="${slideImg(s.n)}" alt="${s.title}"></div>
        </div>
      </div>`;
  }
  return el;
}

function initStage(){
  const stage = document.getElementById('stage');
  SLIDES.forEach(s => stage.appendChild(buildSlideEl(s)));

  const dotsWrap = document.getElementById('dots');
  SLIDES.forEach(s => {
    const b = document.createElement('button');
    b.className = 'dot';
    b.setAttribute('aria-label', 'Slide ' + s.n);
    b.onclick = () => goTo(s.n);
    dotsWrap.appendChild(b);
  });
}

function goTo(n){
  if (n < 1 || n > total) return;
  const prev = current;
  current = n;
  document.querySelectorAll('.slide').forEach(el => {
    const en = parseInt(el.dataset.n, 10);
    const isActive = en === n;
    el.classList.toggle('active', isActive);
    if (!isActive) {
      el.querySelectorAll('.phrase-card, .slide-title, .slide-emoji').forEach(box => {
        box.classList.remove('settled');
        box.style.animation = '';
      });
    }
  });
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('active', i === n-1));
  document.getElementById('prevBtn').disabled = n === 1;
  document.getElementById('nextBtn').disabled = n === total;
  document.getElementById('counter').textContent = n + ' / ' + total;
  renderNotes(n);
}

document.addEventListener('animationend', e => {
  if (e.target.matches('.phrase-card, .slide-title, .slide-emoji')) {
    e.target.style.animation = 'none';
    e.target.classList.add('settled');
  }
});

function renderNotes(n){
  const s = SLIDES.find(x => x.n === n);
  document.getElementById('notesTitle').textContent = 'Slide ' + n + (s.title ? ' — ' + s.title : '');
  document.getElementById('notesStage').textContent = s.notes.STAGE + ' · ' + s.notes.TIMING;
  const order = ["WHAT TO DO","SAY","INSTRUCTIONS FOR STUDENTS","WHAT NOT TO DO","FOCUS","PEDAGOGICAL INTENTION","KEY UPGRADE","CRITICAL ERROR","PRO TIP","FINAL CHECKLIST"];
  const body = document.getElementById('notesBody');
  body.innerHTML = order.map(k => `
    <div class="notes-block">
      <div class="notes-label">${k}</div>
      <div class="notes-text">${s.notes[k]}</div>
    </div>`).join('');
}

document.getElementById('prevBtn').onclick = () => goTo(current - 1);
document.getElementById('nextBtn').onclick = () => goTo(current + 1);

const notesPanel = document.getElementById('notesPanel');
const notesOverlay = document.getElementById('notesOverlay');
document.getElementById('notesToggle').onclick = () => {
  notesPanel.classList.add('open');
  notesOverlay.classList.add('open');
};
function closeNotes(){
  notesPanel.classList.remove('open');
  notesOverlay.classList.remove('open');
}
document.getElementById('notesClose').onclick = closeNotes;
notesOverlay.onclick = closeNotes;

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
  if (e.key === 'Escape') closeNotes();
});

initStage();
goTo(1);
</script>

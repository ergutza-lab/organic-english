<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Growie Kids</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: una columna clara y muy colorida (mundo Growie: cielo, pasto, madera, sol). Botones grandes, poco texto, sin relojes ni vidas. Look único claro. */
:root{
  --sky:#bfeaff; --sky-2:#e9f8ff; --leaf:#5cb83a; --leaf-d:#2f7a24; --forest:#1f5a2c; --sun:#ffd23f; --sun-d:#e0a400;
  --ora:#ff8a3d; --ora-d:#d0611a; --pink:#ff6fa5; --berry:#8a5cf6; --wood:#9a6233; --wood-d:#6b3f1d; --cream:#fffaf0; --ink:#21402a; --mute:#5c7a63;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
html{background:#eef6e2}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#eef6e2 url('../images/Kids/FONDO%20KIDS.webp') center top/cover no-repeat;pointer-events:none}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  background:transparent;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.05;text-wrap:balance}
button{font-family:var(--f-display);cursor:pointer;border:none;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px solid var(--berry);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{font:800 22px var(--f-display);color:var(--leaf-d);letter-spacing:.01em;text-shadow:0 2px 0 #fff}
.brand b{color:var(--ora)}
.chip{font:900 12px var(--f-body);background:#fff;color:var(--leaf-d);border-radius:999px;padding:6px 12px;box-shadow:0 3px 0 rgba(47,122,36,.25)}
.banner{position:relative;border-radius:26px;overflow:hidden;border:5px solid #fff;box-shadow:0 8px 0 var(--leaf-d)}
.banner img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.banner .pulse{position:absolute;left:46.3%;top:8.4%;width:7%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,0);box-shadow:0 0 0 4px var(--sun),0 0 22px 8px rgba(255,210,63,.9);animation:pul 1.4s infinite}
@keyframes pul{50%{box-shadow:0 0 0 6px var(--sun),0 0 34px 14px rgba(255,210,63,.6)}}
.growie{display:flex;align-items:flex-end;gap:10px}
.growie img{width:86px;height:86px;border-radius:50%;object-fit:cover;object-position:50% 30%;border:4px solid #fff;box-shadow:0 5px 0 var(--leaf-d);flex:none;background:#cfe9b8}
.bubble{position:relative;background:#fff;border-radius:22px;padding:12px 16px;font:800 18px var(--f-display);box-shadow:0 5px 0 rgba(47,122,36,.25);flex:1;min-width:0}
.bubble:before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble small{display:block;font:800 13px var(--f-body);color:var(--mute)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g{border-radius:26px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;min-width:0;transition:transform .1s}
.g:active{transform:translateY(3px)}
.g .big{font-size:44px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
.g h3{font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.18);text-align:center}
.g .lv{background:rgba(255,255,255,.3);border-radius:999px;padding:2px 10px;font-size:15px;letter-spacing:2px}
.g1{background:linear-gradient(160deg,#4cc3ff,#1f8fdc);box-shadow:0 7px 0 #146aa6}
.g2{background:linear-gradient(160deg,#b28bff,#7a4ff0);box-shadow:0 7px 0 #5532b8}
.g3{background:linear-gradient(160deg,#7ed957,#3c9e2b);box-shadow:0 7px 0 #2a7a1d}
.g4{background:linear-gradient(160deg,#ffb04d,#ff7a2a);box-shadow:0 7px 0 #c85712}
.off{opacity:.28;filter:grayscale(1)}
.album{background:var(--cream);border:4px dashed #e4cfa0;border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.album h3{font-size:20px;color:var(--wood-d)}
.album p{margin:0;font-weight:800;color:var(--mute);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 20px;font:800 19px var(--f-display);background:var(--ora);color:#fff;box-shadow:0 6px 0 var(--ora-d);text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ora-d)}
.btn.green{background:var(--leaf);box-shadow:0 6px 0 var(--leaf-d)}
.btn.white{background:#fff;color:var(--leaf-d);box-shadow:0 6px 0 rgba(47,122,36,.3)}
.btn.small{padding:8px 16px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* pantalla de juego */
.stage{background:rgba(255,255,255,.75);border:4px solid #fff;border-radius:28px;padding:14px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 0 rgba(47,122,36,.25)}
.gbar{display:flex;align-items:center;gap:10px}
.gbar h2{font-size:24px;flex:1;min-width:0;color:var(--forest)}
.back{background:#fff;border-radius:16px;width:46px;height:46px;font-size:22px;box-shadow:0 4px 0 rgba(47,122,36,.3);flex:none}
.prog{display:flex;gap:6px;justify-content:center}
.prog i{width:16px;height:16px;border-radius:50%;background:#dfeccf;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.prog i.ok{background:var(--leaf)}.prog i.now{background:var(--sun)}
.ask{display:flex;align-items:center;gap:10px}
.ask .growie img{width:72px;height:72px}
.say{background:var(--sun);color:#4a3200;border-radius:999px;width:64px;height:64px;font-size:30px;flex:none;box-shadow:0 5px 0 var(--sun-d)}
.say.play{animation:pop .5s}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pic{background:#fff;border-radius:24px;padding:10px;box-shadow:0 6px 0 rgba(47,122,36,.25);display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pic img{width:100%;max-width:150px;aspect-ratio:1}
.pic.ok{background:#c9f7b0;box-shadow:0 6px 0 var(--leaf-d)}
.pic.no{animation:shake .4s;background:#ffe0ea}
.fb{text-align:center;font:800 22px var(--f-display);min-height:30px}
.fb.ok{color:var(--leaf-d)}.fb.no{color:#d23a6c}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-7px) rotate(-2deg)}75%{transform:translateX(7px) rotate(2deg)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.1)}}
/* memorama */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{background:none;padding:0;aspect-ratio:3/4;perspective:600px;min-width:0}
.mc-in{position:relative;display:block;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mc.open .mc-in,.mc.done .mc-in{transform:rotateY(180deg)}
.mc-b,.mc-f{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:5px}
.mc-b{background:linear-gradient(160deg,#7ed957,#3c9e2b);box-shadow:0 5px 0 #2a7a1d;font-size:30px}
.mc-f{background:#fff;transform:rotateY(180deg);box-shadow:0 5px 0 rgba(47,122,36,.3);font:800 19px var(--f-display);color:var(--forest)}
.mc-f img{width:100%}
.mc.done .mc-f{background:#c9f7b0}
/* atrapa las hojas */
.field{position:relative;height:380px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#bfeaff,#e3f6cf 75%,#9fd879);border:4px solid #fff}
.target{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:999px;padding:6px 14px;font:800 22px var(--f-display);box-shadow:0 4px 0 rgba(47,122,36,.25);align-self:center}
.target img{width:42px;height:42px}
.lf{position:absolute;top:-110px;width:92px;height:104px;background:none;padding:0;animation:caer linear forwards}
.lf .shape{position:absolute;inset:0;background:radial-gradient(circle at 35% 30%,#a6e872,#4caf2c);border-radius:50% 0 50% 50%;transform:rotate(-45deg);box-shadow:0 4px 0 #2a7a1d}
.lf img{position:absolute;left:14px;top:18px;width:64px;height:64px}
.lf.got{animation:none!important;transform:scale(1.25);opacity:0;transition:all .35s}
.lf.no{filter:grayscale(.6)}
@keyframes caer{to{transform:translateY(520px) rotate(25deg)}}
.score{position:absolute;right:10px;top:10px;background:#fff;border-radius:999px;padding:4px 12px;font:800 18px var(--f-display);box-shadow:0 3px 0 rgba(0,0,0,.1)}
/* growie pregunta */
.replies{display:flex;flex-direction:column;gap:10px}
.rep{background:#fff;border-radius:22px;padding:12px 16px;font:800 21px var(--f-display);color:var(--forest);box-shadow:0 5px 0 rgba(47,122,36,.3);text-align:left}
.rep.ok{background:#c9f7b0}.rep.no{background:#ffe0ea;animation:shake .4s}
.kid{display:flex;justify-content:center}
.kid img{width:140px;height:140px;filter:drop-shadow(0 6px 0 rgba(47,122,36,.25))}
/* premio */
.prize{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.prize .leaves{font-size:58px;letter-spacing:4px}
.prize .leaves .dim{opacity:.22;filter:grayscale(1)}
.prize h2{font-size:34px;color:var(--forest)}
.prize p{margin:0;font-weight:800;color:var(--mute)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.stk img{width:100%;max-width:420px;display:block;border-radius:22px;box-shadow:0 8px 0 rgba(47,122,36,.3)}
.note{font-size:13px;color:var(--mute);text-align:center;margin:0;font-weight:800}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px;padding:18px 10px 8px}
.leafbtn{aspect-ratio:1;width:80%;justify-self:center;border-radius:50% 0 50% 50%;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.leafbtn span{transform:rotate(45deg);font:800 22px var(--f-display)}
.leafbtn.done{background:radial-gradient(circle at 35% 30%,#ffe57a,#f2b705);color:#5a3c00}
.leafbtn.now{background:radial-gradient(circle at 35% 30%,#a6e872,#4caf2c);color:#fff;outline:4px solid var(--sun)}
.leafbtn.soon{background:#e2efd6;color:#9bb38c}
@media (prefers-reduced-motion:reduce){.pulse,.mc-in,.lf{animation-duration:12s}.shake,.pop{animation:none!important}}
.emo{display:inline-block;font-size:64px;line-height:1}
.pic .emo{font-size:96px}.kid .emo{font-size:110px}.lf .emo{position:absolute;left:18px;top:20px;font-size:54px}.target .emo{font-size:36px}
.mc-f .emo{font-size:48px}.mw{font:800 17px var(--f-display);line-height:1.1;overflow-wrap:anywhere}
.kid{gap:10px;flex-wrap:wrap}.kid img{width:120px;height:120px}
.tabs{display:flex;gap:10px}
.tab{flex:1;background:#fff;border-radius:20px;padding:10px;font:800 18px var(--f-display);color:var(--leaf-d);box-shadow:0 5px 0 rgba(47,122,36,.25);display:flex;flex-direction:column;align-items:center}
.tab small{font:900 12px var(--f-body);color:var(--mute)}
.tab.on{background:var(--leaf);color:#fff;box-shadow:0 5px 0 var(--leaf-d)}.tab.on small{color:#eaffd8}
.tab.lock{opacity:.6;filter:grayscale(.6)}
.hoy{display:flex;align-items:center;gap:12px;background:linear-gradient(140deg,#ffb04d,#ff7a2a);color:#fff;border-radius:24px;padding:10px 16px;box-shadow:0 7px 0 #c85712;text-align:left}
.hoy img.mini{width:54px;height:54px;border-radius:50%;border:3px solid #fff;object-fit:cover}
.hoy span{flex:1;display:flex;flex-direction:column}.hoy b{font:800 20px var(--f-display)}.hoy small{font:800 14px var(--f-body);opacity:.95}.hoy em{font-style:normal;font-size:24px}
.leafbtn.play{background:radial-gradient(circle at 35% 30%,#a6e872,#4caf2c);color:#fff}
.leafbtn.soon{background:#fff;color:var(--leaf-d)}
.leafbtn.now{outline:5px solid var(--ora);outline-offset:2px}
.okm{color:var(--leaf-d)!important;font-size:17px}
.wa{background:#25d366;color:#05301a;box-shadow:0 6px 0 #138a43}.fb2{background:#1877f2;box-shadow:0 6px 0 #0b4fa8}
.ig{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);box-shadow:0 6px 0 #6b1f6e}
.shmsg{display:none;width:100%;background:#fff;border-radius:18px;padding:12px 14px;text-align:left;font-weight:800;color:var(--ink);box-shadow:0 4px 0 rgba(47,122,36,.2)}
.shmsg.on{display:flex;flex-direction:column;gap:8px}.shmsg .okt{color:var(--leaf-d)}.shmsg ol{margin:0;padding-left:20px}
.cat{display:grid;grid-template-columns:1fr;gap:12px}
.cg{position:relative;border-radius:24px;padding:14px 16px 14px 92px;color:#fff;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:center}
.cg .big{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:52px}
.cg h3{font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.18)}.cg p{margin:2px 0 0;font:800 13.5px var(--f-body);opacity:.95}
.cg .L{position:absolute;right:12px;top:10px;background:#fff;color:var(--forest);border-radius:999px;width:34px;height:34px;display:grid;place-items:center;font:800 20px var(--f-display)}
.g5{background:linear-gradient(160deg,#ff6fa5,#e03c7d);box-shadow:0 7px 0 #a8245a}.g6{background:linear-gradient(160deg,#2ec4b6,#14897e);box-shadow:0 7px 0 #0c6058}
.g7{background:linear-gradient(160deg,#ffcf3f,#f0a300);box-shadow:0 7px 0 #b37800}.g8{background:linear-gradient(160deg,#5b8cff,#3557d6);box-shadow:0 7px 0 #233d9e}
.g9{background:linear-gradient(160deg,#a0785a,#6b4a30);box-shadow:0 7px 0 #4a321f}
.sel{display:flex;flex-direction:column;gap:6px;font:800 14px var(--f-body);color:var(--forest)}
.sel select{font:800 16px var(--f-body);padding:10px;border-radius:14px;border:3px solid #fff;box-shadow:0 4px 0 rgba(47,122,36,.25)}
.target2{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:999px;padding:6px 18px 6px 6px;font:800 26px var(--f-display);color:var(--forest);box-shadow:0 4px 0 rgba(47,122,36,.25);align-self:center}
.say.sm{width:52px;height:52px;font-size:24px}
.prog2{text-align:center;font:800 18px var(--f-display);color:var(--forest)}
.field.sky{height:420px;touch-action:none}
.globo{position:absolute;bottom:-150px;width:96px;height:140px;background:none;padding:0;animation:subir linear forwards}
.globo .gb{position:absolute;top:0;left:0;width:96px;height:112px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.7),transparent 30%),var(--c);display:grid;place-items:center;box-shadow:inset -8px -10px 0 rgba(0,0,0,.12)}
.globo .gb img{width:62px;height:62px}.globo .gb .emo{font-size:50px}
.globo i{position:absolute;left:47px;top:110px;width:2px;height:30px;background:#7a8a7a}
.globo.boom{animation:none!important;transform:scale(1.6);opacity:0;transition:all .25s}
@keyframes subir{to{transform:translateY(-600px) rotate(6deg)}}
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:linear-gradient(180deg,#8ed16b,#5cb83a);border-radius:24px;padding:14px;border:4px solid #fff}
.hole{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(ellipse at 50% 70%,#5a3a1c 0 45%,#7b5330 46% 60%,transparent 61%);overflow:hidden}
.mole{position:absolute;left:8%;width:84%;height:100%;top:100%;background:none;padding:0;transition:top .18s;display:flex;flex-direction:column;align-items:center}
.hole.up .mole{top:4%}.hole.hit .mole{filter:brightness(1.4)}
.mole .cara{font-size:42px;line-height:1}.mole .sign{background:#fff;border-radius:14px;padding:4px;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.mole .sign img{width:46px;height:46px;display:block}.mole .sign .emo{font-size:38px}
.mouth{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:24px;border:4px dashed #b7dca0;transition:transform .2s}
.mouth .gbig{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 6px 0 var(--leaf-d)}
.mouth.yum .gbig{animation:yum .6s}@keyframes yum{30%{transform:scale(1.15) rotate(-5deg)}60%{transform:scale(.95) rotate(4deg)}}
.bubble2{background:#fff;border-radius:22px;padding:8px 10px 8px 16px;font:800 22px var(--f-display);color:var(--forest);display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(47,122,36,.25)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.food{background:#fff;border-radius:20px;padding:8px;box-shadow:0 5px 0 rgba(47,122,36,.25);touch-action:none;cursor:grab;user-select:none;z-index:2;position:relative}
.food img{width:100%;aspect-ratio:1;pointer-events:none}.food .emo{font-size:52px;pointer-events:none}
.food.drag{z-index:20;box-shadow:0 12px 20px rgba(0,0,0,.25)}.food.eaten{transition:all .4s;transform:scale(0)!important;opacity:0}
.dark{position:relative;height:400px;border-radius:24px;overflow:hidden;background:linear-gradient(180deg,#bfeaff,#e3f6cf);border:4px solid #fff;touch-action:none}
.hid{position:absolute;background:none;padding:0;width:84px;height:84px}.hid img{width:100%;height:100%}.hid .emo{font-size:64px}
.hid.found{animation:pop .4s;filter:drop-shadow(0 0 14px #ffd23f)}
.luz{position:absolute;inset:0;pointer-events:none;--x:50%;--y:50%;background:radial-gradient(circle 80px at var(--x) var(--y),transparent 0 70%,rgba(8,14,40,.96) 100%)}
.bigcard{align-self:center;background:#fff;border-radius:30px;padding:16px;box-shadow:0 7px 0 rgba(47,122,36,.25);width:200px;height:200px;display:grid;place-items:center}
.bigcard img{width:100%;height:100%}.bigcard .emo{font-size:130px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yn button{border-radius:24px;padding:18px;font:800 30px var(--f-display);color:#fff}
.bt-yes{background:var(--leaf);box-shadow:0 7px 0 var(--leaf-d)}.bt-no{background:#ff5c7a;box-shadow:0 7px 0 #c2324f}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:44px;height:52px;border-radius:12px;background:#fff;border:3px dashed #b7dca0;display:grid;place-items:center;font:800 30px var(--f-display);color:var(--forest)}
.slot.full{border-style:solid;border-color:var(--leaf);background:#eaffd8}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile{width:54px;height:58px;border-radius:14px;background:linear-gradient(160deg,#ffcf3f,#f0a300);box-shadow:0 5px 0 #b37800;font:800 30px var(--f-display);color:#5a3c00}
.tile.used{opacity:.25}
.cesta{position:absolute;bottom:6px;width:90px;height:70px;font-size:64px;line-height:70px;text-align:center;pointer-events:none}
.cae{position:absolute;top:-60px;width:56px;height:56px}.cae img{width:100%;height:100%}.cae .emo{font-size:46px}
.say-it{text-align:center;font:800 28px var(--f-display);color:var(--forest)}
.btn.mic{background:#5b8cff;box-shadow:0 6px 0 #233d9e}.btn.mic.rec{background:#ff5c7a;box-shadow:0 6px 0 #c2324f;animation:pul2 1s infinite}
@keyframes pul2{50%{transform:scale(1.08)}}
.race{display:flex;flex-direction:column;gap:8px;background:#e9d8b4;border-radius:20px;padding:10px;border:4px solid #fff}
.lane{position:relative;height:56px;background:repeating-linear-gradient(90deg,#d8c08f 0 20px,#e3cda0 20px 40px);border-radius:14px}
.runner{position:absolute;top:2px;transition:left .6s}.runner img.rn{width:52px;height:52px;border-radius:50%;border:3px solid #fff;object-fit:cover}.snail{font-size:44px;line-height:52px}
.flag{position:absolute;right:6px;top:8px;font-size:32px}

.g.g5,.g.g6,.g.g7,.g.g8,.g.g9{color:#fff}
.gbar{position:relative}.ptsw{position:relative;flex:none}
.pts{display:inline-block;background:var(--sun);color:#4a3200;border-radius:999px;padding:6px 12px;font:800 18px var(--f-display);box-shadow:0 4px 0 var(--sun-d)}
.pts.bump{animation:pop .35s}.plus{position:absolute;right:0;top:-6px;font:800 18px var(--f-display);color:var(--leaf-d);animation:subeplus .9s forwards;white-space:nowrap}
@keyframes subeplus{to{transform:translateY(-34px);opacity:0}}
.bigpts{font:800 46px var(--f-display);color:#e08a00;text-shadow:0 3px 0 #fff}.bigpts small{font-size:20px;color:var(--mute)}
.winner{background:#fff;border-radius:22px;padding:12px 18px;font:800 26px var(--f-display);color:var(--forest);box-shadow:0 5px 0 rgba(47,122,36,.25)}
.winner.snail{color:#a8245a}.winner small{font-size:17px;color:var(--mute)}
.stage,.album{background:rgba(255,255,255,.82)}
.totbox{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);border:4px solid #fff;border-radius:22px;padding:10px 12px;box-shadow:0 5px 0 rgba(47,122,36,.25)}
.totbox div{flex:1;display:flex;flex-direction:column;white-space:nowrap}.totbox .btn{flex:none;font-size:15px;padding:10px 14px}.totbox small{font:900 12px var(--f-body);color:var(--mute);letter-spacing:.08em}.totbox b{font:800 32px var(--f-display);color:#e08a00}
.g .bp{font:800 14px var(--f-body);background:rgba(0,0,0,.18);border-radius:999px;padding:2px 10px}
.mpts{font:800 30px var(--f-display);color:#e08a00}.mpts small{font-size:15px;color:var(--mute)}
.rkbtn{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;text-align:left;background:linear-gradient(140deg,#ffd23f,#f0a300);color:#5a3c00;border-radius:24px;padding:10px 16px;box-shadow:0 7px 0 #b37800}
.rkbtn span{grid-row:1/3;font-size:40px}.rkbtn b{font:800 21px var(--f-display)}.rkbtn small{font:800 13px var(--f-body)}
.podio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end}
.pc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.pc b{font:800 16px var(--f-display);color:var(--forest);text-align:center;overflow-wrap:anywhere}.pc span{font:800 14px var(--f-body);color:#e08a00}
.pb{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:start center;padding-top:8px;font-size:34px;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.p1 .pb{background:linear-gradient(180deg,#ffe57a,#f2b705)}.p2 .pb{background:linear-gradient(180deg,#e9eef5,#b9c4d3)}.p3 .pb{background:linear-gradient(180deg,#ffc89a,#d98a4a)}
.pc.yo b{color:var(--ora)}
.rl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rl li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:9px 12px;box-shadow:0 3px 0 rgba(47,122,36,.2);font-weight:800}
.rl li.yo{background:#fff3c4;outline:3px solid var(--sun)}.rl .rp{width:30px;text-align:center;font:800 18px var(--f-display)}.rl .rn{flex:1;min-width:0}.rl em{font-style:normal;color:var(--ora)}.rl .rv{color:#e08a00}

<div class="wrap" id="app"></div>

<script>
(function(){
// ═══════════════════════════════════════════════════════════════
//  GROWIE KIDS · Práctica de las 32 misiones de cada bloque
//  El niño solo ve las misiones de SU bloque (A1.1 o A1.2).
//  Datos: kids_A1.1.json / kids_A1.2.json (escritos a mano por misión)
//  Parámetros: ?nombre=&nivel=KIDS-A1.1&mision=3&grupo=&id=
// ═══════════════════════════════════════════════════════════════
var CONFIG = { GROWIE: 'growie.jpg', LOGO: 'logo.png', API: 'https://script.google.com/macros/s/AKfycbwZm4Yl1u_Qm-FSyS6FGA84wV8cp6flpHggXnslzg-PxlUD7LVD-1Iftr3NHBJwHFYO/exec' };
var NINO = (function(){
  var p = new URLSearchParams(location.search), d = {};
  try { d = JSON.parse(sessionStorage.getItem('oe_practica_alumno') || '{}'); } catch(e) {}
  var nombre = p.get('nombre') || d.nombre || '', nivel = (p.get('nivel') || d.nivel || 'KIDS-A1.1').toUpperCase().replace('KIDS-', '');
  if (['A1.1','A1.2'].indexOf(nivel) < 0) nivel = 'A1.1';
  var mision = parseInt(p.get('mision') || p.get('leccion') || d.leccion || '3', 10) || 1;
  var completo = (nombre || 'Leo Martínez').trim(), pz = completo.split(/\s+/);
  return { nombre: completo, corto: pz[0] + (pz[1] ? ' ' + pz[1].charAt(0) + '.' : ''), id: p.get('id') || d.id || '', pila: pz[0], bloque: nivel, mision: Math.min(32, Math.max(1, mision)), grupo: p.get('grupo') || d.grupo || '', demo: !nombre };
})();
var BLOQUES = { 'A1.1': { nombre:'Bloque 1', icono:'🌱' }, 'A1.2': { nombre:'Bloque 2', icono:'🌳' } };
var DATA = null, M = null;
var JUEGOS = [
  { id:'globos',   L:'A', cls:'g1', big:'🎈', name:'Revienta globos',     desc:'Los globos suben con dibujos. Growie dice una palabra y el niño revienta el globo correcto.', fn:globos },
  { id:'topos',    L:'B', cls:'g2', big:'🔨', name:'Pega al topo',         desc:'Salen topitos de sus hoyos con un dibujo. Hay que pegarle solo al que Growie pide.', fn:topos },
  { id:'alimenta', L:'C', cls:'g3', big:'😋', name:'Dale a Growie',        desc:'Growie pide algo en inglés y el niño lo arrastra hasta su boca. ¡Yum!', fn:alimenta },
  { id:'linterna', L:'D', cls:'g4', big:'🔦', name:'La linterna mágica',   desc:'Todo está oscuro. Con la linterna hay que buscar lo que Growie pide.', fn:linterna },
  { id:'sino',     L:'E', cls:'g5', big:'✅', name:'¿Sí o no?',            desc:'Sale un dibujo y Growie dice una palabra. ¿Coinciden? Sí ✅ o No ❌. Rápido y fácil.', fn:sino },
  { id:'letras',   L:'F', cls:'g6', big:'🔤', name:'Arma la palabra',      desc:'Ve el dibujo y toca las letras en orden para escribir la palabra.', fn:letras },
  { id:'canasta',  L:'G', cls:'g7', big:'🧺', name:'Atrapa con la canasta',desc:'Caen cosas del cielo. Mueve la canasta para atrapar solo lo que Growie dice.', fn:canasta },
  { id:'repite',   L:'H', cls:'g8', big:'🎤', name:'Repite con Growie',    desc:'El niño escucha y lo dice en voz alta. El celular lo escucha y le da estrellas.', fn:repite },
  { id:'carrera',  L:'I', cls:'g9', big:'🏁', name:'Carrera vs. el caracol',desc:'Growie le contesta preguntas a una carrera contra el caracol. Cada respuesta buena lo hace avanzar.', fn:carrera }
];
// Cada misión usa 4 de los 9 juegos, elegidos al azar pero siempre los mismos para esa misión
// (así las hojitas y la calcomanía no cambian). Máximo 1 de los juegos "de atrapar" para que haya variedad.
var PARECIDOS = ['globos','topos','canasta'];
var SR_OK = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
function semilla(t){ var h = 2166136261; for (var i = 0; i < t.length; i++) { h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function barajarCon(a, s){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { s = Math.imul(s ^ (s >>> 15), 2246822507) >>> 0; s = (s + 0x6D2B79F5) >>> 0; var j = s % (i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function sirve(j, m){
  if (j.id === 'repite') return SR_OK;
  if (j.id === 'carrera') return (m.preguntas || []).length >= 3;
  if (j.id === 'letras') return m.items.filter(function(x){ var w = x.w.replace(/[^A-Za-z]/g, ''); return w.length >= 2 && w.length <= 8 && !/\s/.test(x.w.trim()); }).length >= 3;
  return true;
}
var _cacheJ = {};
function juegosDe(n){
  if (_cacheJ[n]) return _cacheJ[n];
  var m = DATA.misiones[n-1], out = [], parecidos = 0;
  barajarCon(JUEGOS, semilla(NINO.bloque + '-' + n)).forEach(function(j){
    if (out.length >= 4 || !sirve(j, m)) return;
    if (PARECIDOS.indexOf(j.id) >= 0) { if (parecidos >= 1) return; parecidos++; }
    out.push(j);
  });
  return (_cacheJ[n] = out);
}
var KEY = 'oe_kids_v1', DB = {};
try { DB = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
function mk(n){ return NINO.bloque + '-' + n; }
function hojasDe(n){ return DB[mk(n)] || {}; }
function guardar(id, n){ var k = mk(M.num); DB[k] = DB[k] || {}; if (!(DB[k][id] >= n)) DB[k][id] = n; try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch(e) {} }
function ptsMision(n){ var h = hojasDe(n), t = 0; juegosDe(n).forEach(function(g){ t += h['p_' + g.id] || 0; }); return t; }
function ptsTotal(){ var t = 0; for (var n = 1; n <= 32; n++) t += ptsMision(n); return t; }
function totalMision(n){ var h = hojasDe(n), t = 0; juegosDe(n).forEach(function(g){ t += h[g.id] || 0; }); return t; }
function completa(n){ var h = hojasDe(n); return juegosDe(n).every(function(g){ return h[g.id]; }); }

var app = document.getElementById('app'), run = 0, timers = [];
function later(fn, ms){ var r = run; var t = setTimeout(function(){ if (r === run) fn(); }, ms); timers.push(t); return t; }
function limpiar(){ run++; timers.forEach(clearTimeout); timers = []; cancelAnimationFrame(raf); if (window.__rec) try { __rec.abort(); } catch(e) {} if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch(e) {} }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }
function hojitas(n){ var h=''; for (var i=0;i<3;i++) h += '<span class="'+(i<n?'':'dim')+'">🍃</span>'; return h; }
// Emoji 3D (Fluent Emoji, MIT) → <código>.webp; si falta, el emoji normal
function emoCode(e){ var out = []; for (var i = 0; i < e.length; i++) { var c = e.codePointAt(i); if (c > 0xffff) i++; if (c !== 0xfe0f) out.push(c.toString(16)); } return out.join('-'); }
function pic(e, cls){ return '<img class="'+(cls||'')+'" src="'+emoCode(e)+'.webp" alt="" draggable="false" onerror="this.outerHTML=\'<span class=&quot;emo '+(cls||'')+'&quot;>'+e+'</span>\'">'; }
var vozEN = null;
function cargarVoz(){ try { var vs = speechSynthesis.getVoices(); vozEN = vs.filter(function(v){ return /^en(-|_)US/i.test(v.lang); })[0] || vs.filter(function(v){ return /^en/i.test(v.lang); })[0] || null; } catch(e) {} }
if (window.speechSynthesis) { cargarVoz(); try { speechSynthesis.onvoiceschanged = cargarVoz; } catch(e) {} }
function decir(t){ try { if (!window.speechSynthesis) return false; speechSynthesis.cancel(); var u = new SpeechSynthesisUtterance(String(t).replace(/___/g, 'blank')); u.lang = 'en-US'; u.rate = .82; u.pitch = 1.1; if (vozEN) u.voice = vozEN; speechSynthesis.speak(u); return true; } catch(e) { return false; } }
var AC = null;
function tono(tipo){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.connect(g); g.connect(AC.destination);
  var f = { ok:[660,990], no:[220,160], pop:[900,300], win:[523,1046] }[tipo] || [600,600]; o.type = tipo === 'no' ? 'sawtooth' : 'triangle';
  o.frequency.setValueAtTime(f[0], t); o.frequency.exponentialRampToValueAtTime(f[1], t + .18); g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .25); o.start(t); o.stop(t + .26); } catch(e) {} }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
var raf = 0;
function porId(id){ var j = JUEGOS.filter(function(x){ return x.id === id; })[0]; if (j && !j._w) { var f = j.fn; j.fn = function(){ PUNTOS = 0; RACHA = 0; f(); }; j._w = 1; } return j; }

// ═════════ PUNTOS (como en adultos: cada acierto vale) ═════════
var PUNTOS = 0, RACHA = 0;
function acierto(mult){ RACHA++; var n = Math.round(10 * (mult || 1)) + (RACHA >= 3 ? 5 : 0); PUNTOS += n; tono('ok');
  var el = document.getElementById('pts'); if (el) { el.textContent = '⭐ ' + PUNTOS; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    var f = document.createElement('span'); f.className = 'plus'; f.textContent = '+' + n + (RACHA >= 3 ? ' 🔥' : ''); el.parentNode.appendChild(f); setTimeout(function(){ f.remove(); }, 900); } }
function fallo(){ RACHA = 0; tono('no'); }
function stageJ(j, inner){ stage(j.big + ' ' + j.name, inner); var gb = app.querySelector('.gbar'); if (gb) gb.insertAdjacentHTML('beforeend', '<span class="ptsw"><span class="pts" id="pts">⭐ ' + PUNTOS + '</span></span>'); }
function fin(j, pct){ premio(j.id, pct); }
function target(p){ return '<div class="target2"><button class="say sm" id="say">🔊</button><span id="tw">'+esc(p.w)+'</span></div>'; }
function bindSay(getP){ var b = document.getElementById('say'); if (b) b.onclick = function(){ decir(getP().w); }; }
var BIEN = ['¡Muy bien! 🌟','¡Súper! 🎉','¡Eso es! 🍃','¡Excelente! ⭐','¡Bravo! 👏'];
function header(chip){ return '<div class="top"><div class="brand">Growie <b>Kids</b></div><span class="chip">'+chip+'</span></div>'; }
function stage(titulo, inner, alVolver){
  app.innerHTML = header('Mission ' + M.num) + '<section class="stage"><div class="gbar"><button class="back" id="back" aria-label="Volver">←</button><h2>'+titulo+'</h2></div>'+inner+'</section>';
  document.getElementById('back').onclick = alVolver || mision; window.scrollTo(0,0);
}
function puntos(n){ var h=''; for (var i=0;i<n.total;i++) h += '<i class="'+(i<n.hechos?'ok':(i===n.hechos?'now':''))+'"></i>'; return '<div class="prog">'+h+'</div>'; }
function growie(cls){ return '<img src="'+CONFIG.GROWIE+'" alt="Growie" draggable="false"'+(cls?' class="'+cls+'"':'')+'>'; }

// ═════════ MAPA DE MISIONES (solo el bloque del niño) ═════════
function mapa(){
  limpiar();
  var hechas = 0; for (var n = 1; n <= 32; n++) if (completa(n)) hechas++;
  var hojas = ''; DATA.misiones.forEach(function(m){
    var n = m.num, est = completa(n) ? 'done' : totalMision(n) ? 'play' : 'soon';
    hojas += '<button class="leafbtn '+est+(n === NINO.mision ? ' now' : '')+'" data-n="'+n+'" aria-label="Mission '+n+': '+esc(m.titulo)+'"><span>'+n+'</span></button>';
  });
  app.innerHTML = header(BLOQUES[NINO.bloque].icono + ' ' + BLOQUES[NINO.bloque].nombre) +
    '<div class="growie">'+growie()+'<div class="bubble">¡Hola, '+esc(NINO.pila)+'! 👋<small>Toca una hoja para jugar su misión. Llevas '+hechas+' de 32 misiones.</small></div></div>' +
    '<div class="totbox"><div><small>MIS PUNTOS</small><b>⭐ '+ptsTotal()+'</b></div><button class="btn small" id="stkG">🏅 Mi calcomanía de explorador</button></div>' +
    '<button class="rkbtn" id="rk"><span>🏆</span><b>Ranking de mi grupo</b><small>¿Quién lleva más puntos esta semana?</small></button>' +
    '<div class="tabs">' + Object.keys(BLOQUES).map(function(b){ var mio = b === NINO.bloque;
      return '<button class="tab'+(mio?' on':' lock')+'" data-b="'+b+'">'+(mio ? BLOQUES[b].icono : '🔒')+' '+BLOQUES[b].nombre+'<small>'+b+'</small></button>'; }).join('') + '</div>' +
    '<button class="hoy" id="hoy">'+growie('mini')+'<span><b>Mi misión de hoy</b><small>Mission '+NINO.mision+' · '+esc(DATA.misiones[NINO.mision-1].titulo)+'</small></span><em>▶</em></button>' +
    '<div class="map">' + hojas + '</div>' +
    '<p class="note">🍃 verde = ya jugaste · 🌟 dorada = misión completa (los 4 juegos)</p>' +
    '<div class="fb" id="fb"></div>' +
    (NINO.demo ? '<p class="note">Modo demo con un alumno de ejemplo. Activa el sonido para escuchar a Growie.</p>' : '');
  document.getElementById('hoy').onclick = function(){ abrir(NINO.mision); };
  document.getElementById('rk').onclick = ranking;
  document.getElementById('stkG').onclick = function(){ M = DATA.misiones[NINO.mision-1]; calcomania({ ribbon:'Growie Explorer · ' + BLOQUES[NINO.bloque].nombre, sub: hechas ? '¡Llevo ' + hechas + ' de 32 misiones!' : '¡Ya empecé mi aventura en inglés!', pts: ptsTotal(), hojas:3, volver: mapa }); };
  app.querySelectorAll('.leafbtn').forEach(function(b){ b.onclick = function(){ abrir(+b.dataset.n); }; });
  app.querySelectorAll('.tab.lock').forEach(function(b){ b.onclick = function(){ var fb = document.getElementById('fb'); fb.className = 'fb'; fb.textContent = NINO.bloque === 'A1.1' ? '🔒 Se abre cuando pases al Bloque 2 🌳' : '🔒 Ese bloque ya lo terminaste. ¡Ahora juega el tuyo!'; }; });
  window.scrollTo(0,0);
}
function abrir(n){ M = DATA.misiones[n-1]; mision(); }


// ═════════ RANKING DEL GRUPO (semana actual; se reinicia cada lunes 8 AM) ═════════
var RANK_OK = !!(CONFIG.API && !NINO.demo && NINO.id && NINO.grupo);
var AMIGOS = [ { n:'Mateo R.', p:420 }, { n:'Valentina G.', p:385 }, { n:'Santi L.', p:310 }, { n:'Regina M.', p:260 }, { n:'Emiliano C.', p:190 }, { n:'Camila P.', p:120 } ];
function semanaLocal(){ var d = new Date(Date.now() - 8*3600*1000); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function ranking(){
  limpiar(); var miRun = run;
  function pintar(lista, cargando){
    if (miRun !== run) return;
    var t = lista.map(function(r){ return { n:r.n, p:r.p, yo:!!r.yo }; });
    if (!t.some(function(r){ return r.yo; })) t.push({ n:NINO.corto, p: RANK_OK ? 0 : ptsTotal(), yo:true });
    t.sort(function(a,b){ return b.p - a.p || (a.yo ? -1 : b.yo ? 1 : 0); });
    var miPos = 0, miPts = 0; t.forEach(function(r, k){ if (r.yo) { miPos = k + 1; miPts = r.p; } });
    var med = ['🥇','🥈','🥉'], top = t.slice(0,3), orden = [top[1], top[0], top[2]], alt = [110, 150, 84], cls = ['p2','p1','p3'];
    app.innerHTML = header('🏆 Ranking') + '<section class="stage"><div class="gbar"><button class="back" id="back" aria-label="Volver">←</button><h2>🏆 Mi grupo'+(NINO.grupo ? ' ' + esc(NINO.grupo) : '')+'</h2></div>' +
      '<div class="growie">'+growie()+'<div class="bubble">'+(cargando ? 'Buscando los puntos de tu grupo… ⏳' : '¡Así va tu grupo esta semana!')+'<small>Se reinicia cada lunes 8 AM · solo cuentan tus mejores puntajes</small></div></div>' +
      '<div class="podio">' + orden.map(function(r,k){ if (!r) return '<div></div>'; return '<div class="pc '+cls[k]+(r.yo?' yo':'')+'"><b>'+(r.yo ? '¡Tú!' : esc(r.n))+'</b><span>⭐ '+r.p+'</span><div class="pb" style="height:'+alt[k]+'px">'+med[[1,0,2][k]]+'</div></div>'; }).join('') + '</div>' +
      '<ol class="rl">' + t.map(function(r,k){ return '<li class="'+(r.yo?'yo':'')+'"><span class="rp">'+(k<3?med[k]:(k+1))+'</span><span class="rn">'+esc(r.n)+(r.yo?' <em>(tú)</em>':'')+'</span><span class="rv">⭐ '+r.p+'</span></li>'; }).join('') + '</ol>' +
      (RANK_OK ? '' : '<p class="note">Modo demo: compañeros de ejemplo.</p>') +
      '<button class="btn" id="aJugar">🍃 ¡A sumar puntos!</button>' + (!cargando && miPts ? '<button class="btn" id="shRank" style="margin-top:10px;background:linear-gradient(140deg,#a77bff,#6a4bd6)">📣 Compartir mi lugar</button>' : '') + '</section>';
    document.getElementById('back').onclick = mapa;
    var sr = document.getElementById('shRank');
    // Solo se comparte el lugar y los puntos del niño: nunca nombres ni puntos de sus compañeros.
    if (sr) sr.onclick = function(){ M = DATA.misiones[NINO.mision-1]; calcomania({ ribbon:'🏆 Lugar #' + miPos + ' de mi grupo', sub: miPos <= 3 ? '¡Estoy en el podio esta semana!' : '¡Voy subiendo en mi grupo!', pts: miPts, hojas:3, volver: ranking, volverTxt:'🏆 Volver al ranking', archivo:'growie-ranking.jpg' }); };
    document.getElementById('aJugar').onclick = function(){ abrir(NINO.mision); };
    window.scrollTo(0,0);
  }
  if (!RANK_OK) return pintar(AMIGOS, false);
  pintar([], true);
  fetch(CONFIG.API + '?action=getRankingPractica&programa=KIDS&grupo=' + encodeURIComponent(NINO.grupo) + '&id=' + encodeURIComponent(NINO.id), { redirect:'follow' })
    .then(function(r){ return r.json(); }).then(function(d){ pintar(d && d.success ? d.ranking : [], false); }).catch(function(){ pintar([], false); });
}

// ═════════ PANTALLA DE LA MISIÓN ═════════
function mision(){
  limpiar();

        var alts = []; for (var k = 0; k < e.results[0].length; k++) alts.push(e.results[0][k].transcript);

      r.onerror = function(e){ listo(); if (termino) return; termino = true;

function carrera(){

function compartirSetup(canvas, archivo){

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Road Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: una columna tipo "consola" (máx. 560px). Inicio → lección → juego → resultado → calcomanía. Look oscuro único de Organic (navy + naranja). */
:root{
  --night:#0f1a33; --panel:#18264a; --panel-2:#21335f; --ink:#f4f1ff; --mute:#9fb0d6;
  --ora:#ff7a1a; --ora-soft:#ffb070; --mint:#3ee6a0; --rose:#ff5c7a; --sun:#ffd23f; --grape:#a77bff;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(circle at 15% -10%,rgba(255,122,26,.18),transparent 45%),radial-gradient(circle at 110% 30%,rgba(167,123,255,.16),transparent 40%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
button{font-family:var(--f-display);cursor:pointer;border:none;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top img{height:34px;width:auto}
.chip{font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--panel-2);color:var(--mute);border-radius:999px;padding:5px 10px}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--ora);box-shadow:0 5px 0 #b8400d;transition:transform .08s;text-decoration:none;color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8400d}
.btn.ghost{background:var(--panel-2);box-shadow:0 5px 0 #0b1328}
.btn.small{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* saludo */
.hello{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:22px;padding:12px 14px}
.hello .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(140deg,var(--ora),#ff4f6d);display:grid;place-items:center;font:700 22px var(--f-display);flex:none}
.hello b{display:block;font:700 20px var(--f-display)}
.hello small{color:var(--mute);font-weight:800;font-size:12.5px}
.today{background:linear-gradient(140deg,var(--ora),#ff4f6d);border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 0 #b8400d;text-align:left;width:100%}
.today .k{font:800 11.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.today h2{font-size:24px;margin:2px 0}
.today .go{margin-left:auto;font-size:30px;flex:none}
.rankteaser{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#2a2160,var(--panel));border:2px solid rgba(255,210,63,.35);border-radius:22px;padding:12px 14px;font-family:var(--f-body);box-shadow:0 6px 0 #0b1328;width:100%;text-align:left}
.rankteaser .trophy{font-size:32px}
.rankteaser b{display:block;font:700 17px var(--f-display)}
.rankteaser small{color:var(--sun);font-weight:800;font-size:12.5px}
/* niveles y lecciones */
.tabs{display:flex;gap:8px;background:var(--panel);padding:6px;border-radius:999px}
.tab{flex:1;border-radius:999px;padding:9px 6px;font:700 15px var(--f-display);background:transparent;color:var(--mute)}
.tab.on{background:var(--ora);color:#fff;box-shadow:0 3px 0 #b8400d}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lc{background:var(--panel);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 5px 0 #0b1328;min-width:0;position:relative}
.lc .n{font:700 13px var(--f-display);color:var(--ora-soft);letter-spacing:.04em}
.lc h3{font-size:15.5px;overflow-wrap:anywhere}
.lc .st{margin-top:auto;font-size:13px;letter-spacing:1px;padding-top:4px}
.lc .st .off{opacity:.2;filter:grayscale(1)}
.lc.hoy{outline:3px solid var(--sun)}
.lc .badge{position:absolute;top:-9px;right:10px;background:var(--sun);color:#3a2a00;font:800 10.5px var(--f-body);border-radius:999px;padding:3px 8px;letter-spacing:.04em}
/* lección */
.hero{background:linear-gradient(140deg,var(--ora),#ff4f6d);border-radius:26px;padding:18px 20px;box-shadow:0 10px 0 #b8400d}
.hero .lsn{font:800 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:32px;margin:4px 0 6px}
.hero p{margin:0;font-weight:700}
.overall{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:22px;padding:14px 16px}
.ring{--p:0;width:74px;height:74px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--panel-2) 0)}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 19px var(--f-display);font-variant-numeric:tabular-nums}
.overall h3{font-size:17px}
.overall p{margin:2px 0 8px;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--panel);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 #0b1328;min-width:0}
.tile .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.tile h3{font-size:18px}
.tile small{color:var(--mute);font:700 12.5px var(--f-body);line-height:1.35}
.tile .best{margin-top:auto;font:800 12px var(--f-body);color:var(--sun)}
.tile.wide{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i h" "i s" "i b";column-gap:14px;row-gap:3px;background:linear-gradient(120deg,#0f5f3a,var(--panel))}
.tile.wide .ico{grid-area:i;width:58px;height:58px;font-size:30px;align-self:center}.tile.wide h3{grid-area:h}.tile.wide small{grid-area:s}.tile.wide .best{grid-area:b}
/* juego */
.screen{background:var(--panel);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:14px}
.gbar{display:flex;align-items:center;gap:10px}
.gbar h2{font-size:20px;flex:1;min-width:0}
.back{background:var(--panel-2);border-radius:12px;width:40px;height:40px;font-size:18px;flex:none}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud span{background:var(--night);border-radius:999px;padding:5px 11px;font:800 13px var(--f-body);font-variant-numeric:tabular-nums}
.timer{height:8px;border-radius:99px;background:var(--night);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun),var(--rose));width:100%}
.q{background:var(--night);border-radius:20px;padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.q .ic svg{width:84px;height:84px}
.q .txt{font:600 22px var(--f-display)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--panel-2);border-radius:16px;padding:14px 10px;font:600 16px var(--f-display);box-shadow:0 4px 0 #0b1328;min-width:0;overflow-wrap:anywhere}
.opt.ok{background:var(--mint);color:#062a1c}
.opt.bad{background:var(--rose)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.06)}}
.feedback{text-align:center;font:600 16px var(--f-display);min-height:22px}
.feedback.ok{color:var(--mint)}.feedback.bad{color:var(--rose)}
/* memorama */
.memo{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.memo.two{grid-template-columns:repeat(2,1fr)}
.mc{background:none;padding:0;aspect-ratio:3/4;perspective:700px;min-width:0}
.memo.two .mc{aspect-ratio:auto;min-height:92px}
.mc-in{position:relative;display:block;width:100%;height:100%;min-height:inherit;transition:transform .35s;transform-style:preserve-3d}
.mc.open .mc-in,.mc.done .mc-in{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:8px;text-align:center}
.mc-back{background:linear-gradient(150deg,var(--grape),#6a4bd6);box-shadow:0 5px 0 #432e94}
.mc-back svg{width:46%;height:auto;opacity:.9}
.mc-front{background:#fff;color:#1b2440;transform:rotateY(180deg);box-shadow:0 5px 0 #c9d2e8}
.mc.done .mc-front{background:var(--mint);color:#062a1c;box-shadow:0 5px 0 #137a52}
.mc-front svg{width:78%;height:auto}
.mtxt{font:600 15px var(--f-display);line-height:1.15;overflow-wrap:anywhere}
/* parejas */
.mgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mcol .mi{flex:1}
.mgrid:has(img.foto){grid-template-columns:1fr 1fr}
.mi.sign:has(img.foto){padding:6px}
.mi{background:var(--panel-2);border-radius:14px;padding:10px 8px;font:600 15.5px var(--f-display);box-shadow:0 4px 0 #0b1328;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.mi svg{width:44px;height:44px}
.mi.sel{outline:3px solid var(--sun)}
.mi.done{background:var(--mint);color:#062a1c;opacity:.55;pointer-events:none;box-shadow:none}
.mi.bad{background:var(--rose)}
/* ordena */
.slot{min-height:64px;background:var(--night);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;border:2px dashed var(--panel-2)}
.slot.ok{border-color:var(--mint)}.slot.bad{border-color:var(--rose)}
.wbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.w{background:var(--sun);color:#3a2a00;border-radius:12px;padding:9px 13px;font:600 18px var(--f-display);box-shadow:0 4px 0 #b38f00}
.w.in{background:var(--ora);color:#fff;box-shadow:0 4px 0 #b8400d}
/* chat */
.phone{background:#0b141a;border-radius:22px;overflow:hidden;border:3px solid #22303a}
.phead{display:flex;align-items:center;gap:10px;background:#1f2c34;padding:10px 12px}
.phead b{display:block;font:700 16px var(--f-display)}
.phead small{color:#8fd9a8;font-weight:800;font-size:12px}
.pav{width:42px;height:42px;border-radius:50%;background:var(--ora);display:grid;place-items:center;font:700 18px var(--f-display);flex:none;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover;object-position:top}
.pbody{height:310px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#0b141a radial-gradient(circle,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/18px 18px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;font:700 15px var(--f-body);line-height:1.35;overflow-wrap:anywhere}
.bub.them{align-self:flex-start;background:#202c33;border-top-left-radius:4px}
.bub.me{align-self:flex-end;background:#005c4b;border-top-right-radius:4px}
.bub .hole{display:inline-block;min-width:54px;border-bottom:3px dashed var(--sun);color:var(--sun);text-align:center}
.bwho{display:block;color:var(--ora-soft);font-size:11.5px;font-weight:900}
.tick{color:#53bdeb;font-size:11px;margin-left:4px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25;transform:translateY(-2px)}}
.copts{display:flex;flex-direction:column;gap:8px}
.copts.row3{flex-direction:row;flex-wrap:wrap;justify-content:center}
.copt{background:var(--panel-2);border-radius:16px;padding:12px 14px;font:600 16px var(--f-display);text-align:left;box-shadow:0 4px 0 #0b1328}
.copts.row3 .copt{text-align:center;min-width:28%}
.copt.bad{background:var(--rose);opacity:.7}
/* resultado / ranking / compartir */
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.stars{font-size:44px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.25}
.score{font:700 54px var(--f-display);font-variant-numeric:tabular-nums;line-height:1}
.res p{margin:0;color:var(--mute)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-top:6px}
.pcol{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pname{font:700 15px var(--f-display);text-align:center;overflow-wrap:anywhere}
.ppts{font:800 12px var(--f-body);color:var(--mute)}
.pbar{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:start center;padding-top:8px;font-size:30px}
.p1 .pbar{background:linear-gradient(180deg,var(--sun),#e0a800)}
.p2 .pbar{background:linear-gradient(180deg,#d9e2f2,#9fb0d6)}
.p3 .pbar{background:linear-gradient(180deg,var(--ora-soft),var(--ora))}
.pcol.yo .pname{color:var(--sun)}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rlist li{display:flex;align-items:center;gap:10px;background:var(--night);border-radius:14px;padding:9px 12px}
.rlist li.yo{background:linear-gradient(90deg,rgba(255,122,26,.35),rgba(255,122,26,.12));outline:2px solid var(--ora)}
.rpos{width:30px;text-align:center;font:700 16px var(--f-display)}
.rname{flex:1;min-width:0;font-weight:800}
.rname em{font-style:normal;color:var(--ora-soft)}
.rpts{font:800 13px var(--f-body);color:var(--mute);font-variant-numeric:tabular-nums}
.share{display:flex;flex-direction:column;gap:12px;align-items:center}
.stk-wrap{width:100%;max-width:340px;border-radius:22px;padding:6px;background:repeating-conic-gradient(#1c2a50 0 25%,#16223f 0 50%) 0 0/24px 24px}
.stk-wrap img{display:block;width:100%}
.share p{margin:0;font-size:13px;color:var(--mute);text-align:center;max-width:42ch}
.share p.hl{color:var(--ink);background:var(--panel-2);border-radius:14px;padding:10px 12px}
.ig{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);box-shadow:0 5px 0 #6b1f6e}
.fb{background:#1877f2;box-shadow:0 5px 0 #0b4fa8}
.wa{background:#25d366;color:#05301a;box-shadow:0 5px 0 #138a43}
.story{display:flex;flex-direction:column;align-items:center;gap:6px}
.story img{width:150px;border-radius:14px}
.story span{font:800 12px var(--f-body);color:var(--mute)}
.loading{text-align:center;color:var(--mute);padding:30px}
@media (max-width:380px){.hero h1{font-size:27px}.opt{font-size:15px}.grid{grid-template-columns:1fr}.tile.wide{grid-template-columns:auto 1fr}}

/* ═══ ROAD TRIP ═══ */
body{background:#141c2e}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#141c2e url('../images/hero3.webp') 72% center/cover no-repeat;pointer-events:none}
.hud-top{display:flex;align-items:center;gap:10px;background:rgba(15,26,51,.85);border:2px solid rgba(255,255,255,.08);border-radius:22px;padding:10px 12px;backdrop-filter:blur(6px)}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.me .av{position:relative;width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,var(--ora),#ff4f6d);display:grid;place-items:center;font:700 21px var(--f-display);flex:none;border:3px solid #fff}
.me .lvl{position:absolute;right:-8px;bottom:-6px;background:var(--sun);color:#3a2a00;border-radius:999px;font:800 11px var(--f-body);padding:1px 6px;border:2px solid #0f1a33}
.xpw{flex:1;min-width:0}
.xpw b{display:block;font:700 15px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border-radius:99px;background:#24345f;overflow:hidden;margin:3px 0 1px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--ora))}
.xpw small{font:800 11px var(--f-body);color:var(--mute)}
.stats{display:flex;flex-direction:column;gap:3px;font:800 13px var(--f-body);text-align:right;flex:none}
.paises{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pais{background:rgba(15,26,51,.75);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.1;color:var(--mute)}
.pais span{font-size:24px}.pais b{font:400 14px Bungee,var(--f-display);color:var(--ink);margin-top:2px}.pais small{font:800 11px var(--f-body)}
.pais.on{background:linear-gradient(160deg,var(--ora),#ff4f6d);border-color:#fff;color:#fff;box-shadow:0 5px 0 #b8400d}
.route-head{display:flex;align-items:center;gap:10px}
.route-head small{font:800 12px var(--f-body);color:var(--ora-soft);letter-spacing:.06em;text-transform:uppercase}
.route-head h2{font-size:22px;margin-top:2px}.route-head em{font-style:normal;color:var(--sun)}
.route-head > div{flex:1;min-width:0}
.rk{background:var(--panel-2);border-radius:16px;padding:6px 10px;font-size:24px;display:flex;flex-direction:column;align-items:center;line-height:1;box-shadow:0 4px 0 #0b1328}
.rk small{font:800 12px var(--f-body);color:var(--sun);margin-top:2px}
.go-now{width:100%;background:linear-gradient(140deg,#2bb673,#1f7a4c);border-radius:22px;padding:14px;font:700 21px var(--f-display);color:#fff;box-shadow:0 7px 0 #135a36;display:flex;flex-direction:column;align-items:center}
.go-now small{font:800 13px var(--f-body);opacity:.9}
.mapa{position:relative;width:100%;background:radial-gradient(circle at 20% 10%,rgba(46,160,90,.35),transparent 40%),radial-gradient(circle at 80% 60%,rgba(46,160,90,.3),transparent 45%),linear-gradient(180deg,#1d4a33,#173a2a);border-radius:28px;border:4px solid rgba(255,255,255,.12);overflow:hidden}
.road{position:absolute;inset:0;width:100%;height:100%}
.asfalto{fill:none;stroke:#2d2f3a;stroke-width:34;stroke-linecap:round}
.linea{fill:none;stroke:#ffd23f;stroke-width:3;stroke-dasharray:14 12}
.stop{position:absolute;transform:translate(-50%,-50%);background:none;padding:0;display:flex;align-items:center}
.stop .pin{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:400 20px Bungee,var(--f-display);background:#3b4766;color:#9fb0d6;border:4px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.35);flex:none;z-index:2}
.stop .lbl{position:absolute;top:50%;transform:translateY(-50%);width:132px;background:rgba(10,18,36,.82);border-radius:12px;padding:5px 9px;text-align:left;line-height:1.15}
.stop.izq .lbl{left:62px}.stop.der .lbl{right:62px;text-align:right}
.stop .lbl b{display:block;font:400 12.5px Bungee,var(--f-display);color:#fff}
.stop .lbl small{display:block;font:800 11px var(--f-body);color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop .lbl .st{color:var(--sun)}
.stop.done .pin{background:linear-gradient(140deg,#ffe57a,#f2b705);font-size:24px}
.stop.play .pin,.stop.pend .pin{background:#5b6ea3;color:#fff}
.stop.now .pin{background:linear-gradient(140deg,var(--ora),#ff4f6d);color:#fff;animation:latido 1.3s infinite}
.stop .car{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:34px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.35));animation:brinco 1s infinite;z-index:3}
@keyframes latido{50%{box-shadow:0 5px 0 rgba(0,0,0,.35),0 0 0 10px rgba(255,138,76,.35)}}
@keyframes brinco{50%{transform:translate(-50%,-5px)}}

DB.coins = DB.coins || 0; DB.xp = DB.xp || 0; DB.dias = DB.dias || []; DB.sellos = DB.sellos || {};
function hoyISO(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function marcarDia(){ var h = hoyISO(); if (DB.dias.indexOf(h) < 0) { DB.dias.push(h); DB.dias = DB.dias.slice(-60); guardarDB(); } }
function racha(){ var set = {}, n = 0; DB.dias.forEach(function(d){ set[d] = 1; }); var d = new Date(); if (!set[hoyISO()]) d.setDate(d.getDate()-1);
  while (true) { var k = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); if (!set[k]) break; n++; d.setDate(d.getDate()-1); } return n; }
function nivelXP(){ var nv = Math.floor(DB.xp / 400) + 1; return { nv:nv, en:DB.xp % 400, de:400 }; }
var RANGOS = ['Turista','Viajero','Explorador','Mochilero','Aventurero','Trotamundos','Embajador'];

// sonidos cortos (se activan con el primer toque)
var AC = null;
function sonido(tipo){
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var notas = { ok:[660,880], no:[220,180], coin:[988,1319], win:[523,659,784,1047], stamp:[140,90] }[tipo] || [440];
    notas.forEach(function(f,i){ var o = AC.createOscillator(), g = AC.createGain(); o.type = tipo==='stamp' ? 'square' : 'triangle'; o.frequency.value = f;
      var t = AC.currentTime + i * (tipo==='win' ? .11 : .07); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+.18);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.2); });
  } catch(e) {}
}

// ═════════ INICIO: el mapa del viaje ═════════
var INDEX = null, NIVEL_VISTO = ALUMNO.nivel, LECCION = null;
function promedioLeccion(lk, juegos){
  var s = DB.scores[lk] || {}, sum = 0, n = 0;
  juegos.forEach(function(j){ if (s[j] != null) { sum += s[j]; n++; } });
  return { p: n ? Math.round(sum / juegos.length) : 0, jugados:n, total:juegos.length };
}
function inicio(){
  stopTimer(); run++; LECCION = null;
  cargar(CONFIG.DATA + 'lecciones.json').then(function(ix){
    INDEX = ix;
    var P = PAISES[NIVEL_VISTO], lista = ix[NIVEL_VISTO] || [], pos = posicionRanking();
    var actual = NIVEL_VISTO === ALUMNO.nivel ? ALUMNO.leccion : 0;
    // carretera en zigzag (SVG) con una parada por lección
    var paso = 118, W = 360, H = lista.length * paso + 80, pts = lista.map(function(l,k){ return { x: k % 2 ? 262 : 98, y: 70 + k * paso }; });
    var d = 'M ' + pts[0].x + ' ' + (pts[0].y - 60); pts.forEach(function(p,k){ var prev = k ? pts[k-1] : { x:p.x, y:p.y - 60 }; var my = (prev.y + p.y) / 2; d += ' C ' + prev.x + ' ' + my + ', ' + p.x + ' ' + my + ', ' + p.x + ' ' + p.y; });
    var svg = '<svg class="road" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMin meet" aria-hidden="true"><path d="'+d+'" class="asfalto"/><path d="'+d+'" class="linea"/></svg>';
    var paradas = lista.map(function(l,k){
      var lk = NIVEL_VISTO + '-' + l.num, pr = promedioLeccion(lk, l.juegos), sello = DB.sellos[lk], estado = sello ? 'done' : (l.num === actual ? 'now' : (pr.jugados ? 'play' : (l.num < actual ? 'pend' : 'next')));
      var p = pts[k];
      return '<button class="stop '+estado+(k%2?' der':' izq')+'" data-l="'+l.num+'" style="top:'+(p.y/H*100)+'%;left:'+(p.x/W*100)+'%">' +
        '<span class="pin">'+(estado==='done' ? '🛂' : l.num)+'</span>' + (estado === 'now' ? '<span class="car">🚙</span>' : '') +
        '<span class="lbl"><b>'+esc(P.ciudades[k % P.ciudades.length])+'</b><small>L'+l.num+' · '+esc(l.titulo)+'</small>'+(pr.jugados ? '<small class="st">'+'⭐'.repeat(estrellas(pr.p))+(pr.jugados<l.juegos.length?' '+pr.jugados+'/'+l.juegos.length:'')+'</small>' : '')+'</span></button>';
    }).join('');
    app.innerHTML = header(ALUMNO.demo ? 'Demo' : 'Road Trip') + hud() +
      '<div class="paises" role="tablist">' + NIVELES.map(function(n){ var q = PAISES[n]; return '<button class="pais'+(n===NIVEL_VISTO?' on':'')+'" data-n="'+n+'"><span>'+q.bandera+'</span><b>'+q.pais+'</b><small>'+n+'</small></button>'; }).join('') + '</div>' +
      '<div class="route-head"><div><small>'+P.bandera+' '+esc(P.ruta)+'</small><h2>'+(actual ? 'Tu próxima parada: <em>'+esc(ciudad(NIVEL_VISTO, actual))+'</em>' : 'Explora la ruta de '+P.pais)+'</h2></div>' +
      '<button class="rk" id="verRanking" aria-label="Ranking del grupo">🏆<small>#'+pos.pos+'</small></button></div>' +
      (actual ? '<button class="go-now" id="hoy">🚙 ¡Arrancar en '+esc(ciudad(NIVEL_VISTO, actual))+'! <small>Lesson '+actual+' · tu clase de hoy</small></button>' : '') +
      '<div class="mapa" style="aspect-ratio:'+W+'/'+H+'">' + svg + paradas + '</div>' +
      (ALUMNO.demo ? '<p class="note">Modo demo con una alumna de ejemplo. Conectado a la plataforma, el mapa avanza con la clase real del alumno.</p>' : '');
    var bh = document.getElementById('hoy'); if (bh) bh.onclick = function(){ abrirLeccion(NIVEL_VISTO, actual); };
    document.getElementById('verRanking').onclick = ranking;
    app.querySelectorAll('.pais').forEach(function(t){ t.onclick = function(){ NIVEL_VISTO = t.dataset.n; inicio(); }; });
    app.querySelectorAll('.stop').forEach(function(b){ b.onclick = function(){ abrirLeccion(NIVEL_VISTO, +b.dataset.l); }; });
    var now = app.querySelector('.stop.now'); if (now) setTimeout(function(){ now.scrollIntoView({ block:'center', behavior:'smooth' }); }, 300);
  }).catch(function(){ app.innerHTML = header('Road Trip') + '<div class="loading">No se pudo cargar el viaje. Revisa tu conexión y vuelve a intentar.</div>'; });
}

function juegosDe(d){ return ORDEN_JUEGOS.filter(function(j){ return d.juegos[j]; }); }
function preguntasAduana(d){
  var q = (d.juegos.quiz || []).slice();
  (d.juegos.memo || []).forEach(function(p){ if (String(p.a).indexOf('icon:') === 0) return; var otros = shuffle((d.juegos.memo || []).filter(function(x){ return x !== p; })).slice(0,3).map(function(x){ return x.b; }); if (otros.length === 3) q.push({ t:'“' + p.a + '” = ?', o:[p.b].concat(otros), a:0 }); });
  (d.juegos.ordena || []).forEach(function(f){ if (f.length < 3) return; var ok = f.join(' '), m1 = shuffle(f).join(' '), m2 = f.slice().reverse().join(' '), m3 = shuffle(f).join(' '); var ops = [ok]; [m1,m2,m3].forEach(function(m){ if (ops.indexOf(m) < 0 && ops.length < 4) ops.push(m); }); if (ops.length >= 3) q.push({ t:'¿Cuál frase está bien escrita?', o:ops, a:0 }); });

function skyline(seed){
  var h = '', x = 0, r = seed * 9301 + 49297;
  function rnd(){ r = (r * 9301 + 49297) % 233280; return r / 233280; }
  while (x < 100) { var w = 5 + rnd() * 9, ht = 22 + rnd() * 58; h += '<i style="left:'+x+'%;width:'+w+'%;height:'+ht+'%"></i>'; x += w + rnd() * 2; }
  return h;
}
function jugar(id){ ({ chat:chat, memo:memo, quiz:quiz, parejas:parejas, ordena:ordena })[id](LECCION.juegos[id]); }
function terminar(id, pct, detalle){
  stopTimer(); run++;
  var nuevo = registrar(LECCION.lk, id, pct), monedas = Math.round(pct / 5), xp = pct + (id === 'aduana' ? 60 : 0);
  var antes = nivelXP().nv; DB.coins += monedas; DB.xp += xp; marcarDia();

  if (gano && !(DB.sellos[LECCION.lk] >= pct)) DB.sellos[LECCION.lk] = pct;
  guardarDB();
  var subio = nivelXP().nv > antes;
  frame(JUEGOS[id].ico + ' ' + JUEGOS[id].name,
    '<div class="res">' +
    (id === 'aduana' ? (gano ? '<div class="stamp-anim"><div class="stamp"><small>'+esc(PAISES[LECCION.nivel].pais)+'</small><b>'+esc(LECCION.ciudad)+'</b><small>APROBADO · '+hoyISO()+'</small></div></div><h2 class="big-t">¡Sello conseguido!</h2>' : '<div class="stars">🛂</div><h2 class="big-t">¡Casi pasas la Aduana!</h2><p>Necesitas 70% para el sello. ¡Inténtalo otra vez!</p>') : '<div class="stars">'+starsHTML(estrellas(pct))+'</div>') +
    '<div class="score">'+pct+'%</div><p>'+detalle+(nuevo ? ' · ¡Nuevo récord!' : '')+'</p>' +
    '<div class="loot"><span class="coin">🪙 +'+monedas+'</span><span class="xpg">⚡ +'+xp+' XP</span>'+(racha() > 1 ? '<span class="fire">🔥 '+racha()+' días</span>' : '')+'</div>' +
    (subio ? '<div class="lvlup">⬆️ ¡Subiste al nivel '+nivelXP().nv+'! Ahora eres <b>'+rango(nivelXP().nv)+'</b></div>' : '') +
    '<div class="row"><button class="btn" id="again">🔁 Otra vez</button><button class="btn ghost" id="share">📸 Compartir</button></div>' +
    '<button class="btn ghost small" id="home">📍 Volver a '+esc(LECCION.ciudad)+'</button></div>');

function lluviaMonedas(){
  var c = document.createElement('canvas'); c.className = 'confetti'; c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  var x = c.getContext('2d'), ps = [];
  for (var i=0;i<46;i++) ps.push({ x:Math.random()*c.width, y:-30-Math.random()*c.height*.6, v:3+Math.random()*4, e:['🪙','⭐','🪙','✨'][i%4] });
  var t = 0; (function f(){ x.clearRect(0,0,c.width,c.height); x.font = '26px sans-serif'; ps.forEach(function(p){ p.y += p.v; x.fillText(p.e, p.x, p.y); }); if (++t < 140) requestAnimationFrame(f); else c.remove(); })();
}

// ═════════ JUEGO: ¿QUÉ CONTESTAS? ═════════
function avatar(av, nombre){ return av ? '<img src="'+CONFIG.PERSONAJES+av+'" alt="" onerror="this.replaceWith(document.createTextNode(\''+esc(nombre).charAt(0)+'\'))">' : esc(nombre).charAt(0); }
function chat(data){
  stopTimer(); run++;
  var conversa = data.modo === 'conversa';
  var turnos = conversa ? data.turnos : data.turnos, i = 0, bien = 0, retos = 0, fallo = false;
  turnos.forEach(function(t){ if (t.o) retos++; });
  var primero = conversa ? turnos[0] : { who:data.con, av:data.av };
  frame('☕ Charla en el café',
    '<div class="hud"><span id="cp">0/'+retos+'</span><span id="cb">✅ 0</span></div>' +
    (conversa ? '' : '<p class="note" style="text-align:left">Completa la conversación con '+esc(data.con)+': elige la palabra que falta.</p>') +
    '<div class="phone"><div class="phead"><span class="pav" id="pav">'+avatar(primero.av||primero.av, primero.who)+'</span><div><b id="pwho">'+esc(primero.who)+'</b><small>en línea</small></div></div><div class="pbody" id="pbody"></div></div>' +
    '<div class="copts" id="copts"></div><div class="feedback" id="fb" aria-live="polite"></div>');
  var body = document.getElementById('pbody'), hechos = 0;
  function burbuja(html, yo, cls){ var d = document.createElement('div'); d.className = 'bub ' + (yo ? 'me' : 'them') + (cls ? ' ' + cls : ''); d.innerHTML = html; body.appendChild(d); body.scrollTop = body.scrollHeight; return d; }
  function fin(){ later(function(){ terminar('chat', Math.round(bien / Math.max(1, retos) * 100), bien+' de '+retos+' respuestas al primer intento'); }, 800); }
  function opciones(t, alAcertar){
    fallo = false;
    var opts = document.getElementById('copts'), orden = shuffle(t.o.map(function(x,k){ return { t:x, ok:k===t.a }; }));
    opts.className = 'copts' + (conversa ? '' : ' row3');
    opts.innerHTML = orden.map(function(o,k){ return '<button class="copt" data-k="'+k+'">'+esc(o.t)+'</button>'; }).join('');
    opts.querySelectorAll('.copt').forEach(function(b){
      b.onclick = function(){
        var fb = document.getElementById('fb');
        if (orden[+b.dataset.k].ok) {
          if (!fallo) { bien++; document.getElementById('cb').textContent = '✅ ' + bien; } sonido('ok');
          hechos++; document.getElementById('cp').textContent = hechos + '/' + retos;
          opts.innerHTML = ''; fb.className = 'feedback ok'; fb.textContent = fallo ? '¡Eso es!' : ['¡Perfecto!','¡Muy bien!','¡Excelente!','¡Así se dice!'][hechos % 4];
          alAcertar(orden[+b.dataset.k].t);
        } else {
          fallo = true; b.classList.add('bad','shake'); b.disabled = true; sonido('no');
          fb.className = 'feedback bad'; fb.textContent = t.pista ? '💡 ' + t.pista : 'Casi… prueba otra opción';
        }
      };
    });
  }
  function turnoConversa(){
    if (i >= turnos.length) return fin();
    var t = turnos[i];
    document.getElementById('pav').innerHTML = avatar(t.av, t.who); document.getElementById('pwho').textContent = t.who;
    var b = burbuja('<span class="typing"><i></i><i></i><i></i></span>', false);
    later(function(){
      b.innerHTML = '<small class="bwho">'+esc(t.who)+'</small>' + esc(t.msg); body.scrollTop = body.scrollHeight;
      opciones(t, function(txt){ burbuja(esc(txt) + ' <span class="tick">✓✓</span>', true, 'pop'); i++; later(turnoConversa, 900); });
    }, 750);
  }
  function turnoCompleta(){
    if (i >= turnos.length) return fin();
    var t = turnos[i], yo = t.de === 'B';

function ordena(frasesData){
  stopTimer(); run++;

  function show(){
    if (i >= frases.length) return terminar('ordena', Math.round(bien / frases.length * 100), bien+' de '+frases.length+' frases al primer intento');
    var correcta = frases[i], banco = shuffle(correcta.map(function(w,k){ return { w:w, k:k }; })), puesto = [];
    var guard = 0; while (banco.map(function(x){return x.w;}).join(' ') === correcta.join(' ') && guard++ < 10) banco = shuffle(banco);
    intentos = 0;
    frame('🚦 Arma la ruta',
      '<div class="hud"><span>Frase '+(i+1)+'/'+frases.length+'</span><span>✅ '+bien+'</span></div>' +
      '<div class="slot" id="slot" aria-live="polite"></div><div class="wbank" id="bank"></div><div class="feedback" id="fb"></div>' +
      '<div class="row"><button class="btn ghost" id="clr">↺ Borrar</button><button class="btn" id="chk" disabled>Revisar</button></div>');
    var slot = document.getElementById('slot'), bank = document.getElementById('bank');

      slot.innerHTML = puesto.map(function(x,n){ return '<button class="w in" data-n="'+n+'">'+esc(x.w)+'</button>'; }).join('') || '<span class="note">Toca las palabras de abajo</span>';
      bank.innerHTML = banco.map(function(x,n){ return puesto.indexOf(x) === -1 ? '<button class="w" data-n="'+n+'">'+esc(x.w)+'</button>' : ''; }).join('');
      slot.querySelectorAll('.w').forEach(function(b){ b.onclick = function(){ puesto.splice(+b.dataset.n,1); slot.className='slot'; render(); }; });
      bank.querySelectorAll('.w').forEach(function(b){ b.onclick = function(){ puesto.push(banco[+b.dataset.n]); render(); }; });
      document.getElementById('chk').disabled = puesto.length !== correcta.length;
    }

    document.getElementById('clr').onclick = function(){ puesto = []; slot.className = 'slot'; render(); };
    document.getElementById('chk').onclick = function(){

      }
    };
  }
  show();
}

        else { msg.innerHTML = 'Tu navegador no deja compartir directo. <b>Mantén presionada la imagen</b> para guardarla y súbela a tu historia o publicación.'; msg.classList.add('hl'); }
      }, 'image/png');
    }
    document.getElementById('shIG').onclick = compartir;
    document.getElementById('shFB').onclick = compartir;
    document.getElementById('home2').onclick = abrirLeccionActual;
  };
  var listo = function(){ if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go(); };
  if (logoImg.complete) listo(); else { logoImg.onload = listo; logoImg.onerror = listo; }
}

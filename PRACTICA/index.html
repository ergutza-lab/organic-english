<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Road Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: una columna tipo "consola" (máx. 560px). Inicio → lección → juego → resultado → calcomanía. Look oscuro único de Organic (navy + naranja). */
:root{
  --night:#0f1a33; --panel:#18264a; --panel-2:#21335f; --ink:#f4f1ff; --mute:#9fb0d6;
  --ora:#ff7a1a; --ora-soft:#ffb070; --mint:#3ee6a0; --rose:#ff5c7a; --sun:#ffd23f; --grape:#a77bff;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --f-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(circle at 15% -10%,rgba(255,122,26,.18),transparent 45%),radial-gradient(circle at 110% 30%,rgba(167,123,255,.16),transparent 40%);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
button{font-family:var(--f-display);cursor:pointer;border:none;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:50;margin:-16px -16px 0;padding:10px 16px;background:rgba(15,26,51,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.top .izq{display:flex;align-items:center;gap:10px;min-width:0}
.fijo{position:sticky;top:0;z-index:50;margin:-16px -16px 0;padding:0 16px 12px;background:rgba(15,26,51,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 8px 18px rgba(0,0,0,.4);display:flex;flex-direction:column;gap:10px;border-radius:0 0 22px 22px}
.fijo .top{position:static;margin:0 -16px;box-shadow:none;background:none}
.fijo .go-now{padding:10px;font-size:18px}
.mipanel{background:var(--panel-2);color:#fff;border-radius:999px;padding:7px 12px;font:800 12.5px var(--f-body);white-space:nowrap;box-shadow:0 3px 0 #0b1328}
.top img{height:68px;width:auto}
.chip{font:800 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--panel-2);color:var(--mute);border-radius:999px;padding:5px 10px}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 18px;font-weight:700;font-size:16px;background:var(--ora);box-shadow:0 5px 0 #b8400d;transition:transform .08s;text-decoration:none;color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8400d}
.btn.ghost{background:var(--panel-2);box-shadow:0 5px 0 #0b1328}
.btn.small{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* saludo */
.hello{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:22px;padding:12px 14px}
.hello .av{width:48px;height:48px;border-radius:50%;background:linear-gradient(140deg,var(--ora),#ff4f6d);display:grid;place-items:center;font:700 22px var(--f-display);flex:none}
.hello b{display:block;font:700 20px var(--f-display)}
.hello small{color:var(--mute);font-weight:800;font-size:12.5px}
.today{background:linear-gradient(140deg,var(--ora),#ff4f6d);border-radius:24px;padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 0 #b8400d;text-align:left;width:100%}
.today .k{font:800 11.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.today h2{font-size:24px;margin:2px 0}
.today .go{margin-left:auto;font-size:30px;flex:none}
.rankteaser{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#2a2160,var(--panel));border:2px solid rgba(255,210,63,.35);border-radius:22px;padding:12px 14px;font-family:var(--f-body);box-shadow:0 6px 0 #0b1328;width:100%;text-align:left}
.rankteaser .trophy{font-size:32px}
.rankteaser b{display:block;font:700 17px var(--f-display)}
.rankteaser small{color:var(--sun);font-weight:800;font-size:12.5px}
/* niveles y lecciones */
.tabs{display:flex;gap:8px;background:var(--panel);padding:6px;border-radius:999px}
.tab{flex:1;border-radius:999px;padding:9px 6px;font:700 15px var(--f-display);background:transparent;color:var(--mute)}
.tab.on{background:var(--ora);color:#fff;box-shadow:0 3px 0 #b8400d}
.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lc{background:var(--panel);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 5px 0 #0b1328;min-width:0;position:relative}
.lc .n{font:700 13px var(--f-display);color:var(--ora-soft);letter-spacing:.04em}
.lc h3{font-size:15.5px;overflow-wrap:anywhere}
.lc .st{margin-top:auto;font-size:13px;letter-spacing:1px;padding-top:4px}
.lc .st .off{opacity:.2;filter:grayscale(1)}
.lc.hoy{outline:3px solid var(--sun)}
.lc .badge{position:absolute;top:-9px;right:10px;background:var(--sun);color:#3a2a00;font:800 10.5px var(--f-body);border-radius:999px;padding:3px 8px;letter-spacing:.04em}
/* lección */
.hero{background:linear-gradient(140deg,var(--ora),#ff4f6d);border-radius:26px;padding:18px 20px;box-shadow:0 10px 0 #b8400d}
.hero .lsn{font:800 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:32px;margin:4px 0 6px}
.hero p{margin:0;font-weight:700}
.overall{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:22px;padding:14px 16px}
.ring{--p:0;width:74px;height:74px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--mint) calc(var(--p)*1%),var(--panel-2) 0)}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font:700 19px var(--f-display);font-variant-numeric:tabular-nums}
.overall h3{font-size:17px}
.overall p{margin:2px 0 8px;color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--panel);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 #0b1328;min-width:0}
.tile .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:26px}
.tile h3{font-size:18px}
.tile small{color:var(--mute);font:700 12.5px var(--f-body);line-height:1.35}
.tile .best{margin-top:auto;font:800 12px var(--f-body);color:var(--sun)}
.tile.wide{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"i h" "i s" "i b";column-gap:14px;row-gap:3px;background:linear-gradient(120deg,#0f5f3a,var(--panel))}
.tile.wide .ico{grid-area:i;width:58px;height:58px;font-size:30px;align-self:center}.tile.wide h3{grid-area:h}.tile.wide small{grid-area:s}.tile.wide .best{grid-area:b}
/* juego */
.screen{background:var(--panel);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:14px}
.gbar{display:flex;align-items:center;gap:10px}
.gbar h2{font-size:20px;flex:1;min-width:0}
.back{background:var(--panel-2);border-radius:12px;width:40px;height:40px;font-size:18px;flex:none}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.hud span{background:var(--night);border-radius:999px;padding:5px 11px;font:800 13px var(--f-body);font-variant-numeric:tabular-nums}
.timer{height:8px;border-radius:99px;background:var(--night);overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun),var(--rose));width:100%}
.q{background:var(--night);border-radius:20px;padding:18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.q .ic svg{width:84px;height:84px}
.q .txt{font:600 22px var(--f-display)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--panel-2);border-radius:16px;padding:14px 10px;font:600 16px var(--f-display);box-shadow:0 4px 0 #0b1328;min-width:0;overflow-wrap:anywhere}
.opt.ok{background:var(--mint);color:#062a1c}
.opt.bad{background:var(--rose)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.06)}}
.feedback{text-align:center;font:600 16px var(--f-display);min-height:22px}
.feedback.ok{color:var(--mint)}.feedback.bad{color:var(--rose)}
/* memorama */
.memo{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.memo.two{grid-template-columns:repeat(2,1fr)}
.mc{background:none;padding:0;aspect-ratio:3/4;perspective:700px;min-width:0}
.memo.two .mc{aspect-ratio:auto;min-height:92px}
.mc-in{position:relative;display:block;width:100%;height:100%;min-height:inherit;transition:transform .35s;transform-style:preserve-3d}
.mc.open .mc-in,.mc.done .mc-in{transform:rotateY(180deg)}
.mc-back,.mc-front{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:8px;text-align:center}
.mc-back{background:linear-gradient(150deg,var(--grape),#6a4bd6);box-shadow:0 5px 0 #432e94}
.mc-back svg{width:46%;height:auto;opacity:.9}
.mc-front{background:#fff;color:#1b2440;transform:rotateY(180deg);box-shadow:0 5px 0 #c9d2e8}
.mc.done .mc-front{background:var(--mint);color:#062a1c;box-shadow:0 5px 0 #137a52}
.mc-front svg{width:78%;height:auto}
.mtxt{font:600 15px var(--f-display);line-height:1.15;overflow-wrap:anywhere}
/* parejas */
.mgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mcol .mi{flex:1}
.mgrid:has(img.foto){grid-template-columns:1fr 1fr}
.mi.sign:has(img.foto){padding:6px}
.mi{background:var(--panel-2);border-radius:14px;padding:10px 8px;font:600 15.5px var(--f-display);box-shadow:0 4px 0 #0b1328;min-height:56px;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere}
.mi svg{width:44px;height:44px}
.mi.sel{outline:3px solid var(--sun)}
.mi.done{background:var(--mint);color:#062a1c;opacity:.55;pointer-events:none;box-shadow:none}
.mi.bad{background:var(--rose)}
/* ordena */
.slot{min-height:64px;background:var(--night);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;border:2px dashed var(--panel-2)}
.slot.ok{border-color:var(--mint)}.slot.bad{border-color:var(--rose)}
.wbank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.w{background:var(--sun);color:#3a2a00;border-radius:12px;padding:9px 13px;font:600 18px var(--f-display);box-shadow:0 4px 0 #b38f00}
.w.in{background:var(--ora);color:#fff;box-shadow:0 4px 0 #b8400d}
/* chat */
.phone{background:#0b141a;border-radius:22px;overflow:hidden;border:3px solid #22303a}
.phead{display:flex;align-items:center;gap:10px;background:#1f2c34;padding:10px 12px}
.phead b{display:block;font:700 16px var(--f-display)}
.phead small{color:#8fd9a8;font-weight:800;font-size:12px}
.pav{width:42px;height:42px;border-radius:50%;background:var(--ora);display:grid;place-items:center;font:700 18px var(--f-display);flex:none;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover;object-position:top}
.pbody{height:310px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#0b141a radial-gradient(circle,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/18px 18px}
.bub{max-width:82%;padding:8px 12px;border-radius:14px;font:700 15px var(--f-body);line-height:1.35;overflow-wrap:anywhere}
.bub.them{align-self:flex-start;background:#202c33;border-top-left-radius:4px}
.bub.me{align-self:flex-end;background:#005c4b;border-top-right-radius:4px}
.bub .hole{display:inline-block;min-width:54px;border-bottom:3px dashed var(--sun);color:var(--sun);text-align:center}
.bwho{display:block;color:var(--ora-soft);font-size:11.5px;font-weight:900}
.tick{color:#53bdeb;font-size:11px;margin-left:4px}
.typing{display:inline-flex;gap:4px;padding:4px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25;transform:translateY(-2px)}}
.copts{display:flex;flex-direction:column;gap:8px}
.copts.row3{flex-direction:row;flex-wrap:wrap;justify-content:center}
.copt{background:var(--panel-2);border-radius:16px;padding:12px 14px;font:600 16px var(--f-display);text-align:left;box-shadow:0 4px 0 #0b1328}
.copts.row3 .copt{text-align:center;min-width:28%}
.copt.bad{background:var(--rose);opacity:.7}
/* resultado / ranking / compartir */
.res{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.stars{font-size:44px;letter-spacing:6px}
.stars .off{filter:grayscale(1);opacity:.25}
.score{font:700 54px var(--f-display);font-variant-numeric:tabular-nums;line-height:1}
.res p{margin:0;color:var(--mute)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;padding-top:6px}
.pcol{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.pname{font:700 15px var(--f-display);text-align:center;overflow-wrap:anywhere}
.ppts{font:800 12px var(--f-body);color:var(--mute)}
.pbar{width:100%;border-radius:16px 16px 6px 6px;display:grid;place-items:start center;padding-top:8px;font-size:30px}
.p1 .pbar{background:linear-gradient(180deg,var(--sun),#e0a800)}
.p2 .pbar{background:linear-gradient(180deg,#d9e2f2,#9fb0d6)}
.p3 .pbar{background:linear-gradient(180deg,var(--ora-soft),var(--ora))}
.pcol.yo .pname{color:var(--sun)}
.rlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rlist li{display:flex;align-items:center;gap:10px;background:var(--night);border-radius:14px;padding:9px 12px}
.rlist li.yo{background:linear-gradient(90deg,rgba(255,122,26,.35),rgba(255,122,26,.12));outline:2px solid var(--ora)}
.rpos{width:30px;text-align:center;font:700 16px var(--f-display)}
.rname{flex:1;min-width:0;font-weight:800}
.rname em{font-style:normal;color:var(--ora-soft)}
.rpts{font:800 13px var(--f-body);color:var(--mute);font-variant-numeric:tabular-nums}
.pais.lock{opacity:.55;filter:grayscale(.7)}
.aviso{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);max-width:min(92vw,420px);background:#14213d;color:#fff;border:2px solid var(--sun);border-radius:16px;padding:12px 16px;font-weight:800;text-align:center;z-index:60;transition:transform .25s}
.aviso.on{transform:translate(-50%,0)}
.share{display:flex;flex-direction:column;gap:12px;align-items:center}
.stk-wrap{width:100%;max-width:340px;border-radius:22px;padding:6px;background:repeating-conic-gradient(#1c2a50 0 25%,#16223f 0 50%) 0 0/24px 24px}
.stk-wrap img{display:block;width:100%}
.share p{margin:0;font-size:13px;color:var(--mute);text-align:center;max-width:42ch}
.share p.hl{color:var(--ink);background:var(--panel-2);border-radius:14px;padding:10px 12px}
.ig{background:linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);box-shadow:0 5px 0 #6b1f6e}
.fb{background:#1877f2;box-shadow:0 5px 0 #0b4fa8}
.wa{background:#25d366;color:#05301a;box-shadow:0 5px 0 #138a43}
.share p.lead{color:var(--ink);font-weight:800;font-size:15px}
.shmsg{display:none;width:100%;max-width:380px;background:var(--panel-2);border-radius:16px;padding:12px 14px;text-align:left;font-size:14px}
.shmsg.on{display:flex;flex-direction:column;gap:8px}
.shmsg .okt{color:#3ee6a0}
.shmsg ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.shmsg .btn{align-self:stretch;text-align:center}
.story{display:flex;flex-direction:column;align-items:center;gap:6px}
.story img{width:150px;border-radius:14px}
.story span{font:800 12px var(--f-body);color:var(--mute)}
.loading{text-align:center;color:var(--mute);padding:30px}
@media (max-width:380px){.hero h1{font-size:27px}.opt{font-size:15px}.grid{grid-template-columns:1fr}.tile.wide{grid-template-columns:auto 1fr}}

/* ═══ ROAD TRIP ═══ */
body{background:#141c2e}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:#141c2e url('../images/hero3.webp') 72% center/cover no-repeat;pointer-events:none}
.hud-top{display:flex;align-items:center;gap:10px;background:rgba(15,26,51,.85);border:2px solid rgba(255,255,255,.08);border-radius:22px;padding:10px 12px;backdrop-filter:blur(6px)}
.me{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.me .av{position:relative;width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,var(--ora),#ff4f6d);display:grid;place-items:center;font:700 21px var(--f-display);flex:none;border:3px solid #fff}
.me .lvl{position:absolute;right:-8px;bottom:-6px;background:var(--sun);color:#3a2a00;border-radius:999px;font:800 11px var(--f-body);padding:1px 6px;border:2px solid #0f1a33}
.xpw{flex:1;min-width:0}
.xpw b{display:block;font:700 15px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:9px;border-radius:99px;background:#24345f;overflow:hidden;margin:3px 0 1px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--ora))}
.xpw small{font:800 11px var(--f-body);color:var(--mute)}
.stats{display:flex;flex-direction:column;gap:3px;font:800 13px var(--f-body);text-align:right;flex:none}
.paises{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pais{background:rgba(15,26,51,.75);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;line-height:1.1;color:var(--mute)}
.pais span{font-size:24px}.pais b{font:400 14px Bungee,var(--f-display);color:var(--ink);margin-top:2px}.pais small{font:800 11px var(--f-body)}
.pais.on{background:linear-gradient(160deg,var(--ora),#ff4f6d);border-color:#fff;color:#fff;box-shadow:0 5px 0 #b8400d}
.route-head{display:flex;align-items:center;gap:10px}
.route-head small{font:800 12px var(--f-body);color:var(--ora-soft);letter-spacing:.06em;text-transform:uppercase}
.route-head h2{font-size:22px;margin-top:2px}.route-head em{font-style:normal;color:var(--sun)}
.route-head > div{flex:1;min-width:0}
.rk{background:var(--panel-2);border-radius:16px;padding:6px 10px;font-size:24px;display:flex;flex-direction:column;align-items:center;line-height:1;box-shadow:0 4px 0 #0b1328}
.rk small{font:800 12px var(--f-body);color:var(--sun);margin-top:2px}
.go-now{width:100%;background:linear-gradient(140deg,#2bb673,#1f7a4c);border-radius:22px;padding:14px;font:700 21px var(--f-display);color:#fff;box-shadow:0 7px 0 #135a36;display:flex;flex-direction:column;align-items:center}
.go-now small{font:800 13px var(--f-body);opacity:.9}
.mapa{position:relative;width:100%;background:radial-gradient(circle at 20% 10%,rgba(46,160,90,.35),transparent 40%),radial-gradient(circle at 80% 60%,rgba(46,160,90,.3),transparent 45%),linear-gradient(180deg,#1d4a33,#173a2a);border-radius:28px;border:4px solid rgba(255,255,255,.12);overflow:hidden}
.road{position:absolute;inset:0;width:100%;height:100%}

<script>

  var p = new URLSearchParams(location.search), a = null;

  if (p.get('modo') === 'clase') a = { nombre:'Clase', grupo:p.get('grupo')||'', nivel:p.get('nivel')||'A1.1', leccion:+p.get('leccion')||1, id:'', demo:true, clase:true };

// Busca la foto de una palabra (sin importar mayúsculas ni signos). Con frase=true también la encuentra dentro de una frase (si solo hay una palabra con foto).
var _fotosLow = null, _fotosRef = null;
function _norm(t){ return String(t||'').toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim(); }
function fotoDe(txt, frase){
  if (!txt) return '';
  if (LECCION && LECCION.fotos && LECCION.fotos.map(_norm).indexOf(_norm(txt)) < 0) return '';
  if (_fotosRef !== FOTOS) { _fotosRef = FOTOS; _fotosLow = {}; Object.keys(FOTOS).forEach(function(k){ _fotosLow[_norm(k)] = FOTOS[k]; }); }
  var n = _norm(txt); if (_fotosLow[n]) return _fotosLow[n];
  if (!frase) return '';
  var hits = Object.keys(_fotosLow).filter(function(k){ return k.length > 2 && (' '+n+' ').indexOf(' '+k+' ') >= 0; });
  hits = hits.filter(function(k){ return !hits.some(function(o){ return o !== k && o.indexOf(k) >= 0; }); });
  return hits.length === 1 ? _fotosLow[hits[0]] : '';
}

function conFotos(pares){ return pares.map(function(p){ var u = esEmo(p.a) && fotoDe(p.b, true); return u ? Object.assign({}, p, { a:'foto:'+u }) : p; }); }
function vis(palabra, e, cls){ var u = palabra && fotoDe(palabra); if (u) return '<img class="foto '+(cls||'')+'" src="'+esc(u)+'" alt="" loading="lazy">'; return emo(e, cls); }
function esEmo(v){ v = String(v); return v.indexOf('emo:') === 0 || v.indexOf('foto:') === 0; }
function cont(v, cls){ v = String(v); if (v.indexOf('foto:') === 0) return '<img class="foto" src="'+esc(v.slice(5))+'" alt="" loading="lazy">'; if (v.indexOf('icon:') === 0) return ICONOS[v.slice(5)] || ''; if (esEmo(v)) return emo(v.slice(4), 'emo-big'); return '<span class="'+(cls||'mtxt')+'">' + esc(v) + '</span>'; }

function decoMapa(nivel, pts, W, H, P){
  var Q = PAISAJE[nivel] || PAISAJE['A1.1'], h = '', n = pts.length;
  function pos(x, y){ return 'left:'+(x/W*100)+'%;top:'+(y/H*100)+'%'; }

  h += '<span class="lago" style="left:'+(14/W*100)+'%;top:'+(pts[Math.min(3,n-1)].y/H*100)+'%;width:'+(70/W*100)+'%;height:'+(46/H*100)+'%"></span>';

  h += '<span class="letrero" style="'+pos(220, 22)+'">'+P.bandera+' START · '+esc(P.ciudades[0])+'</span>';

  pts.forEach(function(p, k){
    var tramo = Math.min(Q.plantas.length - 1, Math.floor(k / n * Q.plantas.length));
    // planta junto a la parada, del lado libre
    h += '<span class="deco chico" style="'+pos(p.x < 180 ? 28 : 334, p.y - 22)+'">'+emo(Q.plantas[tramo])+'</span>';
    h += '<span class="deco chico" style="'+pos(p.x < 180 ? 44 : 318, p.y + 20)+'">'+emo(Q.plantas[(tramo + 1) % Q.plantas.length])+'</span>';

function sonido(tipo){
  if (ALUMNO.clase && tipo === 'ok' && PUNTO_CLASE) PUNTO_CLASE();   // modo clase: +1 al equipo en turno

    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var notas = { ok:[660,880], no:[220,180], coin:[988,1319], win:[523,659,784,1047], stamp:[140,90] }[tipo] || [440];
    notas.forEach(function(f,i){ var o = AC.createOscillator(), g = AC.createGain(); o.type = tipo==='stamp' ? 'square' : 'triangle'; o.frequency.value = f;

}

function memo(pares){
  stopTimer(); run++;

      '<p class="note" style="text-align:left">'+L('Escucha en inglés y mete a la maleta la tarjeta que significa lo mismo.','Listen and put the card with the same meaning in the suitcase.')+'</p>' +
      '<div class="mal-q"><span class="tag">🏷️</span><span class="w">'+esc(it.t)+'</span><button class="say" id="say" aria-label="'+L('Escuchar','Listen')+'">🔊</button></div>' +

        if (o === it) {

          if (!fallo) { aciertos++; maleta.push('✅'); } else maleta.push('☑️');
          fb.className = 'feedback ok'; fb.textContent = fallo ? L('¡Ahí está! A la maleta 🧳','There it is! Into the suitcase 🧳') : L('¡Perfecto! A la maleta 🧳','Perfect! Into the suitcase 🧳');

// ═════════ JUEGO: ORDENA LA FRASE ═════════
function ordena(frasesData){
  stopTimer(); run++;
  var frases = shuffle(frasesData).slice(0, 5), i = 0, bien = 0, intentos = 0;
  function show(){
    if (i >= frases.length) return terminar('ordena', Math.round(bien / frases.length * 100), bien+L(' de ',' of ')+frases.length+L(' frases al primer intento',' sentences on the first try'));
    var correcta = frases[i], banco = shuffle(correcta.map(function(w,k){ return { w:w, k:k }; })), puesto = [];
    var guard = 0; while (banco.map(function(x){return x.w;}).join(' ') === correcta.join(' ') && guard++ < 10) banco = shuffle(banco);
    intentos = 0;
    frame('🚦 ' + JUEGOS.ordena.name,
      '<div class="hud"><span>'+L('Frase ','Sentence ')+(i+1)+'/'+frases.length+'</span><span>✅ '+bien+'</span></div>' +
      '<div class="slot" id="slot" aria-live="polite"></div><div class="wbank" id="bank"></div><div class="feedback" id="fb"></div>' +
      '<div class="row"><button class="btn ghost" id="clr">↺ '+L('Borrar','Clear')+'</button><button class="btn" id="chk" disabled>'+L('Revisar','Check')+'</button></div>');
    var slot = document.getElementById('slot'), bank = document.getElementById('bank');
    function render(){
      slot.innerHTML = puesto.map(function(x,n){ return '<button class="w in" data-n="'+n+'">'+esc(x.w)+'</button>'; }).join('') || '<span class="note">'+L('Toca las palabras de abajo','Tap the words below')+'</span>';
      bank.innerHTML = banco.map(function(x,n){ return puesto.indexOf(x) === -1 ? '<button class="w" data-n="'+n+'">'+esc(x.w)+'</button>' : ''; }).join('');
      slot.querySelectorAll('.w').forEach(function(b){ b.onclick = function(){ puesto.splice(+b.dataset.n,1); slot.className='slot'; render(); }; });
      bank.querySelectorAll('.w').forEach(function(b){ b.onclick = function(){ puesto.push(banco[+b.dataset.n]); render(); }; });
      document.getElementById('chk').disabled = puesto.length !== correcta.length;
    }
    render();
    document.getElementById('clr').onclick = function(){ puesto = []; slot.className = 'slot'; render(); };
    document.getElementById('chk').onclick = function(){
      intentos++; var fb = document.getElementById('fb');
      if (puesto.map(function(x){return x.w;}).join(' ') === correcta.join(' ')) {
        if (intentos === 1) bien++;
        sonido('ok'); slot.className = 'slot ok'; fb.className = 'feedback ok'; fb.textContent = L('¡Perfecto! “','Perfect! “') + correcta.join(' ') + '”';
        i++; later(show, 1100);
      } else {
        sonido('no'); slot.className = 'slot bad shake'; fb.className = 'feedback bad'; fb.textContent = intentos >= 2 ? L('Pista: empieza con “','Tip: it starts with “') + correcta[0] + '”' : L('Mmm… revisa el orden','Hmm… check the order');
        setTimeout(function(){ slot.classList.remove('shake'); }, 400);
      }
    };
  }
  show();
}

// Solo muestra la posición y los puntos del alumno: nunca nombres ni puntos de sus compañeros.
function compartirRanking(){
  var t = tablaRanking(), pos = 0, pts = 0;
  t.forEach(function(r, k){ if (r.yo) { pos = k + 1; pts = r.p; } });
  if (!pts) return aviso(L('🚙 Juega al menos un juego esta semana para compartir tu lugar.','🚙 Play at least one game this week to share your place.'));
  var go = function(){
    var post = hacerRankPost(pos, pts), his = hacerRankHistoria(pos, pts);
    pantallaCompartir({ stk:post, his:his, post:post, titulo:L('📣 Mi lugar en el ranking','📣 My place in the ranking'), alt:L('Voy en el lugar ','I’m in place ') + pos + L(' de mi grupo esta semana',' in my group this week'),
                        archivo:'organic-english-ranking.jpg', volverTxt:L('Volver al ranking','Back to the ranking'), volver:function(){ ranking(); } });
  };
  conQR(function(){ if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go(); });
}

  x.save(); x.translate(cx, cy); x.scale(s, s); x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  // escudo / medalla
  x.save(); x.shadowColor='rgba(0,0,0,.35)'; x.shadowBlur=40; x.shadowOffsetY=18; ondas(x,0,0,330,14,24); x.fillStyle='#fff'; x.fill(); x.restore();
  var g = x.createRadialGradient(-90,-120,30,0,0,310); g.addColorStop(0,'#2b4687'); g.addColorStop(1,'#101c3a'); ondas(x,0,0,300,12,24); x.fillStyle=g; x.fill();
  x.lineWidth=8; x.strokeStyle=col[0]; x.beginPath(); x.arc(0,0,268,0,7); x.stroke();

  x.font='700 210px Fredoka, sans-serif'; x.lineJoin='round'; x.lineWidth=20; x.strokeStyle='#ff7a1a'; x.strokeText('#' + pos, 0, 95); x.fillStyle='#fff'; x.fillText('#' + pos, 0, 95);
  x.font='700 46px Fredoka, sans-serif'; x.fillStyle=col[0]; x.fillText(pts + L(' puntos',' points'), 0, 165);
  if (top) { x.font='130px sans-serif'; x.fillText(med, 215, -150); }
  else { x.font='110px sans-serif'; x.fillText('🚀', 215, -150); }
  // listón con el mensaje
  x.save(); x.shadowColor='rgba(0,0,0,.25)'; x.shadowBlur=16; x.shadowOffsetY=8; x.fillStyle='#fff'; rr(x,-460,230,920,150,34); x.fill(); x.restore();
  var gr = x.createLinearGradient(-450,0,450,0); gr.addColorStop(0,'#ff7a1a'); gr.addColorStop(1,'#ff4f6d'); x.fillStyle=gr; rr(x,-442,246,884,118,26); x.fill();
  x.fillStyle='#fff'; var l1 = top ? L('¡Voy en el lugar #','I’m number ') + pos + L(' de mi grupo!',' in my group!') : L('¡Voy subiendo en mi grupo! 🚀','I’m moving up in my group! 🚀'); ajustar(x, l1, 840, '700 54px Fredoka, sans-serif'); x.fillText(l1, 0, 302);
  var rc = racha(), l2 = ALUMNO.pila + L(' · esta semana en el English Road Trip',' · this week on the English Road Trip') + (rc > 1 ? ' · 🔥 ' + rc + L(' días',' days') : '');
  ajustar(x, l2, 840, '800 30px Nunito, sans-serif'); x.fillStyle='rgba(255,255,255,.92)'; x.fillText(l2, 0, 344);
  x.restore();
}
function fondoRank(x, W, H){
  var g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#6a4bd6'); g.addColorStop(.5,'#ff4f6d'); g.addColorStop(1,'#ff7a1a'); x.fillStyle=g; x.fillRect(0,0,W,H);
  var conf=['#ffd23f','#3ee6a0','#ffffff','#a77bff','#14213d']; for (var k=0;k<80;k++){ x.save(); x.translate((k*197)%W,(k*331)%H); x.rotate(k); x.fillStyle=conf[k%5]; x.globalAlpha=.5; x.fillRect(-9,-4,18,8); x.restore(); }
}
function hacerRankPost(pos, pts){
  var W=1080,c=document.createElement('canvas'); c.width=W; c.height=W; var x=c.getContext('2d'); fondoRank(x,W,W);
  dibujarRank(x, W/2, 440, .92, pos, pts);
  x.textAlign='center'; x.fillStyle='#14213d'; rr(x,150,950,640,90,45); x.fill();
  x.fillStyle='#ffd23f'; x.font='800 40px Nunito, sans-serif'; x.fillText('organicenglish1.com',470,1008);
  dibujarQR(x, 852, 868, 190, L('📱 Escanéame','📱 Scan me'));
  return c;
}
function hacerRankHistoria(pos, pts){
  var W=1080,H=1920,c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d'); fondoRank(x,W,H);
  x.textAlign='center'; x.fillStyle='#fff'; x.font='700 88px Fredoka, sans-serif'; x.fillText(pos <= 3 ? L('¡Estoy en el podio!','I’m on the podium!') : L('¡Voy por el podio!','Going for the podium!'), W/2, 300);
  x.font='800 44px Nunito, sans-serif'; x.fillText(L('Así voy en el ranking de mi grupo 🏆','This is my place in my group ranking 🏆'), W/2, 375);
  dibujarRank(x, W/2, 900, .95, pos, pts);
  x.fillStyle='#14213d'; rr(x,70,1610,690,170,85); x.fill();
  x.fillStyle='#fff'; x.font='700 50px Fredoka, sans-serif'; x.fillText(L('Aprende inglés conmigo','Learn English with me'),415,1685);
  x.fillStyle='#ffd23f'; x.font='800 44px Nunito, sans-serif'; x.fillText('organicenglish1.com',415,1745);
  dibujarQR(x, 800, 1600, 210, L('📱 Escanéame','📱 Scan me'));
  return c;
}

// Pantalla para compartir una calcomanía (post cuadrado + historia) en WhatsApp, Facebook e Instagram
function pantallaCompartir(o){
  var stk = o.stk, his = o.his, post = o.post;
  (function(){
    var esCel = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    var blobs = {};
    var pngs = {};
    [['post',post],['his',his]].forEach(function(p){ p[1].toBlob(function(b){ blobs[p[0]] = b; }, 'image/jpeg', .92); });
    [['post',post],['his',his]].forEach(function(p){ p[1].toBlob(function(b){ pngs[p[0]] = b; }, 'image/png'); });
    frame(o.titulo,
      '<div class="share"><div class="stk-wrap"><img src="'+stk.toDataURL('image/png')+'" alt="'+esc(o.alt)+'"></div>' +
      '<p class="lead">'+L('¿Dónde quieres compartir tu calcomanía?','Where do you want to share your sticker?')+'</p>' +
      '<div class="row"><button class="btn wa" id="shWA">💬 WhatsApp</button><button class="btn fb" id="shFB">👍 Facebook</button></div>' +
      '<button class="btn ig" id="shIG">📷 Instagram</button>' +
      '<div id="shMsg" class="shmsg" aria-live="polite"></div>' +
      '<div class="story"><img src="'+his.toDataURL('image/png')+'" alt="'+L('Versión para historias','Stories version')+'"><span>'+L('Versión para historias','Stories version')+'</span></div>' +
      '<button class="btn ghost small" id="home2">'+esc(o.volverTxt)+'</button></div>', o.volver);
    var msg = document.getElementById('shMsg');
    var REDES = {
      wa: { nombre:'WhatsApp', url:'https://web.whatsapp.com/', img:'post', pasos:EN() ? ['Open the chat or group where you want to send it.','Click the message box and press <b>Ctrl + V</b>.','You will see your sticker: press <b>Enter</b> to send it.'] : ['Abre el chat o grupo donde la quieres mandar.','Da clic en el cuadro de mensaje y presiona <b>Ctrl + V</b>.','Se verá tu calcomanía: presiona <b>Enter</b> para enviarla.'] },
      fb: { nombre:'Facebook', url:'https://www.facebook.com/', img:'post', pasos:EN() ? ['Click <b>“What’s on your mind?”</b>.','Press <b>Ctrl + V</b> to paste your sticker.','Write something if you want and click <b>Post</b>.'] : ['Da clic en <b>“¿Qué estás pensando?”</b>.','Presiona <b>Ctrl + V</b> para pegar tu calcomanía.','Escribe algo si quieres y da clic en <b>Publicar</b>.'] },
      ig: { nombre:'Instagram', url:'https://www.instagram.com/', img:'his', pasos:EN() ? ['Click <b>Create ➕</b>.','Choose <b>Select from computer</b>.','Find the image in your <b>Downloads</b> folder and post it.','💡 It’s easier on your phone: your sticker goes straight to Instagram.'] : ['Da clic en <b>Crear ➕</b>.','Elige <b>Seleccionar desde la computadora</b>.','Busca la imagen en tu carpeta de <b>Descargas</b> y publícala.','💡 Desde el celular es más fácil: tu calcomanía se manda directo a Instagram.'] }
    };
    function nombreArchivo(){ return o.archivo; }
    function panel(red, titulo, pasos){
      msg.innerHTML = '<b class="okt">'+titulo+'</b><ol>'+pasos.map(function(p){ return '<li>'+p+'</li>'; }).join('')+'</ol>' +
        '<a class="btn '+red+'" href="'+REDES[red].url+'" target="_blank" rel="noopener">'+L('Abrir ','Open ')+REDES[red].nombre+' ↗</a>';
      msg.classList.add('on'); msg.scrollIntoView({ block:'nearest', behavior:'smooth' });
    }
    function descargar(cual){ var a = document.createElement('a'); a.href = (cual === 'his' ? his : post).toDataURL('image/jpeg', .92); a.download = nombreArchivo(); document.body.appendChild(a); a.click(); a.remove(); }
    function blobDe(cual){ return blobs[cual] ? Promise.resolve(blobs[cual]) : new Promise(function(ok){ (cual === 'his' ? his : post).toBlob(function(b){ blobs[cual] = b; ok(b); }, 'image/jpeg', .92); }); }
    function enCel(red){
      var R = REDES[red];
      blobDe(R.img).then(function(b){
        var file = null; try { file = new File([b], nombreArchivo(), { type:'image/jpeg' }); } catch(e) {}
        // Solo la imagen, sin texto: si se manda texto junto, Facebook y WhatsApp se quedan con el texto y tiran la imagen.
        if (file && navigator.canShare && navigator.canShare({ files:[file] })) {
          navigator.share({ files:[file] }).catch(function(){});
        } else {
          descargar(R.img);
          panel(red, L('✅ Tu calcomanía se guardó en tu celular','✅ Your sticker was saved on your phone'), [L('Abre ','Open ') + R.nombre + '.', L('Elige la imagen de tu galería y compártela.','Choose the image from your gallery and share it.')]);
        }
      });
    }
    function enCompu(red){
      var R = REDES[red];
      if (red === 'ig' || !(navigator.clipboard && window.ClipboardItem)) {
        descargar(R.img);
        var pasos = red === 'ig' ? R.pasos : [L('Abre el chat o la publicación.','Open the chat or the post.'), L('Adjunta la imagen <b>','Attach the image <b>') + nombreArchivo() + L('</b> desde tu carpeta de Descargas.','</b> from your Downloads folder.')];
        return panel(red, L('✅ Tu calcomanía se descargó','✅ Your sticker was downloaded'), pasos);
      }
      var p = pngs[R.img] ? Promise.resolve(pngs[R.img]) : new Promise(function(ok){ (R.img === 'his' ? his : post).toBlob(ok, 'image/png'); });
      navigator.clipboard.write([new ClipboardItem({ 'image/png': p })]).then(function(){
        panel(red, L('✅ Calcomanía copiada. Ahora pégala en ','✅ Sticker copied. Now paste it in ') + R.nombre + ':', R.pasos);
      }).catch(function(){
        descargar(R.img);
        panel(red, L('✅ Tu calcomanía se descargó','✅ Your sticker was downloaded'), [L('Abre el chat o la publicación.','Open the chat or the post.'), L('Adjunta la imagen <b>','Attach the image <b>') + nombreArchivo() + L('</b> desde tu carpeta de Descargas.','</b> from your Downloads folder.')]);
      });
    }
    ['wa','fb','ig'].forEach(function(red){ document.getElementById('sh' + red.toUpperCase()).onclick = function(){ esCel ? enCel(red) : enCompu(red); }; });
    document.getElementById('home2').onclick = o.volver;
  })();
}

// ═════════ MODO CLASE: marcador por equipos (solo cuando el maestro abre los juegos) ═════════
var PUNTO_CLASE = null, QUITA_CLASE = null;   // +1 / −1 al equipo en turno (solo modo clase)
function marcadorClase(){
  var S = null; try { S = JSON.parse(sessionStorage.getItem('oe_marcador') || 'null'); } catch(e) {}
  S = S || { a:0, b:0, na:L('Equipo A','Team A'), nb:L('Equipo B','Team B'), min:false };
  if (S.turno !== 'a' && S.turno !== 'b') S.turno = 'a';
  function guardarM(){ try { sessionStorage.setItem('oe_marcador', JSON.stringify(S)); } catch(e) {} }
  var m = document.createElement('div'); m.className = 'marcador' + (S.min ? ' min' : ''); m.setAttribute('aria-label', L('Marcador por equipos','Team scoreboard'));
  function eq(k){ return '<div class="eq ' + k + (S.turno === k ? ' turno' : '') + '" data-eq="' + k + '"><span class="tt">🎯 '+L('TURNO','TURN')+'</span><span class="nm" contenteditable="true" spellcheck="false" data-k="' + k + '" title="'+L('Toca para cambiar el nombre','Tap to change the name')+'">' + esc(S['n' + k]) + '</span>' +
    '<button class="menos" data-k="' + k + '" data-d="-1" aria-label="Quitar punto">−</button><b id="mk_' + k + '">' + S[k] + '</b><button data-k="' + k + '" data-d="1" aria-label="Sumar punto">+</button></div>'; }
  m.innerHTML = '<button class="mini tog" aria-label="'+L('Mostrar u ocultar marcador','Show or hide scoreboard')+'">🏆</button>' + eq('a') + '<button class="mini swap" aria-label="'+L('Cambiar turno','Switch turn')+'" title="'+L('Cambiar turno','Switch turn')+'">⇄</button>' + eq('b') + '<button class="mini reset" aria-label="'+L('Reiniciar marcador','Reset scoreboard')+'">↺</button>';
  document.body.appendChild(m);
  var armado = false;
  m.addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if (!b) return;
    if (b.classList.contains('swap')) { ponerTurno(S.turno === 'a' ? 'b' : 'a'); return; }
    if (b.classList.contains('tog')) { S.min = !S.min; m.classList.toggle('min', S.min); return guardarM(); }
    if (b.classList.contains('reset')) {
      if (!armado) { armado = true; b.textContent = '¿0?'; b.classList.add('arm'); setTimeout(function(){ armado = false; b.textContent = '↺'; b.classList.remove('arm'); }, 2500); return; }
      S.a = 0; S.b = 0; armado = false; b.textContent = '↺'; b.classList.remove('arm');
      document.getElementById('mk_a').textContent = 0; document.getElementById('mk_b').textContent = 0; return guardarM();
    }
    var k = b.dataset.k; if (!k) return;
    S[k] = S[k] + (+b.dataset.d);
    var el = document.getElementById('mk_' + k); el.textContent = S[k];
    el.classList.remove('pum'); void el.offsetWidth; if (+b.dataset.d > 0) el.classList.add('pum');
    guardarM();
  });
  // tocar la parte de color de un equipo (no su nombre ni sus botones) también le da el turno
  m.addEventListener('click', function(ev){ var e = ev.target.closest('.eq'); if (!e || ev.target.closest('button') || ev.target.classList.contains('nm')) return; ponerTurno(e.dataset.eq); });
  function ponerTurno(k){ S.turno = k; m.querySelectorAll('.eq').forEach(function(e){ e.classList.toggle('turno', e.dataset.eq === k); }); guardarM(); }
  PUNTO_CLASE = function(){
    var k = S.turno;
    S[k]++; guardarM();
    var el = document.getElementById('mk_' + k); el.textContent = S[k]; el.classList.remove('pum'); void el.offsetWidth; el.classList.add('pum');
    var f = document.createElement('span'); f.className = 'mas1'; f.textContent = '+1'; m.querySelector('.eq.' + k).appendChild(f); setTimeout(function(){ f.remove(); }, 900);
  };
  // Respuesta equivocada: −1 al equipo en turno (puede quedar en negativo). Si se equivocan y luego aciertan, esa pregunta queda en 0.
  QUITA_CLASE = function(){
    var k = S.turno;
    S[k]--; guardarM();
    var el = document.getElementById('mk_' + k); el.textContent = S[k];
    var f = document.createElement('span'); f.className = 'mas1 menos1'; f.textContent = '−1'; m.querySelector('.eq.' + k).appendChild(f); setTimeout(function(){ f.remove(); }, 900);
  };
  m.addEventListener('keydown', function(ev){ if (ev.target.classList.contains('nm') && ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); } });
  m.addEventListener('focusout', function(ev){ var n = ev.target; if (!n.classList || !n.classList.contains('nm')) return;
    var t = n.textContent.trim().slice(0, 18) || (n.dataset.k === 'a' ? L('Equipo A','Team A') : L('Equipo B','Team B')); n.textContent = t; S['n' + n.dataset.k] = t; guardarM(); });
}
if (ALUMNO.clase) { document.body.classList.add('clase'); marcadorClase(); }
inicio();
})();
</script>

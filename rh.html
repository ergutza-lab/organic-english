<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RH · Organic English</title>
<style>
  :root{
    --bg:#0f172a; --card:#1c2b5e; --card2:#0f1a3d; --border:rgba(255,255,255,0.08);
    --text:#f1f5f9; --muted:#94a3b8; --orange:#f97316;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:linear-gradient(180deg,#0f172a,#0a0f1f);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);min-height:100vh;padding:20px;}
  .wrap{max-width:900px;margin:0 auto;}

  /* LOGIN */
  #screenLogin{display:flex;align-items:center;justify-content:center;min-height:80vh;}
  .login-box{background:var(--card);border-radius:20px;padding:36px 32px;width:100%;max-width:360px;text-align:center;border:1px solid var(--border);}
  .login-box h1{font-size:20px;margin-bottom:6px;}
  .login-box p{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .login-box input{width:100%;background:#0f172a;border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:#fff;font-size:14px;margin-bottom:12px;outline:none;}
  .login-box button{width:100%;background:linear-gradient(135deg,var(--orange),#ea580c);color:#fff;border:none;border-radius:100px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;}
  .login-error{color:#f87171;font-size:12px;margin-top:10px;display:none;}

  /* PANEL */
  #screenPanel{display:none;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
  .top-bar h1{font-size:18px;}
  .top-bar .who{font-size:12px;color:var(--muted);}
  .btn-logout{font-size:13px;color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:7px 14px;background:transparent;cursor:pointer;}

  .tabs{display:flex;gap:8px;margin-bottom:20px;}
  .tab{flex:1;text-align:center;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:13px;font-weight:700;color:var(--muted);}
  .tab.on{background:linear-gradient(135deg,var(--orange),#ea580c);color:#fff;border-color:transparent;}

  .card{background:var(--card);border-radius:16px;padding:22px;border:1px solid var(--border);margin-bottom:16px;}
  .card h3{font-size:15px;margin-bottom:16px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.3px;}
  .field input, .field select, .field textarea{width:100%;background:#0f172a;border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:#fff;font-size:14px;outline:none;font-family:inherit;}
  .field textarea{resize:vertical;min-height:70px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:600px){.grid2{grid-template-columns:1fr;}}

  .drop{border:2px dashed var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;margin-bottom:8px;}
  .drop:hover{border-color:var(--orange);}
  .drop .nombre-archivo{font-size:12px;color:#4ade80;margin-top:6px;}

  .btn-primary{width:100%;background:linear-gradient(135deg,var(--orange),#ea580c);color:#fff;border:none;border-radius:100px;padding:14px;font-size:14px;font-weight:700;cursor:pointer;margin-top:6px;}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .status-msg{font-size:13px;margin-top:10px;text-align:center;}

  .filtros{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .filtros select{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:#fff;font-size:12px;}

  .cand-card{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px;border:1px solid var(--border);}
  .cand-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .cand-nombre{font-size:15px;font-weight:700;}
  .cand-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .chip{font-size:10px;font-weight:700;padding:3px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:0.3px;}
  .chip-nuevo{background:rgba(59,130,246,0.15);color:#60a5fa;}
  .chip-contactado{background:rgba(168,85,247,0.15);color:#c084fc;}
  .chip-entrevista{background:rgba(250,204,21,0.15);color:#facc15;}
  .chip-entrevistado{background:rgba(249,115,22,0.15);color:#fb923c;}
  .chip-aceptado{background:rgba(34,197,94,0.15);color:#4ade80;}
  .chip-rechazado{background:rgba(239,68,68,0.15);color:#f87171;}
  .chip-espera{background:rgba(148,163,184,0.15);color:#cbd5e1;}

  .cand-archivos{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .link-archivo{font-size:11px;font-weight:700;text-decoration:none;padding:6px 12px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);}
  .cand-controles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  @media(max-width:600px){.cand-controles{grid-template-columns:1fr;}}
  .cand-controles select{background:#0f172a;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:#fff;font-size:12px;}
  .cand-notas{width:100%;background:#0f172a;border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:#fff;font-size:12px;font-family:inherit;resize:vertical;min-height:50px;margin-bottom:8px;}
  .cand-acciones{display:flex;gap:8px;justify-content:flex-end;}
  .btn-mini{font-size:11px;font-weight:700;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;}
  .btn-guardar{background:linear-gradient(135deg,var(--orange),#ea580c);color:#fff;}
  .btn-eliminar{background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);color:#f87171;}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN -->
  <div id="screenLogin">
    <div class="login-box">
      <h1>👥 RH · Organic English</h1>
      <p>Acceso para Dirección y Coordinación Académica</p>
      <input type="text" id="loginId" placeholder="Tu ID">
      <input type="password" id="loginClave" placeholder="Tu clave">
      <button onclick="login()">Entrar</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- PANEL -->
  <div id="screenPanel">
    <div class="top-bar">
      <div>
        <h1>👥 Recursos Humanos</h1>
        <div class="who" id="quienEntro">—</div>
      </div>
      <button class="btn-logout" onclick="logout()">Salir</button>
    </div>

    <div class="tabs">
      <div class="tab on" id="tabNuevo" onclick="cambiarTab('nuevo')">📝 Nuevo candidato</div>
      <div class="tab" id="tabLista" onclick="cambiarTab('lista')">👥 Candidatos</div>
    </div>

    <!-- TAB: NUEVO CANDIDATO -->
    <div id="vistaNuevo">
      <div class="card">
        <h3>Datos del candidato</h3>
        <div class="grid2">
          <div class="field"><label>Nombre completo *</label><input type="text" id="fNombre" placeholder="Nombre y apellidos"></div>
          <div class="field"><label>WhatsApp *</label><input type="text" id="fWhatsapp" placeholder="10 dígitos"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Email</label><input type="email" id="fEmail" placeholder="correo@ejemplo.com"></div>
          <div class="field"><label>Ciudad</label><input type="text" id="fCiudad" placeholder="Ciudad, Estado"></div>
        </div>
        <div class="grid2">
          <div class="field">
            <label>Puesto al que aplica *</label>
            <select id="fPuesto" onchange="alCambiarPuesto()">
              <option value="Maestro">Maestro</option>
              <option value="Asesor">Asesor</option>
              <option value="Asistente CE">Asistente CE</option>
              <option value="Coordinador Academico">Coordinador Académico</option>
              <option value="Colocador">Colocador</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
          <div class="field">
            <label>¿Cómo llegó?</label>
            <select id="fComoLlego">
              <option value="Grupo de WhatsApp">Grupo de WhatsApp</option>
              <option value="Referido">Referido</option>
              <option value="Redes sociales">Redes sociales</option>
              <option value="Bolsa de trabajo">Bolsa de trabajo</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
        </div>

        <div id="camposMaestro">
          <div class="grid2">
            <div class="field"><label>Nivel de inglés</label><input type="text" id="fNivelIngles" placeholder="Ej. C1, nativo, certificado Cambridge..."></div>
            <div class="field"><label>Experiencia previa</label><input type="text" id="fExperiencia" placeholder="Ej. 2 años dando clases en línea"></div>
          </div>
          <div class="field"><label>Disponibilidad de horario</label><input type="text" id="fDisponibilidad" placeholder="Ej. Tardes entre semana, sábados..."></div>
        </div>

        <div class="field"><label>Notas iniciales</label><textarea id="fNotas" placeholder="Cualquier observación inicial (opcional)"></textarea></div>
      </div>

      <div class="card">
        <h3>CV</h3>
        <div class="drop" id="dropCV" onclick="document.getElementById('inputCV').click()">
          <div>📄 Haz clic para seleccionar el CV (PDF)</div>
          <div class="nombre-archivo" id="nombreCV"></div>
        </div>
        <input type="file" id="inputCV" accept=".pdf,.doc,.docx" style="display:none" onchange="onArchivoSeleccionado(this,'cv')">
      </div>

      <div class="card">
        <h3>Video de presentación</h3>
        <div class="drop" id="dropVideo" onclick="document.getElementById('inputVideo').click()">
          <div>🎥 Haz clic para seleccionar el video</div>
          <div class="nombre-archivo" id="nombreVideo"></div>
        </div>
        <input type="file" id="inputVideo" accept="video/*" style="display:none" onchange="onArchivoSeleccionado(this,'video')">
      </div>

      <button class="btn-primary" id="btnGuardarCandidato" onclick="guardarCandidato()">Guardar candidato</button>
      <div class="status-msg" id="statusNuevo"></div>
    </div>

    <!-- TAB: LISTA DE CANDIDATOS -->
    <div id="vistaLista" style="display:none;">
      <div class="filtros">
        <select id="filtroPuesto" onchange="renderCandidatos()">
          <option value="">Todos los puestos</option>
        </select>
        <select id="filtroEstatus" onchange="renderCandidatos()">
          <option value="">Todos los estatus</option>
        </select>
      </div>
      <div id="listaCandidatos"><div class="empty">Cargando...</div></div>
    </div>

  </div>
</div>

<script>
const APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwZm4Yl1u_Qm-FSyS6FGA84wV8cp6flpHggXnslzg-PxlUD7LVD-1Iftr3NHBJwHFYO/exec';
const CARPETA_DRIVE_RH = '1vfbzur_DQEsEEDF-mABsPssrXi-CfWsL';

var miId = null, miNombre = null;
var candidatosData = [];
var puestosDisponibles = [];
var estatusDisponibles = [];
var archivoCV = null, archivoVideo = null;
var tabActual = 'nuevo';

function login(){
  var id = document.getElementById('loginId').value.trim();
  var clave = document.getElementById('loginClave').value.trim();
  if(!id || !clave){ mostrarErrorLogin('Escribe tu ID y tu clave.'); return; }

  fetch(APPS_SCRIPT+'?action=loginCA&id='+encodeURIComponent(id)+'&clave='+encodeURIComponent(clave))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.status==='ok'){ entrarPanel(data.id, data.nombre); return; }
      // Si no es Coordinador Academico, probar como Director
      fetch(APPS_SCRIPT+'?action=loginDirector&id='+encodeURIComponent(id)+'&clave='+encodeURIComponent(clave))
        .then(function(r2){ return r2.json(); })
        .then(function(data2){
          if(data2.success){ entrarPanel(data2.director.id, data2.director.nombre); }
          else { mostrarErrorLogin('ID o clave incorrectos.'); }
        })
        .catch(function(){ mostrarErrorLogin('Error de conexión.'); });
    })
    .catch(function(){ mostrarErrorLogin('Error de conexión.'); });
}

function mostrarErrorLogin(msg){
  var el = document.getElementById('loginError');
  el.textContent = msg; el.style.display = 'block';
}

function entrarPanel(id, nombre){
  miId = id; miNombre = nombre;
  document.getElementById('screenLogin').style.display = 'none';
  document.getElementById('screenPanel').style.display = 'block';
  document.getElementById('quienEntro').textContent = nombre + ' · ' + id;
  cargarCandidatos();
}

function logout(){
  miId = null; miNombre = null;
  document.getElementById('screenPanel').style.display = 'none';
  document.getElementById('screenLogin').style.display = 'flex';
  document.getElementById('loginId').value = '';
  document.getElementById('loginClave').value = '';
}

function cambiarTab(tab){
  tabActual = tab;
  document.getElementById('tabNuevo').classList.toggle('on', tab==='nuevo');
  document.getElementById('tabLista').classList.toggle('on', tab==='lista');
  document.getElementById('vistaNuevo').style.display = tab==='nuevo' ? 'block' : 'none';
  document.getElementById('vistaLista').style.display = tab==='lista' ? 'block' : 'none';
  if(tab==='lista') cargarCandidatos();
}

function alCambiarPuesto(){
  var puesto = document.getElementById('fPuesto').value;
  document.getElementById('camposMaestro').style.display = (puesto === 'Maestro') ? 'block' : 'none';
}
alCambiarPuesto();

// ── SUBIDA DE ARCHIVOS (directo a Drive, mismo patron que Challenges) ──
function onArchivoSeleccionado(input, tipo){
  var file = input.files[0];
  if(!file) return;
  if(tipo === 'cv'){
    archivoCV = file;
    document.getElementById('nombreCV').textContent = '📎 ' + file.name;
  } else {
    archivoVideo = file;
    document.getElementById('nombreVideo').textContent = '📎 ' + file.name + ' (' + (file.size/1024/1024).toFixed(1) + ' MB)';
  }
}

function subirArchivoADrive(file, nombreFinal){
  return fetch(APPS_SCRIPT + '?action=getUploadToken')
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res.token) throw new Error('No se obtuvo token de subida.');
      var metadata = JSON.stringify({ name: nombreFinal, parents: [CARPETA_DRIVE_RH] });
      var form = new FormData();
      form.append('metadata', new Blob([metadata], { type: 'application/json' }));
      form.append('file', file);
      return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + res.token },
        body: form
      });
    })
    .then(function(r){ return r.json(); })
    .then(function(driveResp){
      if(!driveResp.id) throw new Error('Error al subir a Drive.');
      return driveResp.webViewLink;
    });
}

function guardarCandidato(){
  var nombre = document.getElementById('fNombre').value.trim();
  var whatsapp = document.getElementById('fWhatsapp').value.trim();
  var status = document.getElementById('statusNuevo');

  if(!nombre || !whatsapp){
    status.style.color = '#f87171';
    status.textContent = 'Nombre y WhatsApp son obligatorios.';
    return;
  }

  var btn = document.getElementById('btnGuardarCandidato');
  btn.disabled = true;
  status.style.color = '#94a3b8';
  status.textContent = 'Guardando candidato...';

  var puesto = document.getElementById('fPuesto').value;
  var params = new URLSearchParams({
    action: 'registrarCandidatoRH',
    nombre: nombre,
    whatsapp: whatsapp,
    email: document.getElementById('fEmail').value.trim(),
    ciudad: document.getElementById('fCiudad').value.trim(),
    puesto: puesto,
    comoLlego: document.getElementById('fComoLlego').value,
    nivelIngles: puesto==='Maestro' ? document.getElementById('fNivelIngles').value.trim() : '',
    experienciaPrevia: puesto==='Maestro' ? document.getElementById('fExperiencia').value.trim() : '',
    disponibilidad: puesto==='Maestro' ? document.getElementById('fDisponibilidad').value.trim() : '',
    notas: document.getElementById('fNotas').value.trim(),
    idRegistrador: miId
  });

  fetch(APPS_SCRIPT + '?' + params.toString())
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.success){ throw new Error(data.error || 'Error al guardar.'); }
      var idCandidato = data.idCandidato;
      var subidas = [];
      if(archivoCV) subidas.push(
        subirArchivoADrive(archivoCV, idCandidato + '_CV_' + archivoCV.name)
          .then(function(url){ return fetch(APPS_SCRIPT + '?action=registrarArchivoCandidatoRH&idCandidato=' + encodeURIComponent(idCandidato) + '&tipo=cv&url=' + encodeURIComponent(url)); })
      );
      if(archivoVideo) subidas.push(
        subirArchivoADrive(archivoVideo, idCandidato + '_VIDEO_' + archivoVideo.name)
          .then(function(url){ return fetch(APPS_SCRIPT + '?action=registrarArchivoCandidatoRH&idCandidato=' + encodeURIComponent(idCandidato) + '&tipo=video&url=' + encodeURIComponent(url)); })
      );
      status.textContent = subidas.length ? 'Subiendo archivos...' : 'Guardado.';
      return Promise.all(subidas);
    })
    .then(function(){
      status.style.color = '#4ade80';
      status.textContent = '✅ Candidato registrado correctamente.';
      limpiarFormulario();
      btn.disabled = false;
    })
    .catch(function(err){
      status.style.color = '#f87171';
      status.textContent = 'Error: ' + err.message;
      btn.disabled = false;
    });
}

function limpiarFormulario(){
  ['fNombre','fWhatsapp','fEmail','fCiudad','fNivelIngles','fExperiencia','fDisponibilidad','fNotas'].forEach(function(id){
    document.getElementById(id).value = '';
  });
  document.getElementById('fPuesto').value = 'Maestro';
  document.getElementById('fComoLlego').value = 'Grupo de WhatsApp';
  alCambiarPuesto();
  archivoCV = null; archivoVideo = null;
  document.getElementById('nombreCV').textContent = '';
  document.getElementById('nombreVideo').textContent = '';
  document.getElementById('inputCV').value = '';
  document.getElementById('inputVideo').value = '';
}

// ── LISTA DE CANDIDATOS ──────────────────────────────────────────
function cargarCandidatos(){
  document.getElementById('listaCandidatos').innerHTML = '<div class="empty">Cargando...</div>';
  fetch(APPS_SCRIPT + '?action=getCandidatosRH')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.success){ document.getElementById('listaCandidatos').innerHTML = '<div class="empty">Error al cargar.</div>'; return; }
      candidatosData = data.candidatos || [];
      puestosDisponibles = data.puestos || [];
      estatusDisponibles = data.estatus || [];
      construirFiltros();
      renderCandidatos();
    })
    .catch(function(){ document.getElementById('listaCandidatos').innerHTML = '<div class="empty">Error de conexión.</div>'; });
}

function construirFiltros(){
  var selPuesto = document.getElementById('filtroPuesto');
  if(selPuesto.options.length <= 1){
    puestosDisponibles.forEach(function(p){
      var op = document.createElement('option'); op.value = p; op.textContent = p;
      selPuesto.appendChild(op);
    });
  }
  var selEstatus = document.getElementById('filtroEstatus');
  if(selEstatus.options.length <= 1){
    estatusDisponibles.forEach(function(e){
      var op = document.createElement('option'); op.value = e; op.textContent = e;
      selEstatus.appendChild(op);
    });
  }
}

function chipClaseEstatus(estatus, resolucion){
  if(resolucion === 'Aceptado') return 'chip-aceptado';
  if(resolucion === 'Rechazado') return 'chip-rechazado';
  if(resolucion === 'En espera') return 'chip-espera';
  if(estatus === 'Contactado') return 'chip-contactado';
  if(estatus === 'Entrevista agendada') return 'chip-entrevista';
  if(estatus === 'Entrevistado') return 'chip-entrevistado';
  return 'chip-nuevo';
}

function renderCandidatos(){
  var filtroPuesto = document.getElementById('filtroPuesto').value;
  var filtroEstatus = document.getElementById('filtroEstatus').value;
  var lista = candidatosData.filter(function(c){
    if(filtroPuesto && c.puesto !== filtroPuesto) return false;
    if(filtroEstatus && c.estatus !== filtroEstatus) return false;
    return true;
  });

  var cont = document.getElementById('listaCandidatos');
  if(!lista.length){ cont.innerHTML = '<div class="empty">No hay candidatos que coincidan.</div>'; return; }

  cont.innerHTML = lista.map(function(c){
    var chipClase = chipClaseEstatus(c.estatus, c.resolucion);
    var etiquetaChip = c.resolucion || c.estatus;
    var fecha = c.fechaRegistro ? new Date(c.fechaRegistro).toLocaleDateString('es-MX') : '—';

    var archivos = '';
    if(c.cvUrl) archivos += '<a class="link-archivo" href="'+c.cvUrl+'" target="_blank">📄 Ver CV</a>';
    if(c.videoUrl) archivos += '<a class="link-archivo" href="'+c.videoUrl+'" target="_blank">🎥 Ver video</a>';
    if(!c.cvUrl && !c.videoUrl) archivos = '<span style="font-size:11px;color:var(--muted);">Sin archivos subidos</span>';

    var opcionesEstatus = estatusDisponibles.map(function(e){
      return '<option value="'+e+'"'+(c.estatus===e?' selected':'')+'>'+e+'</option>';
    }).join('');
    var opcionesResolucion = ['','Aceptado','Rechazado','En espera'].map(function(r){
      return '<option value="'+r+'"'+(c.resolucion===r?' selected':'')+'>'+(r||'Sin resolución')+'</option>';
    }).join('');

    return '<div class="cand-card">'
      + '<div class="cand-top">'
        + '<div><div class="cand-nombre">'+esc(c.nombre)+'</div>'
        + '<div class="cand-sub">'+c.puesto+' · '+esc(c.ciudad||'—')+' · Registrado '+fecha+'</div></div>'
        + '<span class="chip '+chipClase+'">'+etiquetaChip+'</span>'
      + '</div>'
      + '<div class="cand-sub" style="margin-bottom:10px;">📱 '+esc(c.whatsapp)+(c.email?' · ✉️ '+esc(c.email):'')
        + (c.nivelIngles?' · Inglés: '+esc(c.nivelIngles):'')
        + (c.experienciaPrevia?' · Exp: '+esc(c.experienciaPrevia):'')
        + (c.disponibilidad?' · Disp: '+esc(c.disponibilidad):'')
        + (c.comoLlego?' · Vía: '+esc(c.comoLlego):'') + '</div>'
      + '<div class="cand-archivos">'+archivos+'</div>'
      + '<div class="cand-controles">'
        + '<select id="est-'+c.id+'">'+opcionesEstatus+'</select>'
        + '<select id="res-'+c.id+'">'+opcionesResolucion+'</select>'
      + '</div>'
      + '<input type="text" class="cand-notas" style="height:36px;" id="resp-'+c.id+'" placeholder="Responsable (ID)" value="'+esc(c.responsable||'')+'">'
      + '<textarea class="cand-notas" id="notas-'+c.id+'" placeholder="Notas...">'+esc(c.notas||'')+'</textarea>'
      + '<div class="cand-acciones">'
        + '<button class="btn-mini btn-eliminar" onclick="eliminarCandidato(\''+c.id+'\')">🗑️ Eliminar</button>'
        + '<button class="btn-mini btn-guardar" onclick="guardarCambiosCandidato(\''+c.id+'\')">💾 Guardar cambios</button>'
      + '</div>'
      + '<div class="status-msg" id="statusCand-'+c.id+'" style="display:none;text-align:left;"></div>'
    + '</div>';
  }).join('');
}

function guardarCambiosCandidato(idCandidato){
  var estatus = document.getElementById('est-'+idCandidato).value;
  var resolucion = document.getElementById('res-'+idCandidato).value;
  var responsable = document.getElementById('resp-'+idCandidato).value.trim();
  var notas = document.getElementById('notas-'+idCandidato).value.trim();
  var status = document.getElementById('statusCand-'+idCandidato);
  status.style.display = 'block'; status.style.color = '#94a3b8'; status.textContent = 'Guardando...';

  var params = new URLSearchParams({
    action: 'actualizarCandidatoRH', idCandidato: idCandidato, estatus: estatus,
    resolucion: resolucion, responsable: responsable, notas: notas, idActor: miId
  });
  fetch(APPS_SCRIPT + '?' + params.toString())
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.success){ status.style.color = '#4ade80'; status.textContent = '✅ Cambios guardados.'; cargarCandidatos(); }
      else { status.style.color = '#f87171'; status.textContent = 'Error: ' + (data.error||''); }
    })
    .catch(function(){ status.style.color = '#f87171'; status.textContent = 'Error de conexión.'; });
}

function eliminarCandidato(idCandidato){
  if(!confirm('¿Seguro que quieres eliminar a este candidato? Esta acción no se puede deshacer.')) return;
  fetch(APPS_SCRIPT + '?action=eliminarCandidatoRH&idCandidato=' + encodeURIComponent(idCandidato))
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(data.success) cargarCandidatos();
      else alert('Error: ' + (data.error||''));
    })
    .catch(function(){ alert('Error de conexión.'); });
}

function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
</script>
</body>
</html>

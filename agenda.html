<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agenda del Equipo · Organic English</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:transparent;overflow:hidden;-webkit-tap-highlight-color:transparent;display:flex;align-items:flex-start;justify-content:center}

.wrap{height:100vh;width:100%;max-width:940px;display:flex;flex-direction:column;background:#f1f5f9;border-radius:20px;overflow:hidden;}

.topbar{flex-shrink:0;background:#1c2b5e;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;color:#fff;}
.topbar h1{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;}
.topbar .quien{font-size:12px;color:#94a3b8;display:flex;align-items:center;gap:6px;}
.topbar .quien b{color:#fb923c;}
.topbar .cambiar-id{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;border-radius:8px;padding:4px 10px;font-size:11px;cursor:pointer;}
#btnActualizar{font-size:14px;padding:4px 8px;}
#btnActualizar:disabled{opacity:.6;cursor:default;}
#btnActualizar.girando{animation:girar .6s linear infinite;}
@keyframes girar{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

.resumen{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px;background:#fff;border-bottom:1px solid #e2e8f0;}
.resumen .card{background:#f8fafc;border-radius:10px;padding:8px 10px;text-align:center;}
.resumen .card .lbl{font-size:10.5px;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
.resumen .card .val{font-size:20px;font-weight:800;color:#1e293b;}
.resumen .card.vencidos .val{color:#dc2626;}
.resumen .card.proceso .val{color:#2563eb;}
.resumen .card.completados .val{color:#059669;}

.tabs{flex-shrink:0;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px 16px;background:#e2e8f0;border-bottom:1px solid #cbd5e1;}
.tab{background:#0f1c3f;border:1.5px solid transparent;color:#fff;font-size:11.5px;font-weight:700;padding:10px 8px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .15s;text-align:center;line-height:1.15;}
.tab:hover{background:#16234f;transform:translateY(-1px);}
.tab.on{background:#16234f;border-color:#fbbf24;box-shadow:0 0 0 2px rgba(251,191,36,.22);}
.tab svg{width:18px;height:18px;fill:#fbbf24;flex-shrink:0;}
.tab .cnt{background:#dc2626;color:#fbbf24;font-size:10.5px;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 rgba(220,38,38,.6);animation:cntPulse 1.4s ease-in-out infinite;}
@keyframes cntPulse{
  0%{box-shadow:0 0 0 0 rgba(220,38,38,.7);}
  70%{box-shadow:0 0 0 7px rgba(220,38,38,0);}
  100%{box-shadow:0 0 0 0 rgba(220,38,38,0);}
}
.tab.historial{grid-column:1/-1;background:#fef3c7;border-color:#fcd34d;color:#92400e;flex-direction:row;padding:8px 14px;}
.tab.historial svg{fill:#92400e;}
.tab.historial.on{background:#92400e;color:#fff;border-color:#92400e;}
.tab.historial.on svg{fill:#fbbf24;}
@media (max-width:640px){.tabs{grid-template-columns:repeat(3,1fr);}}

/* ═══ CORRECCIÓN MÓVIL: en vez de forzar todo en una sola pantalla
   (overflow:hidden + 100vh, pensado para escritorio), dejamos que la
   página completa haga scroll normal. Así, sin importar cuánto espacio
   ocupen el resumen/tabs/formulario, los pendientes siempre son
   alcanzables con scroll -- no dependen de que sobre espacio exacto. ═══ */
@media (max-width:640px){
  html,body{height:auto;overflow:auto;display:block;}
  .wrap{height:auto;min-height:100vh;overflow:visible;border-radius:0;}
  .lista{flex:none;overflow-y:visible;}
}

.addbox{flex-shrink:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;flex-direction:column;gap:8px;}
.addbox .fila1{display:flex;gap:8px;}
.addbox input[type=text]{flex:1;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 14px;font-size:13.5px;outline:none;font-family:inherit;}
.addbox input[type=text]:focus{border-color:#f97316;}
.addbox .fila2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.addbox select, .addbox input[type=date]{border:1.5px solid #cbd5e1;border-radius:10px;padding:8px 10px;font-size:12.5px;font-family:inherit;color:#334155;}
.addbox button.add{background:#f97316;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;margin-left:auto;}
.addbox button.add:hover{background:#ea580c;}
.addbox label{font-size:11.5px;color:#64748b;font-weight:700;}

.lista{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
.item{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px 16px;}
.item.vencido{border-color:#fca5a5;background:#fef2f2;}
.item .cabeza{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
.item .texto{font-size:14px;color:#1e293b;font-weight:600;line-height:1.4;}
.item .meta{font-size:11.5px;color:#94a3b8;margin-bottom:8px;}
.item .meta b{color:#475569;}
.item .cat-chip{display:inline-block;background:#eef2ff;color:#4338ca;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;margin-right:6px;}
.prio-chip{font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;flex-shrink:0;}
.prio-chip.Urgente{background:#fee2e2;color:#b91c1c;}
.prio-chip.Media{background:#fef3c7;color:#92400e;}
.prio-chip.Baja{background:#dcfce7;color:#15803d;}
.vencido-chip{display:inline-flex;align-items:center;gap:4px;background:#dc2626;color:#fff;font-size:10.5px;font-weight:800;padding:3px 10px;border-radius:999px;}
.proceso-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:8px 10px;font-size:12px;color:#1e40af;margin-bottom:8px;}
.item.resuelto{opacity:.85;background:#f0fdf4;border-color:#bbf7d0;}
.item.resuelto .texto{text-decoration:line-through;color:#4b7c5f;}
.acciones{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.btn-accion{background:#1c2b5e;color:#fff;border:none;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}
.btn-accion.completar{background:#10b981;}
.btn-accion.completar:hover{background:#059669;}
.btn-accion:hover{background:#0f1d42;}
.input-paso{flex:1;min-width:140px;border:1.5px solid #bfdbfe;border-radius:10px;padding:7px 10px;font-size:12px;font-family:inherit;}
.resuelto-tag{font-size:11px;color:#059669;font-weight:700;white-space:nowrap;}
.empty{text-align:center;color:#94a3b8;font-size:13px;padding:40px 20px;}

.status-msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1c2b5e;color:#fff;padding:10px 20px;border-radius:999px;font-size:12.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
.status-msg.show{opacity:1;}
.status-msg.error{background:#dc2626;}

.overlay-id{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100;}
.overlay-id.show{display:flex;}
.overlay-id .box{background:#fff;border-radius:16px;padding:24px;width:90%;max-width:340px;text-align:center;}
.overlay-id .box h3{font-size:15px;color:#1e293b;margin-bottom:6px;}
.overlay-id .box p{font-size:12px;color:#64748b;margin-bottom:14px;}
.overlay-id .box input{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 14px;font-size:14px;text-align:center;margin-bottom:10px;font-family:inherit;}
.overlay-id .box button{width:100%;background:#f97316;color:#fff;border:none;border-radius:10px;padding:11px;font-size:13.5px;font-weight:700;cursor:pointer;}

@media (max-width:600px){.wrap{border-radius:0;}.resumen{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <h1>📌 Agenda del Equipo</h1>
    <div class="quien">
      <button class="cambiar-id" id="btnActualizar" onclick="actualizarManual()" title="Actualizar pendientes">🔄</button>
      Firmando como <b id="quienSoy">—</b> <button class="cambiar-id" onclick="abrirOverlayId()">Cambiar</button>
    </div>
  </div>

  <div class="resumen" id="resumen"></div>

  <div class="tabs" id="tabs"></div>

  <div class="addbox" id="addbox">
    <div class="fila1">
      <input type="text" id="nuevoTexto" placeholder="Escribe un pendiente nuevo...">
    </div>
    <div class="fila2">
      <label>Prioridad</label>
      <select id="nuevaPrioridad">
        <option value="Media">Media</option>
        <option value="Urgente">Urgente</option>
        <option value="Baja">Baja</option>
      </select>
      <label>Fecha compromiso (opcional)</label>
      <input type="date" id="nuevaFecha">
      <button class="add" onclick="agregarPendiente()">➕ Agregar</button>
    </div>
  </div>

  <div class="lista" id="lista"><div class="empty">Cargando...</div></div>
</div>

<div class="overlay-id" id="overlayId">
  <div class="box">
    <h3>¿Quién eres?</h3>
    <p>Escribe tu ID de acceso (el mismo que usas para entrar a tu plataforma).</p>
    <input type="text" id="inputMiId" placeholder="Ej: MAE-01, CA-01, ASI-01..." onkeypress="if(event.key==='Enter')guardarMiId()">
    <button onclick="guardarMiId()">Continuar</button>
  </div>
</div>

<div class="status-msg" id="statusMsg"></div>

<script>
const APPS_SCRIPT = 'https://script.google.com/macros/s/AKfycbwZm4Yl1u_Qm-FSyS6FGA84wV8cp6flpHggXnslzg-PxlUD7LVD-1Iftr3NHBJwHFYO/exec';
var SVG_ICONOS = {
  direccion:   '<svg viewBox="0 0 24 24"><path d="M12 2 2 8v2h20V8L12 2zM4 11v8H2v2h20v-2h-2v-8h-2v8h-3v-8h-2v8h-2v-8H9v8H6v-8H4z"/></svg>',
  academico:   '<svg viewBox="0 0 24 24"><path d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3zm0 8.5L5 7.68 12 4l7 3.68-7 3.82zM5 13.18v3.99L12 21l7-3.83v-3.99l-7 3.82-7-3.82z"/></svg>',
  escolar:     '<svg viewBox="0 0 24 24"><path d="M12 4.5C10 3 7.6 2.2 5 2.2c-1.4 0-2.8.2-4 .6v14.9c1.2-.4 2.6-.6 4-.6 2.6 0 5 .8 7 2.3 2-1.5 4.4-2.3 7-2.3 1.4 0 2.8.2 4 .6V2.8c-1.2-.4-2.6-.6-4-.6-2.6 0-5 .8-7 2.3z"/></svg>',
  ventas:      '<svg viewBox="0 0 24 24"><path d="M16 6l2.3 2.3-4.9 4.9-4-4L2 16.6 3.4 18l6-6 4 4 6.3-6.3L22 12V6z"/></svg>',
  it:          '<svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm-2 13h20v2H2z"/></svg>',
  maestros:    '<svg viewBox="0 0 24 24"><path d="M4 4h16v10H8l-4 4V4zm2 3v1h12V7zm0 3v1h9v-1z"/></svg>',
  colocacion:  '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6zm0-9a3 3 0 1 0 3 3 3 3 0 0 0-3-3z"/></svg>',
  asistentes:  '<svg viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 0 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8z"/></svg>',
  asesores:    '<svg viewBox="0 0 24 24"><path d="M10 2a2 2 0 0 0-2 2v1H4a2 2 0 0 0-2 2v3h20V7a2 2 0 0 0-2-2h-4V4a2 2 0 0 0-2-2zm0 3V4h4v1zM2 11v8a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-8H2z"/></svg>',
  rh:          '<svg viewBox="0 0 24 24"><path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h9v-2.5c0-.9.3-1.7.9-2.4A11.7 11.7 0 0 0 8 13zm8 0c-.6 0-1.3.1-2 .2.8.9 1.2 2 1.2 3.3V19h8v-2.5c0-2.3-4.7-3.5-7-3.5z"/></svg>',
  historial:   '<svg viewBox="0 0 24 24"><path d="M10 4H2v16h20V6H12z"/></svg>'
};
var CATEGORIAS = [
  {key:'Direccion',       label:'Dirección',        icono:SVG_ICONOS.direccion},
  {key:'Academico',       label:'Coord. Académica', icono:SVG_ICONOS.academico},
  {key:'Control Escolar', label:'Coord. Escolar',   icono:SVG_ICONOS.escolar},
  {key:'Ventas',          label:'Coord. de Ventas', icono:SVG_ICONOS.ventas},
  {key:'IT',              label:'Coord. IT',        icono:SVG_ICONOS.it},
  {key:'Maestros',        label:'Maestros',         icono:SVG_ICONOS.maestros},
  {key:'Colocacion',      label:'Colocación',       icono:SVG_ICONOS.colocacion},
  {key:'Asistentes CE',   label:'Asistentes CE',    icono:SVG_ICONOS.asistentes},
  {key:'Asesores',        label:'Asesores',         icono:SVG_ICONOS.asesores},
  {key:'RH',              label:'RH',               icono:SVG_ICONOS.rh}
];
var CAT_BY_KEY = {};
CATEGORIAS.forEach(function(c){ CAT_BY_KEY[c.key] = c; });
var tabActiva = 'Direccion';
var viendoHistorial = false;
var todosLosItems = [];
var miId = '';

function abrirOverlayId(){ document.getElementById('overlayId').classList.add('show'); document.getElementById('inputMiId').value = miId; }
function guardarMiId(){
  var v = document.getElementById('inputMiId').value.trim();
  if(!v){ return; }
  miId = v.toUpperCase();
  sessionStorage.setItem('agendaMiId', miId);
  document.getElementById('quienSoy').textContent = miId;
  document.getElementById('overlayId').classList.remove('show');
}

function mostrarStatus(msg, esError){
  var s = document.getElementById('statusMsg');
  s.textContent = msg;
  s.classList.toggle('error', !!esError);
  s.classList.add('show');
  setTimeout(function(){ s.classList.remove('show'); }, 3000);
}

function buildResumen(){
  var total = todosLosItems.length;
  var proceso = todosLosItems.filter(function(it){ return it.estado === 'En proceso'; }).length;
  var completados = todosLosItems.filter(function(it){ return it.estado === 'Completado'; }).length;
  var vencidos = todosLosItems.filter(function(it){ return it.vencido; }).length;
  document.getElementById('resumen').innerHTML =
    '<div class="card"><div class="lbl">Total</div><div class="val">'+total+'</div></div>'
    +'<div class="card proceso"><div class="lbl">En proceso</div><div class="val">'+proceso+'</div></div>'
    +'<div class="card completados"><div class="lbl">Completados</div><div class="val">'+completados+'</div></div>'
    +'<div class="card vencidos"><div class="lbl">Vencidos</div><div class="val">'+vencidos+'</div></div>';
}

function buildTabs(){
  var conteoPend = {};
  CATEGORIAS.forEach(function(c){ conteoPend[c.key] = 0; });
  todosLosItems.forEach(function(it){ if(it.estado !== 'Completado' && conteoPend[it.categoria] !== undefined) conteoPend[it.categoria]++; });

  var html = CATEGORIAS.map(function(c){
    var n = conteoPend[c.key];
    return '<div class="tab'+(!viendoHistorial && tabActiva===c.key?' on':'')+'" onclick="cambiarTab(\''+c.key+'\')">'+c.icono+'<span>'+c.label+(n>0?' <b class="cnt">'+n+'</b>':'')+'</span></div>';
  }).join('');
  html += '<div class="tab historial'+(viendoHistorial?' on':'')+'" onclick="verHistorial()">'+SVG_ICONOS.historial+'<span>Historial</span></div>';
  document.getElementById('tabs').innerHTML = html;
}

function cambiarTab(c){ tabActiva = c; viendoHistorial = false; document.getElementById('addbox').style.display='flex'; render(); }
function verHistorial(){ viendoHistorial = true; document.getElementById('addbox').style.display='none'; render(); }

function fmtFecha(f, conHora){
  if(!f) return '';
  var d = new Date(f);
  var opts = conHora ? {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'} : {day:'numeric', month:'short'};
  return d.toLocaleDateString('es-MX', opts);
}

function render(){
  buildResumen();
  buildTabs();
  var lista = document.getElementById('lista');
  var items;
  if(viendoHistorial){
    items = todosLosItems.filter(function(it){ return it.estado === 'Completado'; });
  } else {
    items = todosLosItems.filter(function(it){ return it.categoria === tabActiva && it.estado !== 'Completado'; });
  }

  if(!items.length){
    lista.innerHTML = '<div class="empty">'+(viendoHistorial ? 'Todavía no hay pendientes completados.' : 'No hay pendientes en esta categoría. 🎉')+'</div>';
    return;
  }

  lista.innerHTML = items.map(function(it){
    var botonesEdicion = '<div class="acciones" style="margin-top:6px;">'
      + '<button class="btn-accion" style="background:#334155;" onclick="editarItem(\''+it.id+'\')">✏️ Editar</button>'
      + '<button class="btn-accion" style="background:#7f1d1d;" onclick="eliminarItem(\''+it.id+'\')">🗑️ Eliminar</button>'
      + '</div>';

    if(it.estado === 'Completado'){
      return '<div class="item resuelto">'
        + '<div class="cabeza"><div class="texto">'+(viendoHistorial?'<span class="cat-chip">'+(CAT_BY_KEY[it.categoria]?CAT_BY_KEY[it.categoria].label:it.categoria)+'</span>':'')+esc(it.texto)+'</div>'
        + '<span class="resuelto-tag">✅ Completado</span></div>'
        + '<div class="meta"><b>'+esc(it.nombreAutor)+'</b> · '+fmtFecha(it.fechaCreacion)+' &nbsp;→&nbsp; completado por <b>'+esc(it.nombreResolvio)+'</b> · '+fmtFecha(it.fechaResolucion)+'</div>'
        + botonesEdicion
      + '</div>';
    }

    var chipVencido = it.vencido ? '<span class="vencido-chip">⚠️ Vencido</span>' : '';
    var chipFecha = it.fechaCompromiso ? '<span style="font-size:11px;color:#94a3b8;">Vence '+fmtFecha(it.fechaCompromiso)+'</span>' : '';

    var acciones;
    if(it.estado === 'Pendiente'){
      acciones = '<div class="acciones">'+chipVencido+chipFecha+'<button class="btn-accion" style="margin-left:auto;" onclick="pasarAProceso(\''+it.id+'\')">▶ Poner en proceso</button></div>'
        + botonesEdicion;
    } else { // En proceso
      var pasoActual = it.proximoPaso ? '<div class="proceso-box"><b>Próximo paso:</b> '+esc(it.proximoPaso)+'</div>' : '';
      acciones = pasoActual + '<div class="acciones">'+chipVencido+chipFecha
        + '<input type="text" class="input-paso" id="paso-'+it.id+'" placeholder="Actualizar próximo paso (opcional)">'
        + '<button class="btn-accion completar" onclick="completarItem(\''+it.id+'\')">✅ Completar</button></div>'
        + botonesEdicion;
    }

    return '<div class="item'+(it.vencido?' vencido':'')+'">'
      + '<div class="cabeza"><div class="texto">'+esc(it.texto)+'</div><span class="prio-chip '+it.prioridad+'">'+it.prioridad+'</span></div>'
      + '<div class="meta"><b>'+esc(it.nombreAutor)+'</b> · '+fmtFecha(it.fechaCreacion, true)+' · '+it.estado+'</div>'
      + acciones
    + '</div>';
  }).join('');
}

function esc(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function cargarAgenda(){
  fetch(APPS_SCRIPT + '?action=getAgendaEquipo')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.success){ document.getElementById('lista').innerHTML = '<div class="empty">Error al cargar.</div>'; return; }
      todosLosItems = data.items || [];
      render();
    })
    .catch(function(){ document.getElementById('lista').innerHTML = '<div class="empty">Error de conexión.</div>'; });
}

function actualizarManual(){
  var btn = document.getElementById('btnActualizar');
  btn.classList.add('girando');
  btn.disabled = true;
  fetch(APPS_SCRIPT + '?action=getAgendaEquipo')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data.success){ mostrarStatus('Error al actualizar.', true); return; }
      todosLosItems = data.items || [];
      render();
      mostrarStatus('🔄 Actualizado');
    })
    .catch(function(){ mostrarStatus('Error de conexión.', true); })
    .finally(function(){ btn.classList.remove('girando'); btn.disabled = false; });
}

function requerirId(cb){
  if(!miId){ abrirOverlayId(); return; }
  cb();
}

function agregarPendiente(){
  requerirId(function(){
    var texto = document.getElementById('nuevoTexto').value.trim();
    if(!texto){ return; }
    var prioridad = document.getElementById('nuevaPrioridad').value;
    var fecha = document.getElementById('nuevaFecha').value;
    var url = APPS_SCRIPT + '?action=agregarPendienteAgenda&idAutor='+encodeURIComponent(miId)+'&categoria='+encodeURIComponent(tabActiva)+'&texto='+encodeURIComponent(texto)+'&prioridad='+encodeURIComponent(prioridad);
    if(fecha) url += '&fechaCompromiso='+encodeURIComponent(fecha);
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.success){
          document.getElementById('nuevoTexto').value = '';
          document.getElementById('nuevaFecha').value = '';
          document.getElementById('nuevaPrioridad').value = 'Media';
          mostrarStatus('✅ Agregado por '+data.nombreAutor);
          cargarAgenda();
        } else {
          mostrarStatus(data.error || 'Error al agregar.', true);
        }
      })
      .catch(function(){ mostrarStatus('Error de conexión.', true); });
  });
}

function pasarAProceso(idItem){
  requerirId(function(){
    fetch(APPS_SCRIPT + '?action=actualizarEstadoAgenda&idItem='+encodeURIComponent(idItem)+'&idActor='+encodeURIComponent(miId)+'&nuevoEstado='+encodeURIComponent('En proceso'))
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.success){ mostrarStatus('▶ En proceso'); cargarAgenda(); }
        else { mostrarStatus(data.error || 'Error.', true); }
      })
      .catch(function(){ mostrarStatus('Error de conexión.', true); });
  });
}

function completarItem(idItem){
  requerirId(function(){
    var pasoInput = document.getElementById('paso-'+idItem);
    var proximoPaso = pasoInput ? pasoInput.value.trim() : '';
    var url = APPS_SCRIPT + '?action=actualizarEstadoAgenda&idItem='+encodeURIComponent(idItem)+'&idActor='+encodeURIComponent(miId)+'&nuevoEstado='+encodeURIComponent('Completado');
    if(proximoPaso) url += '&proximoPaso='+encodeURIComponent(proximoPaso);
    fetch(url)
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.success){ mostrarStatus('✅ Completado por '+data.nombreActor); cargarAgenda(); }
        else { mostrarStatus(data.error || 'Error.', true); }
      })
      .catch(function(){ mostrarStatus('Error de conexión.', true); });
  });
}

// Edita el texto de un pendiente YA EXISTENTE, sin importar en que estado
// este (Pendiente, En proceso o ya Completado en el historial) -- no
// mueve el estado ni pasa por el flujo de seguimiento, es solo una
// correccion directa de lo escrito.
function editarItem(idItem){
  var item = todosLosItems.find(function(it){ return String(it.id) === String(idItem); });
  var textoActual = item ? item.texto : '';
  requerirId(function(){
    var nuevoTexto = prompt('Editar pendiente:', textoActual);
    if (nuevoTexto === null) return; // cancelado
    nuevoTexto = nuevoTexto.trim();
    if (!nuevoTexto) { mostrarStatus('El texto no puede quedar vacío.', true); return; }
    fetch(APPS_SCRIPT + '?action=editarPendienteAgenda&idItem='+encodeURIComponent(idItem)+'&texto='+encodeURIComponent(nuevoTexto))
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.success){ mostrarStatus('✏️ Pendiente actualizado.'); cargarAgenda(); }
        else { mostrarStatus(data.error || 'Error al actualizar.', true); }
      })
      .catch(function(){ mostrarStatus('Error de conexión.', true); });
  });
}

// Elimina un pendiente por completo, sin importar su estado -- no hace
// falta completarlo primero ni pasa por el historial.
function eliminarItem(idItem){
  requerirId(function(){
    if (!confirm('¿Seguro que quieres eliminar este pendiente? Esta acción no se puede deshacer.')) return;
    fetch(APPS_SCRIPT + '?action=eliminarPendienteAgenda&idItem='+encodeURIComponent(idItem))
      .then(function(r){ return r.json(); })
      .then(function(data){
        if(data.success){ mostrarStatus('🗑️ Pendiente eliminado.'); cargarAgenda(); }
        else { mostrarStatus(data.error || 'Error al eliminar.', true); }
      })
      .catch(function(){ mostrarStatus('Error de conexión.', true); });
  });
}

// Inicio
var idGuardado = sessionStorage.getItem('agendaMiId');
if(idGuardado){ miId = idGuardado; document.getElementById('quienSoy').textContent = miId; }
else { abrirOverlayId(); }
buildResumen();
buildTabs();
cargarAgenda();
</script>
